<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0B1220" />
<title>Ondo Control</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<style>
  :root{
    --bg:#0B1220; --card:#111C30; --edge:#1D2B45; --inner:#0D1729;
    --text:#E8EDF4; --dim:#8A98AF; --accent:#F5D90A;
    --win:#2FBF71; --loss:#E5484D; --open:#5B8DEF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;}
  .wrap{max-width:700px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 110px;}
  h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;
    font-size:34px;margin:0;letter-spacing:1px;text-transform:uppercase;}
  h1 .a{color:var(--accent);}
  .disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;}
  .sub{color:var(--dim);font-size:12px;margin:2px 0 16px;}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:15px;margin-bottom:12px;}
  .stat-label{color:var(--dim);font-size:12px;margin-bottom:4px;}
  .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1;}
  .stat-sub{color:var(--dim);font-size:11px;margin-top:4px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .row>.card{flex:1;min-width:135px;margin-bottom:0;}
  label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px;}
  input,select{width:100%;background:var(--inner);border:1px solid var(--edge);
    border-radius:8px;color:var(--text);padding:11px 12px;font-size:15px;outline:none;
    font-family:inherit;}
  select{appearance:none;-webkit-appearance:none;}
  .btn{background:var(--accent);color:#0B1220;border:none;border-radius:9px;padding:12px 16px;
    font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;
    cursor:pointer;text-transform:uppercase;width:100%;}
  .btn:disabled{background:#2A3550;color:var(--dim);}
  .btn-ghost{background:transparent;border:1px solid var(--edge);color:var(--dim);}
  .btn-sm{background:transparent;border:1px solid var(--dim);color:var(--dim);border-radius:6px;
    padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;width:auto;}
  .btn-win{border-color:var(--win);color:var(--win);}
  .btn-loss{border-color:var(--loss);color:var(--loss);}
  .btn-open{border-color:var(--open);color:var(--open);}
  .badge{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.2px;
    padding:3px 10px;border-radius:4px;font-weight:600;}
  .b-open{background:#16233C;color:var(--open);}
  .b-win{background:#0F2A1D;color:var(--win);}
  .b-loss{background:#2C1417;color:var(--loss);}
  .grid{display:grid;gap:12px;}
  .muted{color:var(--dim);font-size:12px;line-height:1.5;}
  .empty{padding:26px;text-align:center;color:var(--dim);font-size:14px;}
  .flex{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .save-note{color:var(--accent);font-size:12px;margin-left:8px;}
  .quote{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--accent);}
  .tipbox{background:var(--inner);border-radius:8px;padding:10px 12px;margin-top:10px;}
  pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.65;margin:0;}
  .subtabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--edge);
    border-radius:10px;padding:5px;margin-bottom:16px;}
  .subtab{flex:1;padding:9px 2px;background:transparent;color:var(--dim);border:none;
    border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
    letter-spacing:.8px;cursor:pointer;text-transform:uppercase;white-space:nowrap;}
  .subtab.on{background:var(--accent);color:#0B1220;}
  .module{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .module .mi{font-size:26px;margin-right:12px;}
  .module .mt{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;}
  .module .md{color:var(--dim);font-size:12px;}
  .mstatus{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.2px;font-weight:700;}
  /* Vorhersage-Elemente v19 */
  .mkt{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 0;border-top:1px solid var(--edge);font-size:13px;}
  .mkt .p{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--accent);}
  .score{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1;}
  .ktab{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  .ktab th,.ktab td{padding:5px 4px;text-align:right;border-top:1px solid var(--edge);}
  .ktab th:first-child,.ktab td:first-child{text-align:left;}
  .ktab th{color:var(--dim);font-weight:500;font-size:11px;border-top:none;}
  /* Bottom-Navigation */
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,23,41,.97);
    border-top:1px solid var(--edge);display:flex;z-index:50;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);}
  .nav button{flex:1;background:none;border:none;color:var(--dim);cursor:pointer;
    font-family:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .nav button .ic{font-size:22px;line-height:1;}
  .nav button.on{color:var(--accent);}
</style>
</head>
<body>
<div id="updateBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--accent);color:#0B1220;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  align-items:center;justify-content:space-between;gap:10px;
  font-size:14px;font-weight:600;">
  <span>🔄 Update verfügbar / Mise à jour dispo / Update available</span>
  <button style="background:#0B1220;color:var(--accent);border:none;border-radius:8px;padding:8px 14px;
    font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;
    text-transform:uppercase;">Aktualisieren</button>
</div>
<div class="wrap">
  <div class="flex" style="align-items:baseline;">
    <h1>Ondo<span class="a"> Control</span></h1>
    <div id="topSaldo" class="disp" style="font-size:21px;">+0,00 €</div>
  </div>
  <div class="sub"><span id="heute"></span> · <span id="verLbl"></span> BETA<span id="saveNote" class="save-note"></span></div>
  <div id="view"></div>
</div>

<div class="nav" id="nav">
  <button data-tab="home"><span class="ic">🏠</span><span id="nvHome">Start</span></button>
  <button data-tab="wetten"><span class="ic">🎯</span><span id="nvBets">Wetten</span></button>
  <button data-tab="finanzen"><span class="ic">💰</span><span id="nvFin">Finanzen</span></button>
  <button data-tab="mehr"><span class="ic">⚙️</span><span id="nvMore">Mehr</span></button>
</div>

<script>
/* ================= VERSION & UPDATE-CHECK ================= */
var APP_VERSION = 18;
/* v19.8.0 (Backlog-Punkt F, Beschluss Ondo 8.8.): Die Versionsnummer steht ab jetzt an
   GENAU EINER Stelle. Sie wird in den Kopf geschrieben, in den Vision-Text eingesetzt und
   in jeden neuen Log-Eintrag mitgeschrieben. Bei jeder Lieferung hier hochzaehlen — sonst
   tragen neue Eintraege eine falsche Nummer. APP_VERSION bleibt davon unberuehrt; sie ist
   der Update-Zaehler gegen version.json und steht bewusst auf 18. */
var CODE_VERSION = 'v19.8.3';
(function(){ var e=document.getElementById('verLbl'); if(e) e.textContent=CODE_VERSION; })();
function checkUpdate(){
  fetch('version.json?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && Number(j.v) > APP_VERSION){
        var bar=document.getElementById('updateBar');
        if(bar){
          bar.style.display='flex';
          bar.querySelector('button').onclick=function(){
            location.href='OndoControl.html?u='+Number(j.v)+'x'+Date.now();
          };
        }
      }
    })
    .catch(function(e){ /* offline oder Datei fehlt: still bleiben */ });
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var d = JSON.parse(raw); for(var k in d) state[k]=d[k];
      if(!state.regeln) state.regeln={maxEinsatz:20}; }
  }catch(e){}
  if(!state.seedV || state.seedV < 2){
    var seedBets = [
      {id:900001, datum:"4.7.2026", match:"Kanada – Marokko", tipp:"Beide Teams treffen (Ja)", quote:2.05, einsatz:7, status:"verloren", claudeRichtig:false},
      {id:900002, datum:"4.7.2026", match:"Paraguay – Frankreich", tipp:"Frankreich über 2,5 Tore", quote:1.75, einsatz:7, status:"verloren", claudeRichtig:false},
      {id:900003, datum:"5.7.2026", match:"6er Kombi (Bra, Eng, Spa, USA, Arg, Kol)", tipp:"Alle 6 Siege", quote:62.0, einsatz:3.95, status:"offen", claudeRichtig:null},
      {id:900004, datum:"5.7.2026", match:"7er Kombi (Weiterkommen: Bra, Eng, Spa, USA, Arg, Kol, Fra)", tipp:"Alle 7 kommen weiter", quote:14.3, einsatz:2, status:"offen", claudeRichtig:null},
      {id:900005, datum:"5.7.2026", match:"7er Kombi (Weiterkommen + 2× Über 1,5)", tipp:"Alle 7 richtig", quote:13.08, einsatz:1, status:"offen", claudeRichtig:null}
    ];
    for(var i=0;i<seedBets.length;i++){
      var exists=false;
      for(var j=0;j<state.bets.length;j++){ if(state.bets[j].id===seedBets[i].id){ exists=true; break; } }
      if(!exists) state.bets.push(seedBets[i]);
    }
    state.bets.sort(function(a,b){ return b.id-a.id; });
    state.seedV = 2;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  if(state.seedV < 3){
    for(var m=0;m<state.bets.length;m++){
      if(state.bets[m].id===900001){ state.bets[m].quote=1.90; }
      if(state.bets[m].id===900002){
        state.bets[m].einsatz=5.81;
        state.bets[m].tipp="Frankreich über 2,5 Tore (Cashout: 1,19 € zurückgeholt)";
      }
    }
    state.seedV = 3;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  /* v19: alte Log-Eintraege als Archiv markieren — sie zaehlen nicht mehr in die neue Statistik,
     gehen aber auch nicht verloren (Verhaltens-Archiv der Value-Phase). */
  if(state.seedV < 4){
    (state.kiProtokoll||[]).forEach(function(e){ if(!e.aera) e.aera='v18'; });
    state.seedV = 4;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
}

/* ================= HELFER ================= */
function eur(n){ return n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function fmt(n){ return (n>=0?"+":"")+eur(n); }
function profit(b){
  if(b.status==="gewonnen") return b.einsatz*(b.quote-1);
  if(b.status==="verloren") return -b.einsatz;
  return 0;
}
function heuteStr(){
  var loc = state.lang==='fr'?'fr-FR':(state.lang==='en'?'en-GB':'de-DE');
  return new Date().toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function jetztUhr(){
  var d=new Date();
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function teamsAus(match){
  var p = String(match||'').split(/\s+[-–]\s+/);
  return { heim:(p[0]||'Heim').trim(), gast:(p[1]||'Gast').trim() };
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ================= LOG ALS TEXT (v19.7.5, Backlog-Punkt 22) =================
   Ondos Vorschlag vom 4.8. Zweck: Bildschirmfotos in Chats ersetzen. Zwoelf Ergebnisse
   als Text liegen unter 3 KB, ein Bildschirmfoto kostet rund 15 KB und ein PDF-Ausdruck
   ein Vielfaches. Reine Ausgabe — es wird nichts gespeichert, nichts gerechnet und
   nichts an ein Gehirn geschickt. */
function datumZahl(s){
  var d=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(d) return Number(d[3])*10000+Number(d[2])*100+Number(d[1]);
  var i=String(s||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(i) return Number(i[1])*10000+Number(i[2])*100+Number(i[3]);
  return null;
}
function heuteIso(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function logTextBauen(){
  var vEl=document.getElementById('logVon'), bEl=document.getElementById('logBis');
  /* v19.7.6: Standen die beiden Felder verkehrt herum (von 4.8., bis 28.7.), war das Ergebnis
     immer leer, ohne dass der Grund erkennbar war. Jetzt werden sie getauscht und der Tausch
     wird angezeigt — stillschweigend zu reparieren waere schlechter als es zu sagen. */
  var von=datumZahl(vEl&&vEl.value), bis=datumZahl(bEl&&bEl.value);
  var hinw=document.getElementById('logHinweis');
  if(hinw) hinw.textContent='';
  if(von!==null && bis!==null && von>bis){
    var tausch=vEl.value; vEl.value=bEl.value; bEl.value=tausch;
    var z=von; von=bis; bis=z;
    if(hinw) hinw.textContent=t('dateSwap');
  }
  var treffer=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    var d=datumZahl(e.datum);
    if(d===null) return;
    if(von!==null && d<von) return;
    if(bis!==null && d>bis) return;
    treffer.push(e);
  });
  treffer.sort(function(a,b){
    var x=datumZahl(a.datum)-datumZahl(b.datum);
    if(x!==0) return x;
    return String(a.match).localeCompare(String(b.match));
  });
  var feld=document.getElementById('logText');
  if(!feld) return;
  if(!treffer.length){ feld.value=t('logExpEmpty'); return; }
  var kopf='ONDO CONTROL — KI-Log '+((vEl&&vEl.value)||'?')+' bis '+((bEl&&bEl.value)||'?')+
    ' · '+treffer.length+' Eintraege · erzeugt '+new Date().toLocaleDateString('de-DE')+' '+jetztUhr();
  var zeilen=treffer.map(function(e){
    var gehirn=(e.herkunft==='flash')?'Flash':'Sonnet';
    var echt=(e.ergebnisHeim!==null && e.ergebnisHeim!==undefined &&
              e.ergebnisGast!==null && e.ergebnisGast!==undefined)
      ? (e.ergebnisHeim+':'+e.ergebnisGast) : 'offen';
    var m=(e.maerkte||[]).map(function(x){
      var st=(x.status==='richtig'||x.status==='falsch')?x.status:'offen';
      return x.label+' '+x.p+'% '+st+(x.gedreht?' [gedreht]':'');
    }).join(' · ');
    return e.datum+(e.anpfiff?(' '+e.anpfiff):'')+' · '+e.match+
      (e.wettbewerb?(' ['+e.wettbewerb+']'):'')+' · '+gehirn+(e.modell?(' '+e.modell):'')+
      ' · getippt '+e.heim+':'+e.gast+' · wirklich '+echt+
      (m?(' · '+m):'')+
      (e.bttsWort?(' · Wort '+e.bttsWort):'')+
      (e.geparkt?' [geparkt]':'')+
      (e.begruendung?(' · "'+e.begruendung+'"'):'');
  });
  feld.value=kopf+'\n\n'+zeilen.join('\n');
}

/* ================= MESSDATEN-EXPORT OHNE SCHLUESSEL — BACKLOG-PUNKT 44 (14.8.2026) =================
   Beschluss Ondo 14.8.2026, erster Bauauftrag der Grundsatzbesprechung.

   DAS PROBLEM: Die Datensicherung enthaelt state VOLLSTAENDIG, also auch apiKey,
   geminiKey und pin. Sie kann das Geraet deshalb nicht verlassen. Damit liegen sechs
   Wochen Messdaten an genau EINEM Ort — das groesste Risiko des Projekts.

   POSITIVLISTE, KEIN AUSSCHLUSSFILTER (erste Stufe): Ausgegeben wird ausschliesslich,
   was in MESS_FELDER steht. Ein spaeter hinzugefuegtes Schluesselfeld kommt dadurch gar
   nicht erst hinein. Eine Sperrliste kennt nur, was jemand vorhergesehen hat — genau
   dieser Bautyp ist am 4.8. dreimal gescheitert (lyria-3-pro-preview kam ueber das
   Wort "pro" durch den Filter).

   ZWEITE STUFE, auf den ECHTEN Daten: messGeheimFund() laeuft ueber das erzeugte
   Ergebnis, nicht ueber die Positivliste. Findet es einen verdaechtigen Feldnamen oder
   einen Wert in Schluesselform, wird NICHTS ausgegeben. Diese Stufe prueft, was die
   Positivliste nur verspricht.

   NUR AUSGEBEN: nichts gespeichert, nichts gerechnet, nichts an ein Gehirn geschickt.
   datenSichern und datenLaden sind unangetastet. KEIN Schnitt in der Messreihe.
   Kein Zeitraumfilter und kein Aera-Filter — eine Sicherung mit Datumsbereich waere
   keine Sicherung. Das v18-Archiv ist ausdruecklich enthalten (Entscheidung Ondo 14.8.). */
var MESS_FELDER = ['kiProtokoll','bets','regeln','startSaldo','eingezahlt','ausgezahlt','korrekturF','letzteSicherung'];
var MESS_VERBOTEN = /key|pin|token|secret|passw/i;

function messGeheimFund(wert, pfad){
  if(wert===null || wert===undefined) return null;
  if(typeof wert === 'string'){
    if(wert.indexOf('sk-ant-')===0 || wert.indexOf('AIza')===0) return pfad+' (Wert sieht aus wie ein Schluessel)';
    return null;
  }
  if(typeof wert !== 'object') return null;
  if(Object.prototype.toString.call(wert)==='[object Array]'){
    for(var i=0;i<wert.length;i++){
      var tA = messGeheimFund(wert[i], pfad+'['+i+']');
      if(tA) return tA;
    }
    return null;
  }
  for(var k in wert){
    if(!Object.prototype.hasOwnProperty.call(wert,k)) continue;
    if(MESS_VERBOTEN.test(k)) return pfad+'.'+k+' (Feldname)';
    var tB = messGeheimFund(wert[k], pfad+'.'+k);
    if(tB) return tB;
  }
  return null;
}

   Beschluss Ondo 13.8.2026. Bis v19.7.8 leitete maerkteBauen() die Behauptung

   Dadurch steht bei einem Teil der Alt-Eintraege das falsche Etikett im Log.

   GRENZE (zwingend): Nur Eintraege OHNE codeVersion — also von vor dem Schnitt
   bei v19.8.0. Ab dem Schnitt bedeutet 'gedreht' nur noch "Prozentzahl lag unter 50"
   und ist harmlos; eine Berichtigung dort wuerde richtige Eintraege beschaedigen.

   AUSLOESER ist die Null im Tipp, NICHT das Kennzeichen 'gedreht'. Eintraege mit
   Tipp ohne Null (z. B. 1:1) bleiben unangetastet — sie sind richtig bewertet.
   Ondos Entscheidung 13.8.: Amerika Mineiro und Remo (26.7., Tipp 1:1) bleiben stehen.

   ZWEI FAELLE:
   A  Tipp mit Null UND gedreht  -> Etikett drehen, Prozentzahl bleibt.
   B  Tipp mit Null, NICHT gedreht -> Etikett bleibt, Prozentzahl wird zum Gegenwert.

   UMKEHRBAR: Jeder geaenderte Markt bekommt fAlt mit den Ursprungswerten.

function korrFTreffer(){

    if(e.codeVersion) return;                          /* nach dem Schnitt: nicht anfassen */
    if(e.herkunft==='flash') return;                   /* nur Sonnet */
    if(!(e.heim===0 || e.gast===0)) return;            /* Ausloeser: Null im Tipp */
    (e.maerkte||[]).forEach(function(m){
      if(m.typ!=='btts' || m.fAlt) return;
      (m.gedreht ? a : b).push({e:e, m:m});
    });
  });

/* ================= MAERKTE AUS ERGEBNIS ABLEITEN (fester Code, keine KI) =================
   Gemini-Hinweis v19: Die KI nennt NUR das Ergebnis. Welche Maerkte daraus folgen,
   rechnet die App — so kann sich die KI nicht selbst widersprechen. */
function maerkteBauen(match, heim, gast, p1x2, pTore, pBtts){
  var tm = teamsAus(match);
  var ges = heim + gast;
  var m = [];
  m.push({
    typ:'1x2',
    code: heim>gast ? 'sieg_heim' : (heim<gast ? 'sieg_gast' : 'remis'),
    label: heim>gast ? ('Sieg '+tm.heim) : (heim<gast ? ('Sieg '+tm.gast) : t('draw')),
    p: p1x2, status:'offen'
  });
  /* Ja/Nein-Maerkte: unter 50 Prozent waere widerspruechlich ("Ja zu 42 %" heisst in
     Wahrheit "Nein zu 58 %"). Deshalb dreht die App die Aussage um. Rechnerisch identisch,
     aber die angezeigte Behauptung ist die, an die das Gehirn wirklich glaubt. */
  function jaNein(typ, codeA, labelA, codeB, labelB, p){
    if(p < 50) return { typ:typ, code:codeB, label:labelB, p:(100-p), gedreht:true, status:'offen' };
    return { typ:typ, code:codeA, label:labelA, p:p, status:'offen' };
  }
  m.push(jaNein('tore',
    (ges>2.5 ? 'ueber' : 'unter'), (ges>2.5 ? t('over25') : t('under25')),
    (ges>2.5 ? 'unter' : 'ueber'), (ges>2.5 ? t('under25') : t('over25')),
    pTore));
  /* v19.8.0, Backlog-Punkt F (Beschluss Ondo 5.8., gebaut 8.8.): Die Behauptung wird NICHT
     mehr aus dem getippten Ergebnis abgeleitet. Bis v19.7.8 stand hier
     var btts = (heim>0 && gast>0), und die Behauptung kippte auf "nein", sobald der Tipp
     eine Null enthielt. Sonnet beantwortete pBtts aber als "wie wahrscheinlich treffen
     beide" — dadurch wurden 15 bewertete Aussagen mit verdrehtem Etikett gefuehrt.
     Ab hier ist die Behauptung immer btts_ja; die Umdrehung greift nur noch unter 50 —
     genau wie beim Tore-Markt darueber. SCHNITT: Werte vor und ab v19.8.0 sind nicht
     vergleichbar. Altbestand NICHT anfassen, dazu ist nichts entschieden. */
  m.push(jaNein('btts',
    'btts_ja', t('bttsYes'),
    'btts_nein', t('bttsNo'),
    pBtts));
  return m;
}
/* Urteil per fester Regel — deterministisch, keine KI-Logik mehr (v19 Punkt 3) */
function marktUrteil(code, h, g){
  var ges = h + g;
  switch(code){
    case 'sieg_heim': return h > g;
    case 'sieg_gast': return g > h;
    case 'remis':     return h === g;
    case 'ueber':     return ges > 2.5;
    case 'unter':     return ges < 2.5;
    case 'btts_ja':   return (h > 0 && g > 0);
    case 'btts_nein': return !(h > 0 && g > 0);
  }
  return null;
}

/* ================= BERECHNUNG ================= */
function calc(){
  var done = state.bets.filter(function(b){return b.status!=="offen";});
  var wins = done.filter(function(b){return b.status==="gewonnen";}).length;
  var wettSaldo = done.reduce(function(s,b){return s+profit(b);},0);
  var offen = state.bets.filter(function(b){return b.status==="offen";})
                        .reduce(function(s,b){return s+b.einsatz;},0);
  var gesamt = wettSaldo + state.startSaldo;
  return {
    done:done.length, wins:wins, wettSaldo:wettSaldo, offen:offen,
    gesamt:gesamt, tipico: state.eingezahlt + gesamt - offen - (state.ausgezahlt||0),
    quoteIch: done.length? Math.round(wins/done.length*100):null
  };
}
/* Trefferquote: ab v19 Nebenkennzahl (Ergaenzung von ChatGPT), zaehlt nur v19-Aussagen */
function calcAI(){
  function zaehl(quelle){
    var n=0, tr=0;
    (state.kiProtokoll||[]).forEach(function(e){
      if(e.aera!=='v19') return;
      if((e.herkunft||'sonnet')!==quelle) return;
      (e.maerkte||[]).forEach(function(m){
        if(m.status==='richtig'){ n++; tr++; }
        else if(m.status==='falsch'){ n++; }
      });
    });
    return { n:n, tr:tr, q: n? Math.round(tr/n*100):null };
  }
  var s = zaehl('sonnet'), f = zaehl('flash');
  var n = s.n + f.n, treffer = s.tr + f.tr;
  return { n:n, tr:treffer, q: n? Math.round(treffer/n*100):null, sonnet:s, flash:f };
}
/* Kalibrierung: Hauptkennzahl ab v19. Nicht "wie oft richtig", sondern
   "stimmen die Prozentangaben mit der Wirklichkeit ueberein". */
function calcKalibrierung(quelle){
  var punkte=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    if(quelle && (e.herkunft||'sonnet')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status==='richtig'||m.status==='falsch'){
        var p=Number(m.p); if(isNaN(p)) p=50;
        punkte.push({ p:Math.max(1,Math.min(99,p)), ok:(m.status==='richtig') });
      }
    });
  });
  if(!punkte.length) return null;
  var baender=[[1,49],[50,59],[60,69],[70,79],[80,89],[90,99]];
  var zeilen=[], summe=0, n=0;
  baender.forEach(function(b){
    var g=punkte.filter(function(x){ return x.p>=b[0] && x.p<=b[1]; });
    if(!g.length) return;
    var behauptet=g.reduce(function(s,x){return s+x.p;},0)/g.length;
    var echt=g.filter(function(x){return x.ok;}).length/g.length*100;
    zeilen.push({ von:b[0], bis:b[1], n:g.length,
      behauptet:Math.round(behauptet), echt:Math.round(echt) });
    summe += Math.abs(behauptet-echt)*g.length; n+=g.length;
  });
  return { zeilen:zeilen, gesamt:punkte.length, abw: n? Math.round(summe/n):null };
}

/* Entschlossenheit (v19.7 Punkt 1): Wie oft legt sich ein Gehirn ueberhaupt fest?
   Ohne diese Zahl wird Vorsicht mit Koennen verwechselt. Wird aus vorhandenen Daten
   gerechnet, kostet keinen Aufruf und wird den Gehirnen NICHT mitgeteilt. */
function calcEntschlossenheit(quelle){
  var ps=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    if((e.herkunft||'sonnet')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status==='richtig'||m.status==='falsch'){
        var p=Number(m.p); if(isNaN(p)) p=50;
        ps.push(Math.max(1,Math.min(99,p)));
      }
    });
  });
  if(!ps.length) return null;
  var abstand = ps.reduce(function(s,p){ return s+Math.abs(p-50); },0)/ps.length;
  var ueber = ps.filter(function(p){ return p>=60; }).length;
  return { n:ps.length, abstand:Math.round(abstand*10)/10, ueber:Math.round(ueber/ps.length*100), ueberN:ueber };
}

/* ================= BRAIN-ADAPTER (Ondo Core Architektur Punkt 0) ================= */

/* v19.7 Punkt 0a: Der Schiedsrichter ist ein Messwerkzeug, kein Duell-Teilnehmer.
   Er darf ein staerkeres Modell benutzen als die Vorhersage. Zweite, getrennte Liste —
   Modellnamen werden weiterhin beim Konto erfragt, nie fest eingetragen (Lehre 10.7.). */
var GEMINI_PRO_MODELS = ['gemini-pro-latest'];
/* v19.7.2: Der Filter stand nur im Ladevorgang. Die einmal gespeicherte Liste wurde nie wieder
   geprueft — deshalb stand nach v19.7.1 immer noch deep-research in der starken Liste und
   verbrauchte acht Anfragen. Der Filter gilt jetzt auch beim Benutzen, nicht nur beim Laden. */
var MODELL_STAND = 'v19.7.4';
function modellTaugt(name, stark){
  var kurz = String(name).replace('models/','');
  /* Nur echte Gemini-Textmodelle. lyria ist ein Musikmodell und kam ueber das Wort "pro" herein. */
  if(!/^gemini-/i.test(kurz)) return false;
  if(/image|tts|live|audio|embedding|8b|deep-research|interaction|computer-use|robotics|omni|lyria|veo|imagen/i.test(kurz)) return false;
  return stark ? (/pro/i.test(kurz) && !/flash/i.test(kurz)) : /flash/i.test(kurz);
}
/* v19.7.4: Ondos Vorschlag — Gehirn und Schiedsrichter getrennt einstellbar, statt still das
   erste funktionierende Modell zu nehmen und es nirgends anzuzeigen. Neue Modelle erscheinen
   dadurch von selbst in der Auswahl; kein fester Name im Code (Lehre 10.7. bleibt gewahrt). */
function gWahl(rolle){
  /* v19.8.1 (Backlog-Punkt 29, Beschluss Ondo 9.8.): dritte Rolle 'liste'. Die Spielliste lief
     bis v19.8.0 unter rolle:'gehirn' und teilte sich das Modell mit dem zweiten Gehirn — also
     gemini-3.1-flash-lite, der kleinsten Stufe. Sie ist Messwerkzeug, nicht Messgegenstand;
     eine Aenderung hier ist deshalb KEIN Schnitt in der Messreihe (Arbeitsregel J).
     Zweck: Test, ob die seit dem 28.7. falschen Anpfiffzeiten am Modell liegen.
     NUR das Modell wird geaendert, NICHT die Temperatur — sonst waere das Ergebnis nicht lesbar. */
  var w = (rolle==='ref') ? state.gModellRef
        : (rolle==='liste') ? (state.gModellListe || 'gemini-flash-latest')
        : state.gModellGehirn;
  if(!w) return '';
  return modellTaugt(w,false) ? w : '';
}
function gListe(stark){
  var roh = (stark ? state.geminiProListe : state.geminiModelListe) || [];
  var sauber = roh.filter(function(n){ return modellTaugt(n, stark); });
  if(sauber.length !== roh.length){
    if(stark) state.geminiProListe = sauber; else state.geminiModelListe = sauber;
    save();
  }
  return sauber;
}
var pruefStark = { anfragen:0, modell:'', fallback:false, grund:'' };
/* v19.7.6: Welches Modell hat tatsaechlich geantwortet? Bisher wurde je Vorhersage
   state.geminiModel gespeichert — das wird aber nur beim allerersten Erfolg gesetzt
   ("if(!state.geminiModel)") und danach nie wieder geaendert. Nach einem Modellwechsel
   unter "Mehr" stand deshalb ein falscher Name im Log, und seit der Ruecknahme von 0a
   konnte ihn sogar der Schiedsrichter setzen. Arbeitsregel J haengt an dieser Angabe:
   Ein Korrekturfaktor ist nur so verlaesslich wie das Modell, dem er zugeordnet ist. */
var zuletztModell = { gehirn:'', ref:'' };
function gLadeModelle(stark){
  return fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(state.geminiKey))
    .then(function(r){ return r.json(); })
    .then(function(j){
      var liste=(j.models||[]).filter(function(m){
        if((m.supportedGenerationMethods||[]).indexOf('generateContent')<0) return false;
        return modellTaugt(m.name, stark);
      }).map(function(m){ return m.name.replace('models/',''); });
      /* v19.7.4: Frueher standen "stabile" Namen vor "latest". Stabil hiess in Wirklichkeit ALT —
         so landete die App auf gemini-2.0-flash-lite-001, das Google abgeschaltet hat, und im Juli
         dauerhaft auf einem Lite-Modell. Jetzt: neuere Versionsnummer zuerst, latest ganz vorn. */
      function rang(n){
        if(/latest/i.test(n)) return 999;
        var m = n.match(/gemini-(\d+(?:\.\d+)?)/i);
        var v = m ? parseFloat(m[1]) : 0;
        if(/lite/i.test(n)) v -= 0.05;
        if(/preview|exp/i.test(n)) v -= 0.01;
        return v;
      }
      var sortiert = liste.slice().sort(function(a,b){ return rang(b)-rang(a); });
      if(sortiert.length){
        if(stark) state.geminiProListe = sortiert; else state.geminiModelListe = sortiert;
        state.geminiListeStand = MODELL_STAND;
        save();
      }
      return sortiert;
    })
    .catch(function(){ return []; });
}
function geminiCall(opts, modellIndex){
  var stark = !!opts.stark;
  /* Listen, die eine aeltere Fassung angelegt hat, sind nicht vertrauenswuerdig — neu holen. */
  if(state.geminiListeStand !== MODELL_STAND){
    state.geminiProListe = null; state.geminiModelListe = null;
    state.geminiProModel = null; state.geminiModel = null;
    state.geminiListeStand = MODELL_STAND;
    save();
  }
  var eigene = gListe(stark);
  var liste = eigene.length ? eigene : (stark ? GEMINI_PRO_MODELS : GEMINI_MODELS);
  if(modellIndex===undefined && !eigene.length){
    return gLadeModelle(stark).then(function(neu){
      /* Kein staerkeres Modell fuer diesen Schluessel: lieber mit Flash pruefen als gar nicht */
      if(stark && !neu.length){ opts.stark=false; pruefStark.fallback=true; return geminiCall(opts); }
      return geminiCall(opts, 0);
    });
  }
  var gewaehlt = gWahl(opts.rolle);
  var gemerkt = gewaehlt || (stark ? state.geminiProModel : state.geminiModel);
  var modell = (modellIndex===undefined && gemerkt) ? gemerkt : liste[Math.min(modellIndex||0, liste.length-1)];
  if(stark){ pruefStark.anfragen++; pruefStark.modell = modell; }
  var parts = [];
  if(opts.imageB64) parts.push({ inlineData:{ mimeType:'image/jpeg', data:opts.imageB64 } });
  parts.push({ text: opts.prompt });
  var body = { contents:[{ parts: parts }] };
  if(opts.useSearch) body.tools = [{ google_search: {} }];
  /* v19.7.8, Backlog-Punkt 26 (Gemini, 6.8.): NUR fuer den Schiedsrichter. Er soll ablesen,
     nicht erfinden — Streuung ist dort ausschliesslich schaedlich. Arbeitsregel J steht nicht
     entgegen, weil der Schiedsrichter Messwerkzeug ist und nicht Messgegenstand; die Messreihe
     der Gehirne wird dadurch NICHT geschnitten. Fuer rolle:'gehirn' bleibt der Standardwert. */
  if(opts.rolle==='ref') body.generationConfig = { temperature: 0 };
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/'+modell+':generateContent?key='+encodeURIComponent(state.geminiKey),{
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){ j._status=r.status; return j; }); })
  .then(function(res){
    if(res.error){
      var msg = res.error.message || String(res._status);
      var idx = (modellIndex||0);
      /* v19.7.2: Frueher wurden nur bekannte Fehlermeldungen als Modellproblem erkannt. Eine
         unbekannte — etwa "You exceeded your current quota, limit: 0" — beendete den ganzen
         Lauf, obwohl weitere Modelle in der Liste standen. Jetzt gilt fuer BEIDE Listen:
         jeder Fehler heisst "dieses Modell taugt hier nicht, nimm das naechste".
         Eine Absicherung, die nur gegen vorhergesehene Stoerungen hilft, ist keine. */
      /* v19.7.3: Ein erschoepftes Kontingent ist KEIN Modellproblem. In v19.7.2 hat genau ein
         Kontingentfehler die App durch alle 14 Modelle gejagt und dabei 14 weitere Anfragen
         verbraucht — die Reparatur hat den Schaden vergroessert. Jetzt: sofort anhalten. */
      var kontingent = /exceeded your current quota|quota exceeded|resource_exhausted|limit: 0/i.test(msg);
      if(kontingent){
        return { error:{ message:'Gemini-Kontingent erschoepft ('+modell+'). Es wurde nichts geprueft. Spaeter erneut versuchen — die Messdaten sind unberuehrt.' }, _status:429, _kontingent:true };
      }
      var modellProblem = true;
      var ueberlastet = res._status===503 || /high demand|overloaded|try again/i.test(msg);
      /* Hoechstens vier Modelle je Lauf durchprobieren, damit ein Fehler nie eine ganze Liste kostet. */
      if(idx >= 3) return { error:{ message:'Gemini: vier Modelle erfolglos, zuletzt '+modell+': '+msg }, _status:res._status };
      /* v19.7.1: Beim starken Modell zaehlt JEDER Fehler als Modellproblem. Vorher wurden nur
         vorhergesehene Meldungen erkannt ("not found", "not supported"); eine unbekannte wie
         "This model only supports Interactions API" liess den ganzen Prueflauf abbrechen,
         statt zum naechsten Modell oder auf Flash zu gehen. Eine Absicherung, die nur gegen
         bekannte Stoerungen hilft, ist keine. */
      if(stark) modellProblem = true;
      if(modellProblem || ueberlastet){
        if(stark) state.geminiProModel = null; else state.geminiModel = null;
        save();
        if(idx < liste.length-1){
          return geminiCall(opts, idx+1);
        }
        if(stark){
          /* Starke Liste ist durch — gleichgueltig, woran es lag: mit Flash pruefen ist besser
             als gar nicht pruefen. */
          opts.stark = false; opts._frisch = false;
          pruefStark.fallback = true;
          pruefStark.grund = msg;
          return geminiCall(opts);
        }
        if(!opts._frisch){
          opts._frisch = true;
          state.geminiModelListe = null; save();
          return gLadeModelle(false).then(function(neu){
            if(neu.length) return geminiCall(opts, 0);
            return { error:{ message:'Gemini: kein nutzbares Modell fuer diesen Schluessel gefunden — alle '+liste.length+' probiert, zuletzt: '+msg }, _status:404 };
          });
        }
        return { error:{ message:'Gemini: alle '+liste.length+' Modelle erfolglos, zuletzt '+modell+': '+msg }, _status:res._status };
      }
      return { error:{ message:'Gemini ('+modell+'): '+msg }, _status:res._status };
    }
    try{
      var txt = (res.candidates[0].content.parts||[]).map(function(p){return p.text||'';}).join('\n');
      if(opts.rolle==='ref' || opts.rolle==='gehirn') zuletztModell[opts.rolle] = modell;
      if(stark){ if(!state.geminiProModel){ state.geminiProModel = modell; save(); } }
      else if(!state.geminiModel){ state.geminiModel = modell; save(); }
      return { content:[{ type:'text', text:txt }], stop_reason:'end_turn', _status:res._status };
    }catch(e){
      return { error:{ message:'Gemini ('+modell+'): Antwort nicht lesbar' }, _status:500 };
    }
  });
}
function hatGemini(){ return !!(state.geminiKey && state.geminiKey.length > 20); }
function hatSonnet(){ return !!(state.apiKey && state.apiKey.indexOf('sk-ant-')===0); }

/* ================= API-HELFER (Anthropic) ================= */
function apiCall(body){
  return fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'x-api-key':state.apiKey,
      'anthropic-version':'2023-06-01',
      'content-type':'application/json',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){ j._status=r.status; return j; }); });
}
function parseJsonBlock(res){
  var texte=(res.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;});
  var parsed=null;
  for(var i=texte.length-1;i>=0 && !parsed;i--){
    var c=texte[i].replace(/```json|```/g,'').trim();
    var s=c.indexOf('{'), e=c.lastIndexOf('}');
    if(s===-1||e===-1) continue;
    try{ parsed=JSON.parse(c.slice(s,e+1)); }catch(x){}
  }
  return parsed;
}
var LANGWORD={de:'Deutsch',fr:'Franzoesisch',en:'Englisch'};

/* Anthropic mit Websuche + Nachfass-Runden */
function sonnetSuche(prompt, maxUses, maxTokens){
  var messages=[{role:'user',content:prompt}];
  var runden=0;
  function schritt(res){
    if(res._status===401) throw new Error(t('keyBad'));
    if(res._status===400 && res.error && /credit/i.test(res.error.message||'')) throw new Error(t('credEmpty'));
    if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
    if(res.stop_reason==='pause_turn' && runden<3){
      runden++;
      messages.push({role:'assistant',content:res.content});
      return apiCall({model:'claude-sonnet-4-6',max_tokens:maxTokens,messages:messages,
        tools:[{type:'web_search_20250305',name:'web_search',max_uses:maxUses}]}).then(schritt);
    }
    return res;
  }
  return apiCall({model:'claude-sonnet-4-6',max_tokens:maxTokens,messages:messages,
    tools:[{type:'web_search_20250305',name:'web_search',max_uses:maxUses}]}).then(schritt);
}

/* ================= SCHRITT 1: SPIELLISTE (zweistufig, v19.6) =================
   Empfehlung von ChatGPT und Gemini (28.7.): Eine Rangfolge im selben Auftragstext
   wird vom Modell als weiche Empfehlung behandelt und ignoriert. Deshalb wird jede
   Stufe EINZELN gefragt. Erst wenn Stufe 1 zu wenig hergibt, wird Stufe 2 gefragt,
   danach Stufe 3. Die Reihenfolge ist damit erzwungen statt erbeten. */
var STUFEN = [
  { nr:1, was:'UEFA-Wettbewerbe inkl. aller Qualifikationsrunden (Champions League, Europa League, Conference League) · '+
      'Laenderspiele · erste und zweite Ligen aus England, Deutschland, Spanien, Italien, Frankreich, Niederlande, '+
      'Portugal, Belgien, Schottland, Oesterreich, Schweiz, Tuerkei, Griechenland, Tschechien, Polen, Kroatien · '+
      'nationale Pokalwettbewerbe dieser Laender' },
  { nr:2, was:'MLS · Brasilien Serie A und Serie B · Argentinien Primera Division · oberste Ligen in Norwegen, '+
      'Schweden, Daenemark, Finnland, Irland, Island · Japan J1 League · Suedkorea K League' },
  { nr:3, was:'Freundschafts- und Testspiele zwischen Profiklubs aus den unter Stufe 1 genannten Laendern' }
];
function stufeHolen(stufe){
  var prompt='Heute ist '+heuteStr()+', es ist jetzt '+jetztUhr()+' Uhr deutscher Zeit.\n\n'+
    'Suche im Web AUSSCHLIESSLICH nach Fussballspielen aus diesem genau abgegrenzten Bereich:\n'+
    stufe.was+'\n\n'+
    'Nimm nur Spiele, die HEUTE stattfinden und deren Anpfiff NACH '+jetztUhr()+' Uhr liegt. '+
    'Bereits laufende oder beendete Spiele nicht aufnehmen. Hoechstens 10 Spiele, echte Teamnamen, echte Anpfiffzeit in deutscher Zeit.\n\n'+
    'NIEMALS aufnehmen: Reserve- und Zweitmannschaften (Namen mit "II", "B", "U21", "U23") · Regionalligen, Oberligen '+
    'und sonstige Amateur-Spielklassen · Jugendspiele · Spiele hinter verschlossenen Tueren · '+
    /* v19.7.8 (Weg A, Beschluss Ondo 6.8.): Am 28.7. standen zwei 45-Minuten-Spiele des Como Cup
       in der Liste. Die App misst den Endstand nach 90 Minuten — "unter 2,5 Tore" ueber 45 Minuten
       ist aber nicht dieselbe Aussage. Keine Fehlerart des Schiedsrichters, sondern eine Luecke
       in der Spielliste. Ausgeschlossen wird das FORMAT, nicht nach Minuten gefragt. */
    'Turniere mit verkuerzter Spielzeit (Vorbereitungsturniere mit 45- oder 60-Minuten-Partien).\n'+
    'Jedes aufgenommene Spiel muss ueber die vollen 90 Minuten gehen. Im Zweifel nicht aufnehmen.\n'+
    'Nimm auch NICHTS auf, was ausserhalb des oben abgegrenzten Bereichs liegt — auch dann nicht, wenn du sonst nur wenige Spiele findest. '+
    'Eine kurze Liste ist richtig, eine mit fremden Wettbewerben ist falsch.\n\n'+
    'Findest du in diesem Bereich heute gar nichts, antworte mit einer leeren Liste.\n\n'+
    'Letzte Nachricht: NUR kompaktes JSON:\n{"spiele":[{"match":"Team A - Team B","wettbewerb":"...","anpfiff":"20:30"}]}';
  var call = hatGemini()
    ? geminiCall({ prompt: prompt, useSearch: true, rolle:'liste' })
    : sonnetSuche(prompt, 5, 1500);
  return call.then(function(res){
    if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
    var parsed=parseJsonBlock(res);
    if(!parsed || !parsed.spiele) return [];
    return parsed.spiele.filter(function(s){ return s && s.match; }).slice(0,10).map(function(s){
      return { match:String(s.match), wettbewerb:String(s.wettbewerb||''), anpfiff:String(s.anpfiff||''), stufe:stufe.nr };
    });
  }).catch(function(){ return []; });
}
function spielListeHolen(){
  var ZIEL=5, gesammelt=[];
  function schluessel(s){ return String(s.match).toLowerCase().replace(/[^a-z0-9]/g,''); }
  function dazu(liste){
    liste.forEach(function(s){
      var k=schluessel(s);
      var schon=gesammelt.some(function(x){ return schluessel(x)===k; });
      if(!schon) gesammelt.push(s);
    });
  }
  function naechste(i){
    if(i>=STUFEN.length) return Promise.resolve(gesammelt);
    return stufeHolen(STUFEN[i]).then(function(l){
      dazu(l);
      /* Nur weitersuchen, wenn die hoeheren Stufen zu wenig hergeben */
      if(gesammelt.length>=ZIEL) return gesammelt;
      return naechste(i+1);
    });
  }
  return naechste(0).then(function(liste){
    if(!liste.length) throw new Error(t('loadFail'));
    return liste.slice(0,10);
  });
}

/* ================= SCHRITT 2: VORHERSAGE JE GEHIRN ================= */
function vorhersageGehirn(gehirn, liste){
  var fruehere = (state.kiProtokoll||[])
    .filter(function(e){ return e.aera==='v19' && (e.herkunft||'sonnet')===gehirn; })
    .slice(0,6)
    .map(function(e){
      /* v19.7 Punkt D: Frueher stand hier nur der getippte Endstand. Das Gehirn hat den
         eigenen Tipp als geschehenes Ereignis behandelt. Jetzt steht in jeder Zeile
         getrennt, was getippt wurde und was wirklich passiert ist. */
      var hatErgebnis = (e.ergebnisHeim!==null && e.ergebnisHeim!==undefined &&
                         e.ergebnisGast!==null && e.ergebnisGast!==undefined);
      var wirklich = hatErgebnis ? ('wirklich '+e.ergebnisHeim+':'+e.ergebnisGast) : 'Ergebnis noch offen';
      return e.datum+': '+e.match+' \u00b7 getippt '+e.heim+':'+e.gast+' \u00b7 '+wirklich+
             (e.begruendung?(' ('+e.begruendung+')'):'');
    }).join(' | ');

  var spieleTxt = liste.map(function(s,i){
    return (i+1)+'. '+s.match+(s.wettbewerb?(' ['+s.wettbewerb+']'):'')+(s.anpfiff?(' '+s.anpfiff):'');
  }).join('\n');

  var prompt='Heute ist '+heuteStr()+'. Du bist Fussball-Prognostiker fuer Ondo Control. '+
    'Deine Aufgabe ist NICHT, Wetten zu empfehlen, sondern ehrlich einzuschaetzen.\n\n'+
    'Fuer JEDES der folgenden Spiele nenne:\n'+
    '- heim und gast: dein wahrscheinlichstes Ergebnis nach 90 Minuten (ganze Zahlen, ohne Verlaengerung)\n'+
    '- p1x2: wie sicher bist du in Prozent, dass der Ausgang (Heimsieg / Auswaertssieg / Unentschieden) so kommt wie in deinem Ergebnis? (1-99)\n'+
    '- pTore: wie sicher in Prozent, dass die Torrichtung stimmt (ueber bzw. unter 2,5 Tore gesamt)? (1-99)\n'+
    '- pBtts: wie wahrscheinlich ist es in Prozent, dass BEIDE Mannschaften mindestens ein Tor erzielen? '+
      'Diese Frage ist unabhaengig von deinem Ergebnis oben — antworte nicht, wie sicher du dir bist, '+
      'sondern wie wahrscheinlich das Ereignis "beide treffen" ist. (1-99)\n'+
    '- bttsWort: antworte hier NUR mit dem Wort "ja" oder "nein" auf die einfache Frage: Treffen in diesem Spiel beide Mannschaften mindestens ein Tor?\n'+
    '- begruendung: max 15 Woerter auf '+(LANGWORD[state.lang]||'Deutsch')+'\n\n'+
    'WICHTIG ZUR EHRLICHKEIT: Deine Prozentangaben werden gemessen. Sagst du oft 80 Prozent, muessen etwa 8 von 10 dieser Aussagen eintreffen. '+
    'Wenn du ein Team oder eine Liga kaum kennst, nenne Werte nahe 50 — das ist kein Makel, sondern korrekt. '+
    'Uebertriebene Sicherheit faellt in der Auswertung auf. Gib fuer JEDES Spiel eine Vorhersage ab, auch bei duenner Datenlage.\n\n'+
    (gehirn==='flash' ? ('LEHRE AUS DEINER EIGENEN KALIBRIERUNG (Backlog-Punkt 2, bestaetigt 27.8.2026): '+
      'Du ueberschaetzt deine eigene Zuversicht im Bereich 60-69 Prozent deutlich: von 49 Aussagen mit im Schnitt behaupteten 63 Prozent trafen nur 49 Prozent ein. '+
      'Dasselbe Muster zeigt sich darunter. Nimm diese Abweichung als festen Erfahrungswert in deine eigene Einschaetzung auf.\n\n') : '')+
    (fruehere?('Deine letzten eigenen Vorhersagen: '+fruehere+'\n\n'):'')+
    'SPIELE:\n'+spieleTxt+'\n\n'+
    'Letzte Nachricht: NUR kompaktes JSON:\n'+
    '{"vorhersagen":[{"match":"Team A - Team B","heim":2,"gast":1,"p1x2":58,"pTore":62,"pBtts":55,"bttsWort":"ja","begruendung":"..."}]}';

  var call = (gehirn==='flash')
    ? geminiCall({ prompt: prompt, rolle:'gehirn' })
    : apiCall({ model:'claude-sonnet-4-6', max_tokens:2500, messages:[{role:'user',content:prompt}] });

  return call.then(function(res){
    if(res._status===401) throw new Error(t('keyBad'));
    if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
    var parsed=parseJsonBlock(res);
    if(!parsed || !parsed.vorhersagen) throw new Error(t('noJson'));
    return parsed.vorhersagen;
  }).catch(function(e){
    return { _fehler: (e && e.message) ? e.message : '?' };
  });
}

/* ================= VORHERSAGE-LAUF (v19 Hauptknopf) ================= */
function vorhersagen(btn){
  if(!hatSonnet() && !hatGemini()){
    var f0=document.getElementById('ladeFehler'); if(f0) f0.textContent=t('noKey'); return;
  }
  var f=document.getElementById('ladeFehler'); if(f) f.textContent='';
  btn.disabled=true; btn.textContent=t('predListing');

  spielListeHolen().then(function(liste){
    if(!liste.length) throw new Error(t('loadFail'));
    btn.textContent=t('predBrain');
    var jobs=[], namen=[];
    if(hatSonnet()){ jobs.push(vorhersageGehirn('sonnet', liste)); namen.push('sonnet'); }
    if(hatGemini()){ jobs.push(vorhersageGehirn('flash', liste));  namen.push('flash'); }
    return Promise.all(jobs).then(function(res){ return { liste:liste, res:res, namen:namen }; });
  }).then(function(paket){
    if(!state.kiProtokoll) state.kiProtokoll=[];
    var heuteD=new Date().toLocaleDateString('de-DE');
    var neu=[], fehler=[];
    paket.res.forEach(function(vorher, i){
      var gehirn=paket.namen[i];
      if(!vorher || vorher._fehler){ fehler.push(gehirn+': '+((vorher&&vorher._fehler)||'?')); return; }
      vorher.forEach(function(v, idx){
        var h=Math.max(0,Math.round(Number(v.heim))), g=Math.max(0,Math.round(Number(v.gast)));
        if(isNaN(h)||isNaN(g)) return;
        function pz(x){ var n=Math.round(Number(x)); if(isNaN(n)) n=50; return Math.max(1,Math.min(99,n)); }
        /* v19.7 Punkt A: Das Wort wird nur mitgeschrieben. Es aendert nichts am Rechnen,
           Umdrehen oder Bewerten — es zeigt nur, welche Frage das Gehirn beantwortet hat. */
        function jaNeinWort(x){
          var w=String(x||'').trim().toLowerCase();
          if(/^(ja|yes|oui|j|y)\b/.test(w)) return 'ja';
          if(/^(nein|no|non|n)\b/.test(w)) return 'nein';
          return '';
        }
        var match=String(v.match||'');
        var eintrag={
          id:'v'+Date.now()+'_'+gehirn+'_'+idx,
          aera:'v19',
          /* v19.8.0 (Backlog-Punkt F): Ab hier traegt jeder Eintrag die Codeversion, unter der
             er entstanden ist. aera ist dafuer zu grob — sie umfasst die ganze v19-Reihe.
             Eintraege OHNE dieses Feld stammen aus der Zeit vor dem Schnitt, also von der
             alten Fragestellung bei "beide treffen". Eine spaetere Berichtigung darf
             ausschliesslich Eintraege ohne dieses Feld anfassen. */
          codeVersion:CODE_VERSION,
          datum:heuteD,
          match:match,
          wettbewerb:(paket.liste[idx]&&paket.liste[idx].wettbewerb)||'',
          anpfiff:(paket.liste[idx]&&paket.liste[idx].anpfiff)||'',
          /* v19.8.1: Aus welchem der drei Suchdurchgaenge das Spiel stammt. Die Nummer wurde
             bisher in stufeHolen berechnet und beim Anlegen weggeworfen. Sie zeigt, ob falsche
             Anpfiffzeiten aus einer bestimmten Stufe kommen. Aendert nichts am Rechnen. */
          stufe:(paket.liste[idx]&&paket.liste[idx].stufe)||null,
          herkunft:gehirn,
          heim:h, gast:g,
          bttsWort:jaNeinWort(v.bttsWort),
          /* v19.7.6: das Modell, das wirklich geantwortet hat — nicht mehr state.geminiModel */
          modell:(gehirn==='flash' ? (zuletztModell.gehirn||state.gModellGehirn||state.geminiModel||'') : 'claude-sonnet-4-6'),
          begruendung:String(v.begruendung||''),
          maerkte:maerkteBauen(match,h,g,pz(v.p1x2),pz(v.pTore),pz(v.pBtts)),
          ergebnisHeim:null, ergebnisGast:null,
          status:'offen'
        };
        state.kiProtokoll.unshift(eintrag);
        neu.push(eintrag);
      });
    });
    state.vorhersagen = { datum:heuteStr(), ids:neu.map(function(e){return e.id;}) };
    state.vorschlaegeInfo = t('kiOf')+': '+heuteStr()+(fehler.length?(' · ⚠ '+fehler.join(' · ')):'');
    save();
    btn.disabled=false; btn.textContent=t('predBtn');
    render();
  }).catch(function(e){
    btn.disabled=false; btn.textContent=t('predBtn');
    var el=document.getElementById('ladeFehler');
    if(el) el.textContent=(e&&e.message?e.message:'?');
  });
}

/* ================= SCHEIN-FOTO ================= */
function fotoLesen(input){
  if(!input.files || !input.files[0]) return;
  if(!hatGemini() && !hatSonnet()){
    var f0=document.getElementById('fotoStatus');
    if(f0) f0.textContent=t('noKey');
    return;
  }
  var st=document.getElementById('fotoStatus');
  if(st) st.textContent=t('photoRead');
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1200, w=img.width, h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var b64=cv.toDataURL('image/jpeg',0.8).split(',')[1];
      var fotoPrompt='Das ist ein Foto eines Wettscheins (z.B. Tipico). Lies ihn exakt. Bei einer Kombi: EIN Eintrag, Gesamtquote = Moeglicher Gewinn geteilt durch Einsatz (2 Dezimalen). Bei Einzelwetten: ein Eintrag pro Wette. Status: VERLOREN -> verloren, GEWONNEN -> gewonnen, sonst offen. NUR kompaktes JSON: {"wetten":[{"match":"...","tipp":"...","quote":2.05,"einsatz":7,"status":"offen"}]}';
      var fotoCall = hatGemini()
        ? geminiCall({ prompt: fotoPrompt, imageB64: b64 })
        : apiCall({model:'claude-sonnet-4-6',max_tokens:800,
            messages:[{role:'user',content:[
              {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
              {type:'text',text:fotoPrompt}
            ]}]
          });
      fotoCall.then(function(res){
        if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
        var parsed=parseJsonBlock(res);
        if(!parsed || !parsed.wetten || !parsed.wetten.length) throw new Error(t('noJson'));
        var n=0;
        parsed.wetten.forEach(function(w,idx){
          state.bets.unshift({
            id:Date.now()+idx,
            datum:new Date().toLocaleDateString('de-DE'),
            match:String(w.match||'?'),
            tipp:String(w.tipp||''),
            quote:Number(w.quote)||0,
            einsatz:Number(w.einsatz)||0,
            status:(w.status==='gewonnen'||w.status==='verloren')?w.status:'offen',
            claudeRichtig:null
          });
          n++;
        });
        save();
        if(st) st.textContent='✅ '+n+' '+t('photoOk');
        setTimeout(function(){ go('wetten','historie'); },800);
      })
      .catch(function(e){
        if(st) st.textContent=t('photoFail')+(e&&e.message?e.message:'?');
      });
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(input.files[0]);
}

/* ================= ERGEBNISSE PRUEFEN (v19: KI liefert nur Tore) ================= */
/* ================= ERGEBNISSE PRUEFEN (v19.4) =================
   Mehrrundig: wiederholt, solange jede Runde mindestens ein neues Ergebnis bringt
   (Obergrenze 6 Runden), hoechstens 5 Spiele pro Anfrage, drei Zustaende je Spiel,
   sichtbare Bilanz am Ende. Quellen-Pflicht bei spaeten Funden (ab Runde 3). */
var pruefListe = [];
var pruefBilanz = null;
function ergebnissePruefen(btn){
  if(!hatGemini() && !hatSonnet()){
    var f0=document.getElementById('pruefStatus'); if(f0) f0.textContent=t('noKey'); return;
  }
  /* v19.7.6: Geparkte Vorhersagen werden uebersprungen. Anlass: Die gesperrten Ergebnisse
     vom 29./30. und 31. Juli duerfen nie uebernommen werden und blieben deshalb dauerhaft
     offen — jeder Prueflauf fragte sie erneut ab und verbrauchte Runden dafuer. Parken
     traegt KEIN Ergebnis ein: Die Pruefbibliothek bleibt unberuehrt, nichts wird bewertet,
     nichts fliesst in die Kalibrierung, und der Schritt ist jederzeit umkehrbar. */
  var offeneP = (state.kiProtokoll||[]).filter(function(e){
    return e.aera==='v19' && e.status==='offen' && !e.geparkt;
  });
  /* Doppelte Spiele nur einmal abfragen: beide Gehirne teilen sich denselben Endstand */
  var spiele={}, posten=[];
  offeneP.forEach(function(e){
    var k=e.match+'|'+e.datum;
    if(!spiele[k]){
      spiele[k]={ id:'S'+posten.length, art:'log', match:e.match, datum:e.datum,
        anpfiff:e.anpfiff||'', wettbewerb:e.wettbewerb||'', eintraege:[], zustand:'offen', gefragt:false };
      posten.push(spiele[k]);
    }
    spiele[k].eintraege.push(e.id);
  });
  state.bets.filter(function(b){return b.status==='offen';}).forEach(function(b){
    posten.push({ id:'B'+b.id, art:'bet', betId:b.id, match:b.match, datum:b.datum,
      tipp:b.tipp||'', zustand:'offen', gefragt:false });
  });

  var st=document.getElementById('pruefStatus');
  if(!posten.length){ if(st) st.textContent=t('noOpen'); return; }
  btn.disabled=true;
  if(st) st.textContent='';
  pruefListe=[]; pruefBilanz=null;
  pruefStark = { anfragen:0, modell:'', fallback:false, grund:'' };
  var runde=0, MAXR=6;

  function tageAbstand(a,b){
    function z(s){ var m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(!m) return null;
      return Date.UTC(Number(m[3]),Number(m[2])-1,Number(m[1])); }
    var x=z(a), y=z(b);
    if(x===null||y===null) return null;
    return Math.abs(x-y)/86400000;
  }
  function urlOk(s){ return /^https?:\/\/[^\s"'<>]+\.[a-z]{2,}/i.test(String(s||'').trim()); }
  /* Wie lange ist der Anpfiff her? Gibt Stunden zurueck, oder null wenn unbekannt.
     Grundlage fuer die Plausibilitaetspruefung von "laeuft noch". */
  function stundenSeitAnpfiff(datum, anpfiff){
    var d=String(datum||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    var u=String(anpfiff||'').match(/(\d{1,2})[:.](\d{2})/);
    if(!d||!u) return null;
    var start=new Date(Number(d[3]), Number(d[2])-1, Number(d[1]), Number(u[1]), Number(u[2]));
    var diff=(Date.now()-start.getTime())/3600000;
    return (diff<0 || diff>240) ? null : diff;
  }
  function quellHost(s){
    var m=String(s||'').match(/^https?:\/\/([^\/\s"'<>]+)/i);
    return m ? m[1].replace(/^www\./,'') : '';
  }

  function verarbeite(r, ziel){
    var id=String(r.id||'');
    var p=null;
    for(var i=0;i<ziel.length;i++){ if(ziel[i].id===id){ p=ziel[i]; break; } }
    if(!p) return 0;
    var status=String(r.status||'').toLowerCase();
    if(status==='laeuft'){
      /* Ein regulaeres Spiel ist rund 2 Stunden nach Anpfiff vorbei. Laeuft Verlaengerung
         oder Elfmeterschiessen, steht der Stand nach 90 Minuten laengst fest — auch dann
         ist "laeuft" keine gueltige Antwort. Nach 2,5 Stunden glauben wir sie deshalb
         nicht mehr und suchen weiter. Bei echten Unterbrechungen (Unwetter) kostet das
         nur eine zusaetzliche Nachfrage; ein uebersehenes Ergebnis waere schlimmer. */
      var vergangen=stundenSeitAnpfiff(p.datum, p.anpfiff);
      p.zustand = (vergangen!==null && vergangen>2.5) ? 'fehlt' : 'laeuft';
      return 0;
    }
    var h=Math.round(Number(r.heim)), g=Math.round(Number(r.gast));
    if(status!=='fertig' || isNaN(h) || isNaN(g)){ p.zustand='fehlt'; return 0; }
    var gefDatum=String(r.datum||''), gefWb=String(r.wettbewerb||''), quelle=String(r.quelle||'');
    var halbzeit=String(r.halbzeit||'').trim(), verl=String(r.verlaengerung||'').trim();
    /* Plausibilitaetspruefung der Phasen: In der zweiten Halbzeit koennen keine Tore
       verschwinden. Ist der Halbzeitstand hoeher als der Stand nach 90 Minuten, hat
       der Schiedsrichter die Staende vertauscht. */
    var hzT=halbzeit.match(/(\d+)\s*[:\-]\s*(\d+)/);
    var warnP=false;
    if(hzT){
      var hzH=Number(hzT[1]), hzG=Number(hzT[2]);
      if(hzH>h || hzG>g) warnP=true;
    }
    var abstand=tageAbstand(p.datum, gefDatum);
    var warn=(abstand!==null && abstand>1);
    var warnQ=(runde>=3 && !urlOk(quelle));
    p.zustand='fertig';
    if(p.art==='log'){
      var urteile=[];
      (state.kiProtokoll||[]).forEach(function(e){
        if(p.eintraege.indexOf(e.id)<0) return;
        (e.maerkte||[]).forEach(function(m){
          var ok=marktUrteil(m.code,h,g);
          if(ok===null) return;
          urteile.push({ gehirn:e.herkunft, label:m.label, ok:ok });
        });
      });
      pruefListe.push({ art:'log', id:p.id, match:p.match, heim:h, gast:g,
        halbzeit:halbzeit, verl:verl, warnP:warnP,
        gefDatum:gefDatum, gefWb:gefWb, quelle:quellHost(quelle), warn:warn, warnQ:warnQ,
        eintraege:p.eintraege, urteile:urteile });
    } else {
      pruefListe.push({ art:'bet', id:p.id, betId:p.betId, match:p.match, tipp:p.tipp,
        heim:h, gast:g, halbzeit:halbzeit, verl:verl, warnP:warnP,
        gefDatum:gefDatum, gefWb:gefWb, quelle:quellHost(quelle),
        warn:warn, warnQ:warnQ });
    }
    return 1;
  }

  function rundeLaufen(){
    runde++;
    var ziel = posten.filter(function(p){ return p.zustand==='offen'||p.zustand==='fehlt'; }).slice(0,5);
    if(!ziel.length || runde>MAXR){ abschluss(); return; }
    btn.textContent = t('checkingRound').replace('{a}',runde).replace('{b}',MAXR);
    ziel.forEach(function(p){ p.gefragt=true; });

    var zeilen = ziel.map(function(p){
      return p.id+': '+p.match+(p.wettbewerb?(' ['+p.wettbewerb+']'):'')+' (angesetzt am '+p.datum+(p.anpfiff?(', Anpfiff '+p.anpfiff+' Uhr'):'')+')'+((p.art==='bet')?' — Wettschein':'');
    });
    var quellPflicht = (runde>=3)
      ? 'WICHTIG IN DIESEM DURCHGANG: Zu jedem gefundenen Ergebnis MUSST du im Feld "quelle" die vollstaendige URL der Seite nennen, auf der du den Endstand gelesen hast. Ein Ergebnis ohne echte Quellen-URL wird verworfen.\n\n'
      : 'Nenne im Feld "quelle" nach Moeglichkeit die URL der Seite, auf der du den Endstand gelesen hast.\n\n';
    /* Backlog-Punkt E (Beschluss Ondo 25.7., Zustand-vor-Ziffer-Ergaenzung Gemini/Ondo 27.8.):
       Wettbewerb, Datum und beide Teams stehen unten schon fest. Der Auftrag ist BESTAETIGEN,
       nicht frei suchen — ein bestaetigtes Ergebnis muss zu allen vier Angaben passen. */
    var prompt='Heute ist '+heuteStr()+', es ist '+jetztUhr()+' Uhr (deutsche Zeit). '+
      'Zu jedem Spiel unten stehen Wettbewerb, Datum und beide Teams bereits fest. Deine Aufgabe ist BESTAETIGEN, nicht frei suchen: '+
      'ermittle per Websuche den ENDSTAND NACH 90 MINUTEN inkl. Nachspielzeit — OHNE Verlaengerung, OHNE Elfmeterschiessen — und melde ihn nur, wenn Wettbewerb, Datum und beide Teams deiner Quelle zu den unten genannten Angaben passen. Weicht auch nur eine der vier Angaben ab, ist es das falsche Spiel: dann "nicht_gefunden".\n\n'+
      'Du sollst NICHT beurteilen, ob eine Wette gewonnen hat. Nenne ausschliesslich die Tore. '+
      'heim = erstgenanntes Team, gast = zweitgenanntes Team.\n\n'+
      'Gib jedem Spiel GENAU EINEN Status:\n'+
      '- "fertig": Endstand aus verlaesslicher Quelle bestaetigt (dann heim, gast, datum, wettbewerb, quelle angeben)\n'+
      '- "laeuft": Spiel laeuft gerade noch oder wurde noch nicht angepfiffen. '+
      'ACHTUNG: Wenn seit dem angegebenen Anpfiff mehr als zwei Stunden vergangen sind, ist das Spiel mit an Sicherheit grenzender Wahrscheinlichkeit vorbei — nimm dann NICHT "laeuft". '+
      'Laeuft gerade Verlaengerung oder Elfmeterschiessen, steht der Stand nach 90 Minuten bereits fest: melde ihn als "fertig".\n'+
      '- "nicht_gefunden": Spiel ist vorbei oder Status unklar, aber kein verlaesslicher Endstand auffindbar. NIEMALS raten.\n\n'+
      'VIER HAEUFIGE FEHLER, DIE DU VERMEIDEN MUSST:\n'+
      '1. FALSCHES DUELL: Zwei Teams spielen mehrmals pro Jahr gegeneinander. Pruefe, dass dein Ergebnis wirklich vom angesetzten Datum stammt — NICHT von einer frueheren Begegnung derselben Teams.\n'+
      '2. ZEITZONEN: Spiele in Suedamerika und Nordamerika werden abends Ortszeit angepfiffen und enden in Europa erst NACH MITTERNACHT, also am Folgetag. Suche nach dem Spieltag der Liga, nicht nur nach dem Kalenderdatum.\n'+
      '3. RATEN: Lieber "nicht_gefunden" als ein unsicherer Endstand.\n'+
      '4. TORLOSES UNENTSCHIEDEN (0:0): Ein 0:0 sieht in deiner Antwort genauso aus wie eine Ausflucht, wenn du nichts gefunden hast. Melde 0:0 NUR, wenn eine konkrete Quelle das ausdruecklich bestaetigt — niemals als Verlegenheitsantwort. Im Zweifel "nicht_gefunden" statt eines geratenen 0:0.\n\n'+
      quellPflicht+
      zeilen.join('\n')+
      '\n\nLetzte Nachricht: NUR kompaktes JSON:\n{"ergebnisse":[{"id":"S0","status":"fertig","halbzeit":"1:0","heim":2,"gast":1,"verlaengerung":"","datum":"24.07.2026","wettbewerb":"MLS","quelle":"https://..."}]}';

    var call = hatGemini()
      ? geminiCall({ prompt: prompt, useSearch: true, rolle:'ref' })   /* 0a zurueckgenommen in v19.7.3, siehe Backlog */
      : sonnetSuche(prompt, 5, 1500);

    call.then(function(res){
      if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
      var parsed=parseJsonBlock(res);
      var neu=0;
      if(parsed && parsed.ergebnisse){
        parsed.ergebnisse.forEach(function(r){ neu += verarbeite(r, ziel); });
      }
      /* Gefragte ohne Antwort gelten als nicht gefunden */
      ziel.forEach(function(p){ if(p.zustand==='offen') p.zustand='fehlt'; });
      var nochWas = posten.some(function(p){
        return p.zustand==='fehlt' || (p.zustand==='offen' && !p.gefragt);
      });
      var ungefragt = posten.some(function(p){ return p.zustand==='offen' && !p.gefragt; });
      if(runde<MAXR && nochWas && (neu>0 || ungefragt)){ rundeLaufen(); }
      else { abschluss(); }
    })
    .catch(function(e){
      abschluss((e&&e.message)?e.message:'?');
    });
  }

  function abschluss(fehler){
    pruefBilanz = {
      gesamt: posten.length,
      gef: posten.filter(function(p){ return p.zustand==='fertig'; }).length,
      laeuft: posten.filter(function(p){ return p.zustand==='laeuft'; }).map(function(p){ return p.match; }),
      fehlt: posten.filter(function(p){ return p.zustand!=='fertig' && p.zustand!=='laeuft'; }).map(function(p){ return p.match; }),
      runden: Math.min(runde, MAXR),
      starkAnfragen: pruefStark.anfragen,
      starkModell: pruefStark.modell,
      starkFallback: pruefStark.fallback,
      starkGrund: pruefStark.grund,
      fehler: fehler||null
    };
    btn.disabled=false; btn.textContent=t('checkBtn');
    render();
  }

  rundeLaufen();
}
function pruefAnwenden(pid){
  var p = pruefListe.filter(function(x){return x.id===pid;})[0];
  if(!p) return;
  if(p.art==='log'){
    (state.kiProtokoll||[]).forEach(function(e){
      if(p.eintraege.indexOf(e.id)<0) return;
      e.ergebnisHeim=p.heim; e.ergebnisGast=p.gast;
      (e.maerkte||[]).forEach(function(m){
        var ok=marktUrteil(m.code,p.heim,p.gast);
        if(ok===null) return;
        m.status = ok ? 'richtig' : 'falsch';
      });
      e.status='bewertet';
    });
    save();
  }
  pruefListe = pruefListe.filter(function(x){return x.id!==pid;});
  render();
}
function pruefIgnorieren(pid){
  pruefListe = pruefListe.filter(function(x){return x.id!==pid;});
  render();
}
function logMarktSet(eid, idx, status){
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.id!==eid) return;
    if(e.maerkte && e.maerkte[idx]) e.maerkte[idx].status=status;
    var offenNoch=(e.maerkte||[]).some(function(m){return m.status==='offen';});
    e.status = offenNoch ? 'offen' : 'bewertet';
  });
  save(); render();
}
/* v19.7.6: Parken statt loeschen. Ein Eintrag verschwindet aus dem Prueflauf, bleibt aber
   vollstaendig in den Daten. Es wird kein Endstand gesetzt und kein Markt bewertet. */
function logParken(eid, wert){
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.id===eid) e.geparkt = !!wert;
  });
  save(); render();
}
/* Alle noch offenen Vorhersagen eines Spieltags auf einmal parken — die gesperrten
   Ergebnisse liegen tageweise beieinander, einzeln waeren es dutzende Klicks. */
function logParkenTag(datum, wert){
  var n=0;
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19' || e.datum!==datum || e.status!=='offen') return;
    e.geparkt = !!wert; n++;
  });
  if(n){ save(); render(); }
}
function logLoeschen(eid){
  state.kiProtokoll=(state.kiProtokoll||[]).filter(function(e){return e.id!==eid;});
  save(); render();
}
/* ========= GEFUNDENE ENDSTAENDE ALS TEXT (v19.7.8, Backlog-Punkt 25) =========
   Ondos Vorschlag vom 6.8. Die Vorschlaege des Schiedsrichters stehen vor dem Uebernehmen nur
   auf dem Bildschirm; fuer die Gegenpruefung war deshalb weiterhin ein Bildschirmfoto noetig.
   Reine Ausgabe aus pruefListe — es wird nichts gespeichert, nichts gerechnet und nichts an ein
   Gehirn geschickt. Die Reihenfolge bleibt: erst gegenpruefen, dann uebernehmen. Ein falsch
   uebernommener Endstand ist der einzige Schritt, der sich nicht einfach zuruecknehmen laesst. */
function pruefTextBauen(){
  var feld=document.getElementById('pruefText');
  if(!feld) return;
  if(!pruefListe.length){ feld.value=''; return; }
  var kopf='ONDO CONTROL — gefundene Endstaende, NOCH NICHT uebernommen · '+
    pruefListe.length+' Vorschlaege · erzeugt '+new Date().toLocaleDateString('de-DE')+' '+jetztUhr();
  var zeilen=pruefListe.map(function(p){

  state.bets.unshift({

  });

}

}

/* ================= DATENSICHERUNG (v19.1) =================
   Alle Messdaten liegen sonst nur im Browser-Speicher dieses Geraetes. */
function dateiHerunterladen(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    try{ document.body.removeChild(a); }catch(e){}
    URL.revokeObjectURL(url);
  }, 1200);
}
function datenSichern(){
  var d = new Date();
  var name = 'ondo-control-sicherung-'+d.getFullYear()+'-'+
    ('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.json';
  /* v19.7.5: Der Zeitstempel wird jetzt VOR dem Ausschreiben gesetzt. Vorher enthielt die
     Datei den Stand der VORIGEN Sicherung — nach einem Import zeigte "zuletzt gesichert"
     deshalb ein zu altes Datum und liess die Daten ungesicherter aussehen, als sie waren. */
  state.letzteSicherung = d.toLocaleDateString('de-DE')+' '+
    ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  var daten = JSON.stringify(state);
  var blob = new Blob([daten], {type:'application/json'});
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  var datei = null;
  try{ datei = new File([blob], name, {type:'application/json'}); }catch(e){}
  if(datei && navigator.share && navigator.canShare && navigator.canShare({files:[datei]})){
    navigator.share({ files:[datei], title:name })
      .then(function(){ render(); })
      .catch(function(){ dateiHerunterladen(blob, name); render(); });
    return;
  }
  dateiHerunterladen(blob, name);
  render();
}
function datenLaden(input){
  if(!input.files || !input.files[0]) return;
  var leser = new FileReader();
  leser.onload = function(){
    var d = null;
    try{ d = JSON.parse(leser.result); }catch(e){}
    if(!d || typeof d !== 'object' || (!('kiProtokoll' in d) && !('bets' in d))){
      alert(t('impFail')); input.value=''; return;
    }
    var a = (d.kiProtokoll||[]).length, b = (d.bets||[]).length;
    if(!confirm(t('impConfirm').replace('{a}', a).replace('{b}', b))){ input.value=''; return; }
    for(var k in d) state[k] = d[k];
    save(); render();
    alert(t('impOk'));
    input.value='';
  };
  leser.readAsText(input.files[0]);
}

/* ================= VORHERSAGE-KARTE ================= */
function vorhersageKarte(e, mitKnoepfen){
  var quelle = (e.herkunft==='flash') ? '🌱 Flash' : '🧠 Sonnet';
  var maerkte = (e.maerkte||[]).map(function(m,idx){
    var chip = m.status==='richtig' ? '<span class="badge b-win">'+t('stRight')+'</span>'
             : m.status==='falsch'  ? '<span class="badge b-loss">'+t('stWrong')+'</span>'
             : '<span class="p">'+m.p+' %</span>';
    var knoepfe = (mitKnoepfen && m.status!=='offen')
      ? ' <button class="btn-sm" onclick="logMarktSet(\''+e.id+'\','+idx+',\'offen\')">'+t('reset')+'</button>'
      : (mitKnoepfen
        ? ' <button class="btn-sm btn-win" onclick="logMarktSet(\''+e.id+'\','+idx+',\'richtig\')">✓</button>'+
          ' <button class="btn-sm btn-loss" onclick="logMarktSet(\''+e.id+'\','+idx+',\'falsch\')">✗</button>'
        : '');
    return '<div class="mkt"><div>'+esc(m.label)+
      (m.status!=='offen'?(' <span class="muted">('+m.p+' %)</span>'):'')+'</div>'+
      '<div style="white-space:nowrap">'+chip+knoepfe+'</div></div>';
  }).join('');
  /* v19.7 Punkt A: reine Anzeige. Der Hinweis "≠ Anzeige oben" vergleicht das Wort mit der
     angezeigten Btts-Aussage; er wird nirgends gespeichert und geht in keine Kennzahl ein. */
  var wortZeile = '';
  if(e.bttsWort==='ja' || e.bttsWort==='nein'){
    var btts = (e.maerkte||[]).filter(function(m){ return m.typ==='btts'; })[0];
    var angezeigtJa = btts ? (btts.code==='btts_ja') : null;
    var abweich = (angezeigtJa!==null) && (angezeigtJa !== (e.bttsWort==='ja'));
    wortZeile = '<div class="mkt"><div class="muted">'+t('bttsWord')+': <b style="color:var(--text)">'+
      e.bttsWort+'</b></div><div style="white-space:nowrap">'+
      (abweich?('<span class="muted" style="color:var(--loss)">'+t('bttsMismatch')+'</span>'):'')+'</div></div>';
  }
  var endstand = (e.ergebnisHeim!==null && e.ergebnisHeim!==undefined)
    ? '<div class="muted" style="margin-top:8px">'+t('finalScore')+': <b style="color:var(--text)">'+e.ergebnisHeim+':'+e.ergebnisGast+'</b></div>'
    : '';
  return '<div class="card"'+(e.geparkt?' style="opacity:.6"':'')+'>'+
    '<div class="flex"><div>'+
      '<div class="disp" style="font-size:18px">'+esc(e.match)+
        (e.geparkt?(' <span class="badge b-open" style="font-size:11px">'+t('parked')+'</span>'):'')+'</div>'+
      '<div class="muted">'+e.datum+(e.anpfiff?(' '+esc(e.anpfiff)):'')+' · '+quelle+(e.wettbewerb?(' · '+esc(e.wettbewerb)):'')+'</div>'+
    '</div><div style="text-align:right">'+
      '<div class="score">'+e.heim+':'+e.gast+'</div>'+
      '<div class="muted" style="font-size:10px">'+t('resultTip')+'</div>'+
    '</div></div>'+
    maerkte+
    wortZeile+
    (e.begruendung?'<div class="muted" style="margin-top:8px;border-top:1px solid var(--edge);padding-top:8px">'+esc(e.begruendung)+'</div>':'')+
    endstand+
    (mitKnoepfen?('<div style="margin-top:10px">'+
      (e.status==='offen'
        ? (e.geparkt
            ? '<button class="btn-sm btn-open" onclick="logParken(\''+e.id+'\',false)">'+t('unparkBtn')+'</button>'
            : '<button class="btn-sm" onclick="logParken(\''+e.id+'\',true)">'+t('parkBtn')+'</button>')
        : '')+
      '<button class="btn-sm" style="float:right" onclick="logLoeschen(\''+e.id+'\')">'+t('del')+'</button>'+
      '<div style="clear:both"></div></div>'):'')+
  '</div>';
}

    /* v19.7.6: Tageweise parken. Die offenen Vorhersagen liegen nach Tagen beieinander;
       einzeln zu klicken waeren bei den gesperrten Ergebnissen dutzende Griffe. */
    var tage=[], nachTag={};
    neu.forEach(function(e){
      if(e.status!=='offen') return;
      if(!nachTag[e.datum]){ nachTag[e.datum]={offen:0, geparkt:0}; tage.push(e.datum); }
      nachTag[e.datum].offen++;
      if(e.geparkt) nachTag[e.datum].geparkt++;
    });
    tage.sort(function(a,b){ return (datumZahl(b)||0)-(datumZahl(a)||0); });
    var parkBlock = tage.length
      ? '<div class="card"><div class="disp" style="font-size:18px;margin-bottom:6px">🅿 '+t('parkBtn')+'</div>'+
        '<div class="muted" style="margin-bottom:10px">'+t('parkedD')+'</div>'+
        tage.map(function(d){
          var z=nachTag[d], allePark=(z.geparkt>=z.offen);
          return '<div class="mkt"><div>'+esc(d)+' <span class="muted">('+z.offen+' '+t('open_')+
            (z.geparkt?(' · '+t('parkedCount').replace('{a}',z.geparkt)):'')+')</span></div>'+
            '<div style="white-space:nowrap">'+
            (allePark
              ? '<button class="btn-sm btn-open" onclick="logParkenTag(\''+esc(d)+'\',false)">'+t('unparkBtn')+'</button>'
              : '<button class="btn-sm" onclick="logParkenTag(\''+esc(d)+'\',true)">'+t('parkBtn')+'</button>')+
            '</div></div>';
        }).join('')+'</div>'
      : '';
    var archiv = alt.length
      ? '<div class="muted" style="margin:18px 0 8px;letter-spacing:1px;text-transform:uppercase">'+t('archive')+'</div>'+
        '<div class="muted" style="margin-bottom:10px">'+t('archiveD')+'</div>'+
        alt.map(function(e){
          var chip = e.status==='richtig' ? '<span class="badge b-win">'+t('stRight')+'</span>'
            : e.status==='falsch' ? '<span class="badge b-loss">'+t('stWrong')+'</span>'
            : '<span class="badge b-open">'+t('openB')+'</span>';
          var quelle = (e.herkunft==='flash') ? ' · 🌱 Flash' : ' · 🧠 Sonnet';
          return '<div class="card" style="opacity:.65"><div class="flex"><div>'+
            '<div class="disp" style="font-size:16px">'+esc(e.match)+'</div>'+
            '<div class="muted">'+e.datum+' · '+t('tip')+': '+esc(e.tipp||'?')+' · '+t('odds')+' '+esc(e.quote||'?')+quelle+'</div>'+
            '</div>'+chip+'</div></div>';
        }).join('')
      : '';
    return sub+'<div class="muted" style="margin-bottom:10px">'+t('logD')+'</div>'+pruefBlock()+parkBlock+korrFBlock()+logExportBlock()+eintraege+archiv;
  }

  if(wtab==="historie" && !state.bets.length) return sub+pruefBlock()+'<div class="card empty">'+t('noBets')+'</div>';
  var h=state.bets.map(function(b){
    var badge = b.status==="offen"?'<span class="badge b-open">'+t('openB')+'</span>':
                b.status==="gewonnen"?'<span class="badge b-win">'+t('won')+'</span>':
                '<span class="badge b-loss">'+t('lost')+'</span>';
    var akt = b.status==="offen"
      ? '<button class="btn-sm btn-win" onclick="setStatus('+b.id+',\'gewonnen\')">'+t('bWon')+'</button> '+
        '<button class="btn-sm btn-loss" onclick="setStatus('+b.id+',\'verloren\')">'+t('bLost')+'</button>'
      : '<button class="btn-sm" onclick="setStatus('+b.id+',\'offen\')">'+t('reset')+'</button>';
    var pnl = b.status!=="offen"
      ? '<div style="color:'+(profit(b)>=0?"var(--win)":"var(--loss)")+';font-weight:600;margin-top:2px">'+fmt(profit(b))+'</div>'
      : '<div class="muted">'+t('possWin')+': <span style="color:var(--win)">'+fmt(b.einsatz*(b.quote-1))+'</span></div>';
    return '<div class="card">'+
      '<div class="flex"><div><div class="disp" style="font-size:19px">'+esc(b.match)+'</div>'+
      '<div class="muted">'+b.datum+' · '+t('odds')+' '+b.quote.toLocaleString("de-DE")+' · '+t('stake').replace(' (€)','')+' '+eur(b.einsatz)+'</div></div>'+badge+'</div>'+
      (b.tipp?'<div style="font-size:13px;margin-top:8px">'+t('tip')+': '+esc(b.tipp)+'</div>':'')+pnl+
      '<div style="margin-top:12px">'+akt+
      ' <button class="btn-sm" style="float:right" onclick="delBet('+b.id+')">'+t('del')+'</button></div>'+
    '</div>';
  }).join("");
  return sub+pruefBlock()+h;
}

/* ================= KALIBRIERUNGS-ANZEIGE ================= */
function kalibBlock(){
  function tabelle(k, titel){
    if(!k) return '<div class="muted">'+titel+': '+t('calibNone')+'</div>';
    var kopf='<div style="margin-top:10px"><b>'+titel+'</b> · '+t('calibDev')+': '+
      '<span style="color:'+(k.abw<=10?'var(--win)':(k.abw<=20?'var(--accent)':'var(--loss)'))+';font-weight:700">'+k.abw+' %</span>'+
      ' <span class="muted">('+k.gesamt+' '+t('calibPts')+')</span></div>';
    var rows=k.zeilen.map(function(z){
      return '<tr><td>'+z.von+'–'+z.bis+' %</td><td>'+z.behauptet+' %</td><td>'+z.echt+' %</td><td>'+z.n+'</td></tr>';
    }).join('');
    return kopf+'<table class="ktab"><tr><th>'+t('calibBand')+'</th><th>'+t('calibClaim')+'</th><th>'+t('calibReal')+'</th><th>'+t('calibN')+'</th></tr>'+rows+'</table>';
  }
  function entschlossen(quelle, titel){
    var d=calcEntschlossenheit(quelle);
    if(!d) return '<div class="muted">'+titel+': '+t('calibNone')+'</div>';
    return '<div style="margin-top:8px"><b>'+titel+'</b></div>'+
      '<table class="ktab"><tr><td>'+t('decisAvg')+'</td><td>'+String(d.abstand).replace('.',',')+'</td></tr>'+
      '<tr><td>'+t('decisOver')+'</td><td>'+d.ueber+' % ('+d.ueberN+'/'+d.n+')</td></tr></table>';
  }
  return '<div class="card">'+
    '<div class="disp" style="font-size:20px;margin-bottom:6px">🎯 '+t('calib')+'</div>'+
    '<div class="muted">'+t('calibD')+'</div>'+
    tabelle(calcKalibrierung('sonnet'),'🧠 Sonnet')+
    tabelle(calcKalibrierung('flash'),'🌱 Flash')+
  '</div>'+
  '<div class="card">'+
    '<div class="disp" style="font-size:20px;margin-bottom:6px">🎚 '+t('decis')+'</div>'+
    '<div class="muted">'+t('decisD')+'</div>'+
    entschlossen('sonnet','🧠 Sonnet')+
    entschlossen('flash','🌱 Flash')+
  '</div>';
}

/* ================= MEHR / EINSTELLUNGEN ================= */
function modellFeld(rolle){
  var liste = (state.geminiModelListe||[]).filter(function(n){ return modellTaugt(n,false); });
  var wert  = (rolle==='ref') ? (state.gModellRef||'')
            : (rolle==='liste') ? (state.gModellListe||'')
            : (state.gModellGehirn||'');
  var opts  = '<option value="">'+t('mdlAuto')+'</option>';
  liste.forEach(function(n){
    opts += '<option value="'+esc(n)+'"'+(n===wert?' selected':'')+'>'+esc(n)+'</option>';
  });
  /* Ein gewaehltes Modell, das nicht mehr in der Liste steht, bleibt sichtbar statt still zu verschwinden */
  if(wert && liste.indexOf(wert)<0) opts += '<option value="'+esc(wert)+'" selected>'+esc(wert)+' (?)</option>';
  var beschriftung = (rolle==='ref') ? 'mdlRef' : (rolle==='liste') ? 'mdlList' : 'mdlBrain';
  return '<label style="margin-top:10px;display:block">'+t(beschriftung)+'</label>'+
    '<select onchange="modellWahl(\''+rolle+'\',this.value)">'+opts+'</select>'+
    (rolle==='gehirn' ? '<div class="muted" style="color:var(--loss);margin-top:4px">'+t('mdlWarn')+'</div>' : '')+
    (rolle==='liste' ? '<div class="muted" style="margin-top:4px">'+t('mdlListD')+'</div>' : '');
}
function modellWahl(rolle, wert){
  if(rolle==='ref') state.gModellRef = wert || null;
  else if(rolle==='liste') state.gModellListe = wert || null;
  else state.gModellGehirn = wert || null;
  save(); render();
}
function modelleLaden(){
  gLadeModelle(false).then(function(){ render(); });
}

  '</div>'+
  '<div class="card"><div class="disp" style="font-size:20px;margin-bottom:6px">📋 '+t('projT')+'</div>'+
    '<pre>ONDO CONTROL '+CODE_VERSION+' — Messphase\n\nVision: Ein persönliches KI-System, das dir hilft, bessere Entscheidungen zu treffen — modular, transparent, kontrollierbar.\n\nIn dieser Phase ist die App ein MESSGERÄT, kein Wett-Berater:\n• Beide Gehirne sagen dieselben Spiele vorher\n• Gemessen wird die Kalibrierung: Stimmen die Prozentangaben?\n• Der Schiedsrichter liest nur das Ergebnis — die Bewertung rechnet fester Code\n• Keine erfundenen Quoten mehr\n\nValue-Rechnung und echte Quoten kommen zurück, sobald die Messung steht.\n\nModule: Wetten ✓ · Finanzen ✓ · Lotterien · Content · Organisation\n\nVerfassung (Auszug): Wahrheit · Transparenz · Kritik · Loyalität · Schutz · Kontrolle · keine Scheinüberlegenheit.</pre>'+
  '</div>';

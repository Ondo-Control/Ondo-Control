        gesucht (Ziel A: "Ein bereits vorhandener gueltiger Vorschlag darf nicht erneut gesucht
        werden"). */
  posten.forEach(function(p){
    var teams=teamsAus(p.match||'');
    var iso=datumIso(p.datum||'');
    p.fixtureId = iso ? fxId(iso, teams.heim, teams.gast) : '';
  });
  posten = posten.filter(function(p){
    var job=jobHolen(p.fixtureId);
    if(!job) return true;
    if(job.zustand==='ignoriert' || job.zustand==='uebernommen') return false;
    if(job.zustand==='vorschlag') return false;
    return true;
  });

  var st=document.getElementById('pruefStatus');
  if(!posten.length){ if(st) st.textContent=t('noOpen'); return; }
  btn.disabled=true;
  if(st) st.textContent='';
  /* 🔴 KEIN state.pruefListe=[] MEHR (Abschnitt 5, der Kern von Ondos Meldung vom 20.9.2026).
     Ein neuer Prueflauf vernichtete bisher JEDEN bereits gefundenen Vorschlag - auch die, die
     er in dieser Runde gar nicht mehr sucht. Entfernt werden jetzt nur die Vorschlaege der
     Spiele, die dieser Lauf tatsaechlich erneut prueft; alles andere bleibt unangetastet
     stehen, bis Ondo es uebernimmt oder ignoriert. */
  /* 🔴 v19.19.1: Dieses Entfernen geschieht jetzt erst NACH dem erfolgreichen Start-Checkpoint
     (siehe prueflaufStarten() ganz unten). Scheitert der Checkpoint, bleibt jeder vorhandene
     Vorschlag unangetastet stehen - auch im Arbeitsspeicher. */
  var wiederIds={};
  posten.forEach(function(p){ if(p.fixtureId) wiederIds[p.fixtureId]=true; });

     FORTSETZEN statt neu anfangen (Abschnitt 6): Steht ein Run auf 'pausiert' - unterbrochen

  var altLauf = (state.pruefRun && state.pruefRun.status==='pausiert') ? state.pruefRun : null;
  state.pruefRun = { runId: altLauf ? altLauf.runId : ('r'+Date.now()), status:'laufend',
                     gestartet: altLauf ? altLauf.gestartet : Date.now(),

                     fortgesetzt: altLauf ? true : false };
  /* 🔴 v19.19.1: Hier stand ein blosses checkpointSave(); - gestartet, aber nicht abgewartet.

     Der Checkpoint ist jetzt eine echte Barriere: siehe prueflaufStarten() am Ende dieser
     Funktion. */
  pruefStark = { anfragen:0, modell:'', fallback:false, grund:'' };
  var runde=0, MAXR=6;
  /* Teil 4 des Auftrags vom 3.9.2026 (reine Diagnose, kein Backlog-Punkt): die tatsaechliche

     ausdruecklich nicht — eine Code-Sitzung hat keine API-Schluessel und keinen Browser mit

  var startZeit = Date.now();

  /* Schritt 6 (Backlog-Punkt 84): ueber alle Runden DIESES Prueflaufs hinweg geteilt, damit

  var espnCache = {};

  var openligaCache = {};

     football-data-Monatsdateien. Ohne ihn laedt jede der bis zu MAXR Runden dieselbe
     Monatsdatei erneut - bei sechs Runden sechsmal dieselben rund 100 KB. */
  var fdCache = {};

  var espnArchivCache = {};
  /* 🔴 Backlog-Punkt 86: Zaehlt die tatsaechlichen KI-Schiedsrichter-Aufrufe dieses Prueflaufs -

     Lieferbericht nennt (Kostenregel, Abschnitt 4). */
  var pruefKiAufrufe = 0;

  function tageAbstand(a,b){
    function z(s){ var m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(!m) return null;
      return Date.UTC(Number(m[3]),Number(m[2])-1,Number(m[1])); }

  function urlOk(s){ return /^https?:\/\/[^\s"'<>]+\.[a-z]{2,}/i.test(String(s||'').trim()); }
  /* Wie lange ist der Anpfiff her? Gibt Stunden zurueck, oder null wenn unbekannt.

  function stundenSeitAnpfiff(datum, anpfiff){
    var d=String(datum||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    var u=String(anpfiff||'').match(/(\d{1,2})[:.](\d{2})/);
    if(!d||!u) return null;
    var start=new Date(Number(d[3]), Number(d[2])-1, Number(d[1]), Number(u[1]), Number(u[2]));

  function quellHost(s){
    var m=String(s||'').match(/^https?:\/\/([^\/\s"'<>]+)/i);

  }

  /* v19.8.12 (Backlog-Punkt 68): verarbeite() entscheidet NICHT mehr allein ueber den

     drei Laeufe der Runde da sind — in pruefAuswerten(). Grund: Bei drei gleichzeitigen

  function verarbeite(r, ziel, rohText, modellGenutzt){
    var id=String(r.id||'');

    for(var i=0;i<ziel.length;i++){ if(ziel[i].id===id){ p=ziel[i]; break; } }

    if(r._zuordnung && !p.zuordnung){

       Status (fertig/laeuft/fehlt), nicht nur bei einem Fehlschlag. Array, weil ein
       Spiel ueber mehrere Laeufe hinweg mehrfach gefragt werden kann (Celje/Sabah,
       elfte Fehlerart) — jede Antwort bleibt erhalten, keine wird ueberschrieben.
       Nur art==='log' (kiProtokoll); state.bets bleibt unberuehrt (Zwei-Probleme-Regel).

    var rohZeilen=[];

         oder Elfmeterschiessen, steht der Stand nach 90 Minuten laengst fest — auch dann
         ist "laeuft" keine gueltige Antwort. Nach 2,5 Stunden glauben wir sie deshalb

      var vergangen=stundenSeitAnpfiff(p.datum, p.anpfiff);
      p.laeufe.push({ ok:false, grund:'laeuft', text:'laeuft noch',

    var quelle=String(r.quelle||'');
    var pr=refLaufPruefen(r, quellHost(quelle));
    pr.quelleRoh=quelle;
    pr.gefDatum=String(r.datum||'');
    pr.gefWb=String(r.wettbewerb||'');
    pr.rohText=rohText;
    pr.modell=modellGenutzt;
    /* v19.8.9 (Nachfrage zu Punkt 64, Teil 2), unveraendert in der Sache: Hat der Lauf Ziffern
       genannt, wird der geparste Stand am refRoh-Eintrag DIESES Laufs vermerkt — auch wenn er
       an einer festen Pruefung gescheitert ist. Nur so bleibt der Widerspruch fuer
       refRohAbgleich() sichtbar, das ausdruecklich nicht angetastet wird. */
    if(pr.heim!==null && pr.gast!==null){

  /* Parken aus dem Prueflauf heraus. Es wird KEIN Ergebnis eingetragen und kein Markt
     bewertet — derselbe, jederzeit umkehrbare Schritt wie Ondos Park-Knopf (logParken).
     Nur state.kiProtokoll; state.bets kennt kein Parken (unveraenderte Luecke). */
  function parkeEintraege(p, grund, einigkeit, format){
    if(p.art!=='log') return;
    (state.kiProtokoll||[]).forEach(function(e){
      if(p.eintraege.indexOf(e.id)<0) return;
      e.geparkt=true;

  /* v19.8.12 (Backlog-Punkt 68): Entscheidung ueber EIN Spiel, nachdem alle drei Laeufe der
     Runde da sind. Die Reihenfolge ist Absicht: Sonderformat schlaegt alles, dann "laeuft
     noch", dann die Zahl der brauchbaren Laeufe, dann die Einigkeitsregel.
     Rueckgabe 1, wenn diese Runde fuer dieses Spiel etwas erreicht hat (Vorschlag oder
     Parkung) — das steuert wie bisher, ob eine weitere Runde laeuft. */
  function pruefAuswerten(p){
    var laeufe=p.laeufe||[];

       anderen zwei. Es wird kein 90-Minuten-Wert erzwungen oder gerechnet. */

    laeufe.forEach(function(x){ if(!sf && x.sonderformat) sf=x; });

      parkeEintraege(p, 'sonderformat', '', sf.sonderformat);
      p.zustand='geparkt'; p.parkGrund='sonderformat'; p.parkInfo=sf.sonderformat;
      jobSetzen(p.fixtureId, { zustand:'geparkt', match:p.match, datum:p.datum,

       hat und die 2,5-Stunden-Regel (v19.5, fuenfte Fehlerart) die Angabe stuetzt. */
    if(!gut.length && laeufe.some(function(x){ return x.grund==='laeuft' && x.nochAktuell; })){
      p.zustand='laeuft';
      return 0;
    }
    var u=refEinigkeit(laeufe);
    p.einigkeit=u;
    p.verworfen=laeufe.filter(function(x){ return !x.ok && x.grund!=='laeuft'; })
                      .map(function(x){ return x.text; });

       im naechsten Durchgang erneut fragen. NICHT parken — der Eintrag bleibt unveraendert
       offen und faellt am Ende unter "nicht gefunden". */
    /* 🔴 21.9.2026 (Backlog-Punkt 86, Ziel A): Der Zustand wird jetzt zusaetzlich PERSISTENT
       als 'unzureichend' festgehalten. Wirkung: Das Spiel wird in diesem Lauf nicht weitere
       fuenf Male identisch gesucht (siehe nochWas-Filter in rundeLaufen()), bleibt aber ueber
       "erneut pruefen" jederzeit gezielt wiederholbar. Ondos Drei-Laeufe-Regel selbst ist
       unberuehrt: Es wird nach wie vor NICHTS uebernommen, solange keine drei brauchbaren
       Laeufe vorliegen - nur der sofortige Wiederholungssturm entfaellt. */
    if(u.fall==='zuwenig'){
      p.zustand='fehlt';
      jobSetzen(p.fixtureId, { zustand:'unzureichend', match:p.match, datum:p.datum,
        art:p.art, eintraege:p.eintraege||null, betId:p.betId||null,
        versuche:((jobHolen(p.fixtureId)||{}).versuche||0)+1, laeufeGut:u.gesamt });
      return 0;
    }

       Die drei widersprechenden refRoh-Laeufe sind ueber refRohAbgleich() sichtbar. */
    if(u.fall==='uneinig'){
      parkeEintraege(p, 'unstable_ref', '3verschieden', '');
      p.zustand='geparkt'; p.parkGrund='unstable_ref';
      jobSetzen(p.fixtureId, { zustand:'geparkt', match:p.match, datum:p.datum,
        art:p.art, eintraege:p.eintraege||null, betId:p.betId||null, parkGrund:'unstable_ref' });
      return 1;
    }
    /* 5. Einstimmig oder zwei von drei: uebernehmen. Bei zwei von drei ist die sichtbare
       Markierung Pflichtbestandteil der Regel, kein Extra (Ondo, 3.9.2026) — sie wird in
       pruefAnwenden() an den Eintrag geschrieben. */

       wurde, statt bloss eine Warnung auszuloesen. */

    var einigkeit=(u.fall==='zweivondrei') ? (u.mehrheit+'von'+u.gesamt) : '';

      halbzeit:w.halbzeit, verl:w.verl, warnP:warnP,
      gefDatum:w.gefDatum, gefWb:w.gefWb, quelle:w.host, warn:warn, warnQ:warnQ,
      einigkeit:einigkeit, laeufeGut:u.gesamt, quellen:u.quellen, quellenZahl:u.quellenZahl,
      verworfen:p.verworfen };

      var urteile=[];
      (state.kiProtokoll||[]).forEach(function(e){
        if(p.eintraege.indexOf(e.id)<0) return;
        (e.maerkte||[]).forEach(function(m){

        });
      });

      gemeinsam.rohAntwort=w.rohText; gemeinsam.modell=w.modell;
    } else {
      gemeinsam.art='bet'; gemeinsam.betId=p.betId; gemeinsam.tipp=p.tipp;
    }
    /* 🔴 21.9.2026 (Backlog-Punkt 86, Abschnitt 5/8a): Der Vorschlag traegt jetzt die stabile
       fixtureId und - falls ueber eine Strukturquelle zugeordnet - die Diagnose des Resolvers
       (Stufe, beide vollstaendigen Paarungen, Zeitabweichung, Provider-ID-Kandidat). Beides ist
       additiv; Endstand, Halbzeit, Markturteile und alles, was die Messung betrifft, sind
       unveraendert. */
    gemeinsam.fixtureId = p.fixtureId||'';

       dieselbe fixtureId schon ein aktiver Vorschlag existiert. Genau das ergab bei Ondo 15
       Vorschlaege fuer 10 Spiele. vorschlagEinfuegen() ist die dauerhafte Sperre: identisches

    var eingefuegt = vorschlagEinfuegen(gemeinsam);
    /* Stufe 1/2: Identitaet ueber beide Mannschaften bewiesen -> Provider-ID darf sofort

    if(p.zuordnung && p.zuordnung.providerEventId && p.zuordnung.stufe<3){
      providerIdBinden(p.fixtureId, p.zuordnung.anbieter||'struktur', p.zuordnung.providerEventId);
    }
    jobSetzen(p.fixtureId, { zustand:'vorschlag', match:p.match, datum:p.datum,
      art:p.art, eintraege:eingefuegt.vorschlag.eintraege||p.eintraege||null, betId:p.betId||null,
      vorschlagId:eingefuegt.vorschlag.id, stufe:(p.zuordnung?p.zuordnung.stufe:null) });
    return 1;
  }

function logMarktSet(eid, idx, status){

   auf dem Bildschirm; fuer die Gegenpruefung war deshalb weiterhin ein Bildschirmfoto noetig.

   und schickt nichts an ein Gehirn (dass pruefListe seit v19.8.13/Punkt 69 an anderer Stelle
   gespeichert wird, aendert daran nichts). Die Reihenfolge bleibt: erst gegenpruefen, dann
   uebernehmen. Ein falsch uebernommener Endstand ist der einzige Schritt, der sich nicht
   einfach zuruecknehmen laesst. */
function pruefTextBauen(){
  var feld=document.getElementById('pruefText');
  if(!feld) return;
  if(!state.pruefListe.length){ feld.value=''; return; }
  var kopf='ONDO CONTROL — gefundene Endstaende, NOCH NICHT uebernommen · '+
    state.pruefListe.length+' Vorschlaege · erzeugt '+new Date().toLocaleDateString('de-DE')+' '+jetztUhr();
  var zeilen=state.pruefListe.map(function(p){
    var warn=[];
    if(p.warn)  warn.push('DATUM WEICHT AB');
    if(p.warnQ) warn.push('KEINE QUELLE');
    if(p.warnP) warn.push('PHASEN VERTAUSCHT?');
    /* v19.8.12 (Backlog-Punkt 68): Die Markierung gehoert auch in die Text-Ausgabe, damit
       sie beim Gegenpruefen im Chat sichtbar ist und nicht nur auf dem Bildschirm steht. */
    if(p.einigkeit) warn.push('NICHT EINSTIMMIG ('+p.einigkeit.replace('von',' VON ')+')');
    if(p.quellenZahl && p.laeufeGut && p.quellenZahl<p.laeufeGut){
      warn.push(p.laeufeGut+' LAEUFE, NUR '+p.quellenZahl+' QUELLE(N)');
    }
    if(p.verworfen && p.verworfen.length) warn.push('VERWORFEN: '+p.verworfen.join(' / '));
    if(vorschlagImKonflikt(p)) warn.push('WIDERSPRUCH ZU EINEM ANDEREN VORSCHLAG DESSELBEN SPIELS');
    return p.match+' · '+p.heim+':'+p.gast+
      (p.halbzeit?(' · HZ '+p.halbzeit):'')+
      (p.verl?(' · n.Verl. '+p.verl):'')+
      (p.gefDatum?(' · gefunden als '+p.gefDatum):'')+
      (p.gefWb?(' ['+p.gefWb+']'):'')+
      (p.quelle?(' · Quelle '+p.quelle):'')+
      ((p.art==='bet'&&p.tipp)?(' · Wettschein-Tipp: '+p.tipp):'')+
      (warn.length?(' · ⚠ '+warn.join(' / ')):'');
  });
  feld.value=kopf+'\n\n'+zeilen.join('\n');
}

    if(jj.zustand==='unzureichend' || jj.zustand==='ignoriert') zurueck.push(jj);
  }
  if(zurueck.length){
    zurueck.sort(function(a,b){ return (b.aktualisiert||0)-(a.aktualisiert||0); });
    html += '<div class="card" style="border-color:rgba(245,217,10,.25)">'+
      '<div class="muted" style="margin-bottom:8px">'+t('pruefUnzureichend')+'</div>';
    zurueck.forEach(function(j){
      html += '<div class="flex" style="padding:8px 0;border-top:1px solid var(--edge)">'+
        '<div><b style="font-size:13px">'+esc(j.match||j.fixtureId)+'</b>'+
        '<div class="muted" style="font-size:11.5px">'+esc(j.datum||'')+
        ' · '+esc(j.zustand==='ignoriert'?t('ignore'):t('pruefUnzureichend'))+'</div></div>'+
        '<button class="btn-sm" onclick="pruefErneut(\''+esc(j.fixtureId)+'\')">'+t('pruefErneutBtn')+'</button>'+
      '</div>';
    });
    html += '</div>';
  }
  return html;
}

/* ================= LERNKETTE, TEIL 2: DECISION LEDGER (Backlog-Punkt 75, 11.9.2026) =================
   Fund beim Festlegen des Evidence Ledgers (Teil 1): state.bets trug die Felder fromKI/herkunft
   schon lange, addBet() setzte sie aber immer auf false/null - keine echte Verknuepfung zu der
   Empfehlung, aus der eine Wette entstand. Ondos Auftrag: das beheben.
   Bewusst KEINE automatische Text-Zuordnung ueber den Spielnamen (Arbeitsweise-Grundsatz
   "Auswaehlen ist eine Entscheidung, Ablesen nicht") - dieselbe Ueberlegung wie bei
   oddsAuswahlBlock() und refRohAbgleich(). Ondo waehlt selbst aus einer kurzen Liste offener
   Empfehlungen; die Verknuepfung geht ueber die feste id, nicht ueber den Spielnamen (der bei
   Namensvarianten nicht stabil genug waere, siehe Backlog-Punkt 41). */
function kiWahlBlock(){

/* Auswaehlen fuellt NUR den Spielnamen ab - reines Ablesen einer bereits getroffenen Wahl,
   kein weiterer Automatismus. Ondo kann ihn danach weiterhin von Hand aendern.
   v19.8.27, eigener Fund bei der Nachpruefung von v19.8.26: Hier wurde zusaetzlich der
   getippte Spielstand ("2:1") in das Tipp-Feld geschrieben. Das ist die falsche Bedeutung —
   "tipp" haelt bei einer Wette fest, WELCHE Wette gesetzt wurde ("Beide Teams treffen (Ja)",
   "Frankreich ueber 2,5 Tore", siehe die Bestandsdaten), nicht den erwarteten Endstand. Der
   Text wird ausserdem dem Schiedsrichter beim Pruefen einer Wette vorgelegt (art:'bet'),
   haette dort also eine falsche Angabe gezeigt. Das Feld bleibt jetzt unberuehrt. */
function kiWahlUebernehmen(id){
  if(!id) return;

   Bewusst ADDITIV statt kiWahlBlock() umzubauen: die bestehende Einzelauswahl (samt ihrem
   Trockentest) bleibt unveraendert die "erste" Verknuepfung; dieser Block bietet nur WEITERE

   Kombi hat mehr als eine, eine einzelne Auswahl reicht dafuer nicht). Braucht mindestens zwei
   offene Vorhersagen, sonst gibt es nichts zum Verbinden - kein leerer, verwirrender Block. */

/* v19.11.0 (Backlog-Punkt 78): v.kiId (einzeln, wie bisher) bleibt gueltig - v.kiIds (Liste,
   neu, fuer eine Kombi mit mehreren verknuepften Vorhersagen) kommt zusaetzlich dazu, keines
   ersetzt das andere. kiProtokollId (einzeln) wird weiterhin GENAU DANN gesetzt, wenn nur EINE
   Vorhersage aufgeloest werden konnte - bestehender Code/Test, der nur dieses Feld liest, sieht
   dadurch bei einer normalen Einzelwette keinen Unterschied. kiProtokollIds (Liste) traegt ab
   sofort die vollstaendige, kanonische Verknuepfung, auch bei genau einer Vorhersage. */
function addBet(v, einsatzVal){
  var einsatz = Math.min(parseFloat(String(einsatzVal).replace(",","."))||0, state.regeln.maxEinsatz);
  var ids = Array.isArray(v.kiIds) ? v.kiIds.filter(Boolean) : (v.kiId ? [v.kiId] : []);
  var quellen = ids.map(function(id){ return (state.kiProtokoll||[]).find(function(e){ return e.id===id; }); }).filter(Boolean);
  var herkuenfte = quellen.map(function(e){ return e.herkunft; });
  var herkunftEinheitlich = herkuenfte.length
    ? (herkuenfte.every(function(h){ return h===herkuenfte[0]; }) ? herkuenfte[0] : 'gemischt')
    : null;
  state.bets.unshift({
    id:Date.now(), datum:new Date().toLocaleDateString("de-DE"),
    match:v.match, tipp:v.tipp||"", quote:parseFloat(String(v.quote).replace(",","."))||0,
    einsatz:einsatz, status:"offen", claudeRichtig:null,
    fromKI:!!quellen.length, herkunft:herkunftEinheitlich,
    kiProtokollId: quellen.length===1 ? quellen[0].id : null,
    kiProtokollIds: quellen.length ? quellen.map(function(e){ return e.id; }) : null
  });
  save(); go("wetten","historie");
}
function addBetKlick(){
  var m=document.getElementById('f_match').value, q=document.getElementById('f_quote').value,
      e=document.getElementById('f_einsatz').value, tipp=document.getElementById('f_tipp').value;
  var kw=document.getElementById('f_kiWahl'), ids=[];
  if(kw && kw.value) ids.push(kw.value);
  var boxen=document.querySelectorAll('.f_kiKombi:checked');
  boxen.forEach(function(cb){ if(ids.indexOf(cb.value)<0) ids.push(cb.value); });
  if(m&&q&&e){ addBet({match:m,tipp:tipp,quote:q,kiIds:ids},e); } else { alert(t('fillAll')); }
}

/* ================= DATENSICHERUNG (v19.1) =================
   Alle Messdaten liegen sonst nur im Browser-Speicher dieses Geraetes. */
function dateiHerunterladen(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function(){
    try{ document.body.removeChild(a); }catch(e){}
    URL.revokeObjectURL(url);
  }, 1200);
}
function datenSichern(){
  var d = new Date();
  var name = 'ondo-control-sicherung-'+d.getFullYear()+'-'+
    ('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.json';
  /* v19.7.5: Der Zeitstempel wird jetzt VOR dem Ausschreiben gesetzt. Vorher enthielt die
     Datei den Stand der VORIGEN Sicherung — nach einem Import zeigte "zuletzt gesichert"
     deshalb ein zu altes Datum und liess die Daten ungesicherter aussehen, als sie waren. */
  state.letzteSicherung = d.toLocaleDateString('de-DE')+' '+
    ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  var daten = JSON.stringify(state);
  var blob = new Blob([daten], {type:'application/json'});
  /* v19.8.30: Vorher ein direkter, synchroner localStorage-Aufruf — genau der, der bei vollem
     localStorage scheiterte und dadurch "zuletzt gesichert" nach einem Neustart wieder auf
     einen aelteren Stand zurueckfallen liess (Ondos Beobachtung 12.9.2026: "jetzt hochgeladen,
     verschwindet beim Neustart"). Jetzt ueber speicherSchreiben() — landet in IndexedDB, mit
     demselben stillen Rueckfall wie ueberall sonst. Bewusst ohne Erfolgsmeldung hier: Die
     Datei ist in jedem Fall schon erzeugt, ein zusaetzliches "gespeichert" waere verwirrend. */
  speicherSchreiben(KEY, state).catch(function(){});
  var datei = null;
  try{ datei = new File([blob], name, {type:'application/json'}); }catch(e){}
  if(datei && navigator.share && navigator.canShare && navigator.canShare({files:[datei]})){
    navigator.share({ files:[datei], title:name })
      .then(function(){ render(); })
      .catch(function(){ dateiHerunterladen(blob, name); render(); });
    return;
  }
  dateiHerunterladen(blob, name);
  render();
}
function datenLaden(input){
  if(!input.files || !input.files[0]) return;
  var leser = new FileReader();
  leser.onload = function(){
    var d = null;
    try{ d = JSON.parse(leser.result); }catch(e){}
    if(!d || typeof d !== 'object' || (!('kiProtokoll' in d) && !('bets' in d))){
      alert(t('impFail')); input.value=''; return;
    }
    var a = (d.kiProtokoll||[]).length, b = (d.bets||[]).length;
    if(!confirm(t('impConfirm').replace('{a}', a).replace('{b}', b))){ input.value=''; return; }
    for(var k in d) state[k] = d[k];
    save(); render();
    alert(t('impOk'));
    input.value='';
  };
  leser.readAsText(input.files[0]);
}

/* v19.8.9 (Nachfrage zu Punkt 64, Teil 2 — Arbeitsregel "Auswaehlen ist eine Entscheidung,
   Ablesen nicht"): Prueft, ob mehrere geparste refRoh-Laeufe desselben Eintrags beim Stand
   nach 90 Minuten oder bei der Verlaengerung auseinanderlaufen. Liefert null, wenn es keine
   zwei geparsten Laeufe gibt oder sie uebereinstimmen — sonst eine Gruppierung je Wert, zur
   Anzeige "X von Y Laeufen: WERT". Nur Laeufe MIT geparst (ab dieser Version) zaehlen mit;
   aeltere refRoh-Eintraege ohne geparst bleiben aussen vor (siehe Backlog, bekannte Grenze). */
function refRohAbgleich(e){
  var laeufe = (e.refRoh||[]).filter(function(r){
    return r.geparst && r.geparst.heim!==undefined && r.geparst.heim!==null &&
      r.geparst.gast!==undefined && r.geparst.gast!==null;
  });
  if(laeufe.length<2) return null;
  function gruppen(werte){
    var reihenfolge=[], anzahl={};
    werte.forEach(function(w){
      if(w===null || w===undefined || w==='') return;
      if(!(w in anzahl)) reihenfolge.push(w);
      anzahl[w]=(anzahl[w]||0)+1;
    });
    return reihenfolge.map(function(w){ return { wert:w, anzahl:anzahl[w] }; });
  }
  var g90=gruppen(laeufe.map(function(r){ return r.geparst.heim+':'+r.geparst.gast; }));
  var gVerl=gruppen(laeufe.map(function(r){ return r.geparst.verl; }));
  var w90=g90.length>1, wVerl=gVerl.length>1;
  if(!w90 && !wVerl) return null;
  return { gesamt:laeufe.length, g90:g90, gVerl:gVerl, w90:w90, wVerl:wVerl };
}

/* ================= VORHERSAGE-KARTE ================= */
/* v19.8.16 (Backlog-Punkt 72, Schritt 2): dritter, angehaengter Parameter einklappbar — wie
   kilogGefiltert()s mannschaft-Parameter aus Punkt 71, alte Aufrufe mit nur zwei Argumenten
   bleiben unveraendert lauffaehig (einklappbar dann undefined, falsy). Bewusst NICHT ueber
   mitKnoepfen entschieden: der steuert ausschliesslich, ob Aktions-Knoepfe erscheinen, nicht
   ob eine Karte einklappbar sein soll — beide Aufrufmuster faellen heute zufaellig zusammen,
   das ist keine Bedeutung von mitKnoepfen selbst. */
function vorhersageKarte(e, mitKnoepfen, einklappbar){
  var quelle = (e.herkunft==='flash') ? '🌱 Flash' : '🧠 Sonnet';
  var maerkte = (e.maerkte||[]).map(function(m,idx){
    var chip = m.status==='richtig' ? '<span class="badge b-win">'+t('stRight')+'</span>'
             : m.status==='falsch'  ? '<span class="badge b-loss">'+t('stWrong')+'</span>'
             : '<span class="p">'+m.p+' %</span>';
    var knoepfe = (mitKnoepfen && m.status!=='offen')
      ? ' <button class="btn-sm" onclick="logMarktSet(\''+e.id+'\','+idx+',\'offen\')">'+t('reset')+'</button>'
      : (mitKnoepfen
        ? ' <button class="btn-sm btn-win" onclick="logMarktSet(\''+e.id+'\','+idx+',\'richtig\')">✓</button>'+
          ' <button class="btn-sm btn-loss" onclick="logMarktSet(\''+e.id+'\','+idx+',\'falsch\')">✗</button>'
        : '');
    return '<div class="mkt"><div>'+esc(m.label)+
      (m.status!=='offen'?(' <span class="muted">('+m.p+' %)</span>'):'')+'</div>'+
      '<div style="white-space:nowrap">'+chip+knoepfe+'</div></div>';
  }).join('');
  /* v19.7 Punkt A: reine Anzeige. Der Hinweis "≠ Anzeige oben" vergleicht das Wort mit der
     angezeigten Btts-Aussage; er wird nirgends gespeichert und geht in keine Kennzahl ein. */
  var wortZeile = '';
  if(e.bttsWort==='ja' || e.bttsWort==='nein'){
    var btts = (e.maerkte||[]).filter(function(m){ return m.typ==='btts'; })[0];
    var angezeigtJa = btts ? (btts.code==='btts_ja') : null;
    var abweich = (angezeigtJa!==null) && (angezeigtJa !== (e.bttsWort==='ja'));
    wortZeile = '<div class="mkt"><div class="muted">'+t('bttsWord')+': <b style="color:var(--text)">'+
      e.bttsWort+'</b></div><div style="white-space:nowrap">'+
      (abweich?('<span class="muted" style="color:var(--loss)">'+t('bttsMismatch')+'</span>'):'')+'</div></div>';
  }
  var endstand = (e.ergebnisHeim!==null && e.ergebnisHeim!==undefined)
    ? '<div class="muted" style="margin-top:8px">'+t('finalScore')+': <b style="color:var(--text)">'+e.ergebnisHeim+':'+e.ergebnisGast+'</b>'+
      ((e.ergebnisHalbzeit||e.ergebnisVerl)?('<br><span style="font-size:11px">'+
        (e.ergebnisHalbzeit?(t('phaseHz')+' '+esc(e.ergebnisHalbzeit)):'')+
        (e.ergebnisVerl?((e.ergebnisHalbzeit?' · ':'')+t('phaseVerl')+' '+esc(e.ergebnisVerl)):'')+'</span>'):'')+
      /* v19.8.9 (Nachfrage zu Punkt 64, Teil 3, Art. 14): Herkunft ehrlich kennzeichnen, wenn
         der Endstand von Hand extern verifiziert wurde statt vom Schiedsrichter-Lauf der App. */
      (e.ergebnisQuelle==='extern_manuell'?('<br><span style="font-size:11px;color:var(--loss)">'+t('ergebnisManuell')+'</span>'):'')+
    '</div>'
    : '';
  /* v19.8.9 (Nachfrage zu Punkt 64, Teil 2): sichtbar machen statt unkommentiert einen Wert
     zu zeigen, wenn mehrere geparste Schiedsrichter-Laeufe sich widersprechen. Ondo entscheidet
     dann selbst, welcher Stand stimmt (Arbeitsregel "Auswaehlen ist eine Entscheidung"). */
  /* v19.8.12 (Backlog-Punkt 68): Die Einigkeit der drei Schiedsrichter-Laeufe wird am Eintrag
     sichtbar gemacht, nicht versteckt — damit sich spaeter auswerten laesst, ob 2-von-3-Faelle
     seltener zutreffen als einstimmige. Bei Einstimmigkeit steht hier nichts (keine Markierung
     noetig, Entscheidung Ondo 3.9.2026).
     Verhaeltnis zur Zeile aus refRohAbgleich() darunter: Beide koennen beim selben Eintrag
     gleichzeitig erscheinen und widersprechen sich nicht. Diese Zeile sagt, WAS uebernommen
     wurde und wie knapp (2 von 3); die Zeile darunter zeigt die einzelnen widersprechenden
     Staende. Bei einem geparkten Eintrag (drei verschiedene Werte) steht nur die Zeile
     darunter, weil nichts uebernommen wurde. */
  var einigZeile = '';
  var einigT = /^(\d+)von(\d+)$/.exec(String(e.refEinigkeit||''));
  if(einigT){
    einigZeile += '<div class="muted" style="margin-top:8px;color:var(--loss)">'+
      t('refEinig2von3').replace('{a}',einigT[1]).replace('{b}',einigT[2])+'</div>';
  }
  if(e.refQuellen && e.refLaeufe && e.refQuellen<e.refLaeufe){
    einigZeile += '<div class="muted" style="margin-top:4px;color:var(--loss)">'+
      t('refQuellenZahl').replace('{a}',e.refLaeufe).replace('{b}',e.refQuellen)+'</div>';
  }
  var widerspruch = refRohAbgleich(e);
  var widerspruchZeile = '';
  if(widerspruch){
    var teile=[];
    if(widerspruch.w90){
      teile.push(t('finalScore')+' — '+widerspruch.g90.map(function(x){
        return t('refRunsVon').replace('{a}',x.anzahl).replace('{b}',widerspruch.gesamt).replace('{c}',x.wert);
      }).join(' · '));
    }
    if(widerspruch.wVerl){
      teile.push(t('phaseVerl')+' — '+widerspruch.gVerl.map(function(x){
        return t('refRunsVon').replace('{a}',x.anzahl).replace('{b}',widerspruch.gesamt).replace('{c}',x.wert);
      }).join(' · '));
    }
    widerspruchZeile = '<div class="muted" style="margin-top:8px;color:var(--loss)">'+t('refWiderspruch')+
      '<br>'+teile.join('<br>')+'</div>';
  }
  /* v19.8.16 (Backlog-Punkt 72, Schritt 2): kopf ist der beim Einklappen immer sichtbare
     Teil — unveraendert der bisherige Kopfblock, plus einigZeile/widerspruchZeile, die dafuer
     hierher vorgezogen werden (ihre Berechnung oben bleibt unveraendert, nur die Einfuegestelle
     aendert sich). rest ist nur im aufgeklappten Zustand sichtbar. */
  var kopf =
    '<div class="flex"><div>'+
      '<div class="disp" style="font-size:18px">'+esc(e.match)+
        (e.geparkt?(' <span class="badge b-open" style="font-size:11px">'+t('parked')+'</span>'):'')+
        (e.parkGrund==='unstable_ref'?(' <span class="badge b-open" style="font-size:11px">'+t('parkGrundInstabil')+'</span>'):'')+
        /* v19.8.12 (Backlog-Punkt 36, zweiter Teil): eigener Parkgrund fuer ein erkanntes
           Sonderformat — er ist etwas anderes als der instabile Schiedsrichter. */
        (e.parkGrund==='sonderformat'?(' <span class="badge b-open" style="font-size:11px">'+t('parkGrundFormat')+(e.parkFormat?(': '+esc(e.parkFormat)):'')+'</span>'):'')+'</div>'+
      '<div class="muted">'+e.datum+(e.anpfiff?(' '+esc(e.anpfiff)):'')+' · '+quelle+(e.wettbewerb?(' · '+esc(e.wettbewerb)):'')+'</div>'+
    '</div><div style="text-align:right">'+
      '<div class="score">'+e.heim+':'+e.gast+'</div>'+
      '<div class="muted" style="font-size:10px">'+t('resultTip')+'</div>'+
    '</div></div>'+
    einigZeile+
    widerspruchZeile;
  var rest =
    maerkte+
    wortZeile+
    (e.begruendung?'<div class="muted" style="margin-top:8px;border-top:1px solid var(--edge);padding-top:8px">'+esc(e.begruendung)+'</div>':'')+
    endstand+
    (mitKnoepfen?('<div style="margin-top:10px">'+
      (e.status==='offen'
        ? (e.geparkt
            ? '<button class="btn-sm btn-open" onclick="logParken(\''+e.id+'\',false)">'+t('unparkBtn')+'</button>'
            : '<button class="btn-sm" onclick="logParken(\''+e.id+'\',true)">'+t('parkBtn')+'</button>')
        : '')+
      '<button class="btn-sm" style="float:right" onclick="logLoeschen(\''+e.id+'\')">'+t('del')+'</button>'+
      '<div style="clear:both"></div></div>'):'');
  if(einklappbar){
    var offenAttr = kilogAufgeklappt[e.id] ? ' open' : '';
    return '<details class="card"'+(e.geparkt?' style="opacity:.6"':'')+offenAttr+
      ' ontoggle="kilogToggle(\''+e.id+'\',this)"><summary>'+kopf+'</summary>'+rest+'</details>';
  }
  return '<div class="card"'+(e.geparkt?' style="opacity:.6"':'')+'>'+kopf+rest+'</div>';
}

/* ================= WETTEN ================= */
function viewBets(c){
  var sub='<div class="subtabs">'+
    '<button class="subtab '+(wtab==="vorschlaege"?"on":"")+'" onclick="wtab=\'vorschlaege\';render()">'+t('sugg')+'</button>'+

  '</div>';

  if(wtab==="vorschlaege"){

    });

    return sub+

      '<div id="ladeFehler" class="muted" style="color:var(--loss);margin:10px 0"></div>'+
      /* 🔴 21.9.2026 (Backlog-Punkt 86, Abschnitt 6b): Sichtbarer Zustand des Vorhersage-Laufs.
         'pausiert' heisst: unterbrochen (App-Wechsel, Neuladen, Fehler) - bereits erhaltene
         Gehirn-Antworten sind gespeichert und werden beim naechsten Klick NICHT noch einmal
         bezahlt, es wird beim ersten offenen Schritt fortgesetzt. */
      ((state.vorhersageRun && state.vorhersageRun.status==='pausiert')
        ? '<div class="muted" style="margin:8px 0;color:var(--loss)">'+t('vorhersageFortsetzbar')+'</div>' : '')+
      '<div class="muted" style="margin:8px 0">'+t('duellD')+'</div>'+
      (state.vorschlaegeInfo?'<div class="muted" style="margin:8px 0">'+esc(state.vorschlaegeInfo)+'</div>':'')+
      (liste||'<div class="card empty">'+t('noPred')+'</div>');
  }

  if(wtab==="neu"){
    return sub+
      '<div class="card">'+
        '<div class="disp" style="font-size:20px;margin-bottom:6px">'+t('photoT')+'</div>'+
        '<div class="muted" style="margin-bottom:10px">'+t('photoD')+'</div>'+
        '<input type="file" accept="image/*" id="fotoInput" style="display:none" onchange="fotoLesen(this)"/>'+
        '<button class="btn" onclick="document.getElementById(\'fotoInput\').click()">'+t('photoBtn')+'</button>'+
        '<div id="fotoStatus" class="muted" style="margin-top:10px"></div>'+
      '</div>'+
      '<div class="card"><div class="grid">'+
      kiWahlBlock()+
      kiWahlKombiBlock()+
      '<div><label>'+t('match')+'</label><input id="f_match" placeholder="Bayern – Dortmund"/></div>'+
      '<div><label>'+t('tip')+'</label><input id="f_tipp"/></div>'+
      (hatOdds() ? oddsAuswahlBlock() : '')+
      '<div style="display:flex;gap:10px">'+
        '<div style="flex:1"><label>'+t('odds')+'</label><input id="f_quote" inputmode="decimal" placeholder="1,85"/></div>'+
        '<div style="flex:1"><label>'+t('stake')+'</label><input id="f_einsatz" inputmode="decimal" placeholder="10"/></div>'+
      '</div>'+
      '<button class="btn" onclick="addBetKlick()">'+t('saveBet')+'</button>'+
    '</div></div>';
  }

  if(wtab==="kilog"){
    var pl=(state.kiProtokoll||[]);
    var neu=pl.filter(function(e){ return e.aera==='v19'; });
    var alt=pl.filter(function(e){ return e.aera!=='v19'; });
    /* v19.8.15 (Backlog-Punkt 71): lueckenlose, ueberschneidungsfreie Dreiteilung von neu —
       geparkt===true und status==='bewertet' kommen nie gemeinsam vor (belegt bei Punkt 70),
       also deckt offenListe+bewertetListe+geparktListe neu vollstaendig ab, ohne Ueberschneidung. */
    var offenListe = neu.filter(function(e){ return e.status==='offen' && !e.geparkt; });
    var bewertetListe = neu.filter(function(e){ return e.status==='bewertet'; });
    var geparktListe = neu.filter(function(e){ return e.geparkt===true; });

    var tabBar = '<div class="subtabs scroll">'+
      '<button class="subtab '+(kilogTab==="offen"?"on":"")+'" onclick="kilogTab=\'offen\';render()">'+t('filterStatusOffen')+'</button>'+
      '<button class="subtab '+(kilogTab==="bewertet"?"on":"")+'" onclick="kilogTab=\'bewertet\';render()">'+t('kilogTabBewertet')+'</button>'+
      '<button class="subtab '+(kilogTab==="archiv"?"on":"")+'" onclick="kilogTab=\'archiv\';render()">'+t('kilogTabArchiv')+'</button>'+
      '<button class="subtab '+(kilogTab==="daten"?"on":"")+'" onclick="kilogTab=\'daten\';render()">'+t('kilogTabDaten')+'</button>'+
      '<button class="subtab '+(kilogTab==="werkzeuge"?"on":"")+'" onclick="kilogTab=\'werkzeuge\';render()">'+t('kilogTabWerkzeuge')+'</button>'+
    '</div>';

    var body='';
    /* v19.11.0 (Backlog-Punkt 77, Nachbesserung Ondo 12.9.2026): "KI-Daten gelten nur fuer
       Wetten, gehoeren also ins Wettmodul, nicht unter 'Mehr' (das ist fuer alle Module)."
       Kalibrierung, Beobachtungen, gepaarter Vergleich und der Trainingsraum stehen deshalb
       ab hier unter KI-Log/Daten statt unter "Mehr" (Fassung 106/107 damit rueckgaengig
       gemacht) - dieselbe Karte, dieselben Funktionen, nur der Ort hat sich geaendert. */
    if(kilogTab==='daten'){
      var aiZahl = calcAI();
      body = '<div class="card"><div class="stat-label">'+t('hitAI')+'</div>'+
        '<div class="stat-val">'+(aiZahl.q===null?"–":aiZahl.q+" %")+'</div>'+
        '<div class="stat-sub">'+(aiZahl.n?aiZahl.tr+" "+t('of')+" "+aiZahl.n:t('notRated'))+
        (aiZahl.n?'<br>Sonnet: '+(aiZahl.sonnet.q===null?'–':aiZahl.sonnet.q+' % ('+aiZahl.sonnet.tr+'/'+aiZahl.sonnet.n+')')+' · Flash: '+(aiZahl.flash.q===null?'–':aiZahl.flash.q+' % ('+aiZahl.flash.tr+'/'+aiZahl.flash.n+')'):'')+
        '</div></div>'+
        kalibBlock()+beobachtungenBlock()+gepaartBlock()+trainingsraumBlock()+antwortkonsistenzBlock();
    } else if(kilogTab==='bewertet'){
      var g = kilogGefiltert(bewertetListe, kilogVon, kilogBis, kilogWettbewerb, kilogStatus, kilogMannschaft);
      body = kilogFilterBlock(bewertetListe.length, g.length, 'bewertet')+
        (g.length ? g.map(function(e){ return vorhersageKarte(e,true,true); }).join('') : '<div class="card empty">'+t('filterEmpty')+'</div>');
    } else if(kilogTab==='archiv'){
      body =
        (geparktListe.length
          ? '<div class="muted" style="margin:18px 0 8px;letter-spacing:1px;text-transform:uppercase">'+t('filterStatusGeparkt')+'</div>'+
            geparktListe.map(function(e){ return vorhersageKarte(e,true,true); }).join('')
          : '') +
        (alt.length
          ? '<div class="muted" style="margin:18px 0 8px;letter-spacing:1px;text-transform:uppercase">'+t('archive')+'</div>'+
            '<div class="muted" style="margin-bottom:10px">'+t('archiveD')+'</div>'+
            alt.map(function(e){
              var chip = e.status==='richtig' ? '<span class="badge b-win">'+t('stRight')+'</span>'
                : e.status==='falsch' ? '<span class="badge b-loss">'+t('stWrong')+'</span>'
                : '<span class="badge b-open">'+t('openB')+'</span>';
              var quelle = (e.herkunft==='flash') ? ' · 🌱 Flash' : ' · 🧠 Sonnet';
              return '<div class="card" style="opacity:.65"><div class="flex"><div>'+
                '<div class="disp" style="font-size:16px">'+esc(e.match)+'</div>'+
                '<div class="muted">'+e.datum+' · '+t('tip')+': '+esc(e.tipp||'?')+' · '+t('odds')+' '+esc(e.quote||'?')+quelle+'</div>'+
                '</div>'+chip+'</div></div>';
            }).join('')
          : '');
    } else if(kilogTab==='werkzeuge'){
      body = korrFBlock()+logExportBlock()+marktlageBlock();
    } else { // 'offen', Standardfall
      /* v19.7.6: Tageweise parken. Die offenen Vorhersagen liegen nach Tagen beieinander;
         einzeln zu klicken waeren bei den gesperrten Ergebnissen dutzende Griffe. Unveraendert
         seit Punkt 71, weiterhin aus neu berechnet (alle offenen, geparkt oder nicht). */
      var tage=[], nachTag={};
      neu.forEach(function(e){
        if(e.status!=='offen') return;
        if(!nachTag[e.datum]){ nachTag[e.datum]={offen:0, geparkt:0}; tage.push(e.datum); }
        nachTag[e.datum].offen++;
        if(e.geparkt) nachTag[e.datum].geparkt++;
      });
      tage.sort(function(a,b){ return (datumZahl(b)||0)-(datumZahl(a)||0); });
      var parkBlock = tage.length
        ? '<div class="card"><div class="disp" style="font-size:18px;margin-bottom:6px">🅿 '+t('parkBtn')+'</div>'+
          '<div class="muted" style="margin-bottom:10px">'+t('parkedD')+'</div>'+
          tage.map(function(d){
            var z=nachTag[d], allePark=(z.geparkt>=z.offen);
            return '<div class="mkt"><div>'+esc(d)+' <span class="muted">('+z.offen+' '+t('open_')+
              (z.geparkt?(' · '+t('parkedCount').replace('{a}',z.geparkt)):'')+')</span></div>'+
              '<div style="white-space:nowrap">'+
              (allePark
                ? '<button class="btn-sm btn-open" onclick="logParkenTag(\''+esc(d)+'\',false)">'+t('unparkBtn')+'</button>'
                : '<button class="btn-sm" onclick="logParkenTag(\''+esc(d)+'\',true)">'+t('parkBtn')+'</button>')+
              '</div></div>';
          }).join('')+'</div>'
        : '';
      var g = kilogGefiltert(offenListe, kilogVon, kilogBis, kilogWettbewerb, 'alle', kilogMannschaft);
      body = pruefBlock()+parkBlock+kilogFilterBlock(offenListe.length, g.length, 'offen')+
        (g.length ? g.map(function(e){ return vorhersageKarte(e,true,true); }).join('') : '<div class="card empty">'+t('filterEmpty')+'</div>');
    }

    return sub+'<div class="muted" style="margin-bottom:10px">'+t('logD')+'</div>'+tabBar+body;
  }

  if(wtab==="historie" && !state.bets.length) return sub+pruefBlock()+'<div class="card empty">'+t('noBets')+'</div>';
  var h=state.bets.map(function(b){
    var badge = b.status==="offen"?'<span class="badge b-open">'+t('openB')+'</span>':
                b.status==="gewonnen"?'<span class="badge b-win">'+t('won')+'</span>':
                '<span class="badge b-loss">'+t('lost')+'</span>';
    var akt = b.status==="offen"
      ? '<button class="btn-sm btn-win" onclick="setStatus('+b.id+',\'gewonnen\')">'+t('bWon')+'</button> '+
        '<button class="btn-sm btn-loss" onclick="setStatus('+b.id+',\'verloren\')">'+t('bLost')+'</button>'
      : '<button class="btn-sm" onclick="setStatus('+b.id+',\'offen\')">'+t('reset')+'</button>';
    var pnl = b.status!=="offen"
      ? '<div style="color:'+(profit(b)>=0?"var(--win)":"var(--loss)")+';font-weight:600;margin-top:2px">'+fmt(profit(b))+'</div>'
      : '<div class="muted">'+t('possWin')+': <span style="color:var(--win)">'+fmt(b.einsatz*(b.quote-1))+'</span></div>';
    return '<div class="card">'+
      '<div class="flex"><div><div class="disp" style="font-size:19px">'+esc(b.match)+'</div>'+
      '<div class="muted">'+b.datum+' · '+t('odds')+' '+b.quote.toLocaleString("de-DE")+' · '+t('stake').replace(' (€)','')+' '+eur(b.einsatz)+'</div></div>'+badge+'</div>'+
      (b.tipp?'<div style="font-size:13px;margin-top:8px">'+t('tip')+': '+esc(b.tipp)+'</div>':'')+
      (b.fromKI?'<div class="muted" style="font-size:12px;margin-top:4px">'+t('vonKi')+' '+
        (b.herkunft==='flash'?'🌱':b.herkunft==='gemischt'?'🧠🌱':'🧠')+
        ((b.kiProtokollIds&&b.kiProtokollIds.length>1)?' · '+t('kombiN').replace('{a}',b.kiProtokollIds.length):'')+
      '</div>':'')+pnl+
      '<div style="margin-top:12px">'+akt+
      ' <button class="btn-sm" style="float:right" onclick="delBet('+b.id+')">'+t('del')+'</button></div>'+
    '</div>';
  }).join("");
  return sub+pruefBlock()+h;
}

/* ================= KALIBRIERUNGS-ANZEIGE ================= */
function kalibBlock(){
  /* Backlog-Punkt 0b: Anzeigezeile aus calcWiderspruch() -- je Markt getrennt, siehe
     Begruendung dort. Fehlen beide Maerkte (keine bewerteten Aussagen dieser Art), erscheint
     gar keine Zeile statt einer leeren. */
  function widerspruchZeile(quelle){
    var w=calcWiderspruch(quelle);
    var teile=[];
    ['tore','btts'].forEach(function(typ){
      var z=w[typ];
      if(z) teile.push(t('mkt'+(typ==='tore'?'Tore':'Btts'))+' '+String(z.quote).replace('.',',')+' % (n='+z.n+')');
    });
    if(!teile.length) return '';
    return '<div class="muted" style="margin-top:2px">'+t('widersprT')+': '+teile.join(' · ')+'</div>';
  }
  function tabelle(k, titel, quelle){
    if(!k) return '<div class="muted">'+titel+': '+t('calibNone')+'</div>';
    var brier=calcBrierScore(quelle);
    var streu=calcStreuung(quelle);
    var streuTxt = streu ? (' ('+String(streu.unten).replace('.',',')+'–'+String(streu.oben).replace('.',',')+' %)') : '';
    var brierTxt = brier ? (' · '+t('calibBrier')+': '+String(brier.wert).replace('.',',')) : '';
    var kopf='<div style="margin-top:10px"><b>'+titel+'</b> · '+t('calibDev')+': '+
      '<span style="color:'+(k.abw<=10?'var(--win)':(k.abw<=20?'var(--accent)':'var(--loss)'))+';font-weight:700">'+k.abw+' %</span>'+
      '<span class="muted">'+streuTxt+'</span>'+brierTxt+
      ' <span class="muted">('+k.gesamt+' '+t('calibPts')+')</span></div>'+
      widerspruchZeile(quelle);
    var rows=k.zeilen.map(function(z){
      return '<tr><td>'+z.von+'–'+z.bis+' %</td><td>'+z.behauptet+' %</td><td>'+z.echt+' %</td><td>'+z.n+'</td></tr>';
    }).join('');

/* Anzeige des Observation Layer (Backlog-Punkt 75, Teil 3). Jede Zeile nennt ihre
   Stichprobengroesse und ihre Staerke — ohne beides waere es eine Behauptung statt einer
   Beobachtung (Art. 14). "zu wenig" ist eine vollstaendige Aussage und wird als solche
   angezeigt, nicht weggelassen (Art. 11). */
function beobachtungenBlock(){
  var liste=beobachtungen();
  var GEHIRN={ sonnet:'🧠 Sonnet', flash:'🌱 Flash' };
  function staerkeChip(s, n){
    var farbe = s==='belegt' ? 'var(--win)' : (s==='hinweis' ? 'var(--accent)' : 'var(--dim)');
    var wort  = s==='belegt' ? t('beobBelegt') : (s==='hinweis' ? t('beobHinweis') : t('beobZuwenig'));
    var fehlt = (s==='zuwenig') ? (' · '+t('beobFehlt').replace('{a}', Math.max(0,LERN_HINWEIS-n))) : '';
    return '<span class="muted" style="color:'+farbe+'">'+wort+' (n='+n+fehlt+')</span>';
  }
  function satz(b){
    if(b.art==='selbst'){
      var kern = b.diff>=5  ? t('beobSelbstHoch').replace('{a}',b.beh).replace('{b}',b.echt).replace('{c}',b.diff)
               : b.diff<=-5 ? t('beobSelbstNiedrig').replace('{a}',b.beh).replace('{b}',b.echt).replace('{c}',Math.abs(b.diff))
               :              t('beobSelbstPasst').replace('{a}',b.beh).replace('{b}',b.echt);
      return '<b>'+GEHIRN[b.quelle]+'</b> — '+kern;
    }
    if(b.art==='markt'){
      var mk = t('mkt'+(b.typ==='tore'?'Tore':(b.typ==='btts'?'Btts':'1x2')));
      return '<b>'+GEHIRN[b.quelle]+'</b> — '+t('beobMarkt').replace('{a}',mk).replace('{b}',Math.abs(b.diff));
    }
    if(b.art==='zuversicht'){
      var k2 = b.traegt ? t('beobZuvJa') : t('beobZuvNein');
      return '<b>'+GEHIRN[b.quelle]+'</b> — '+k2.replace('{a}',b.hochQ).replace('{b}',b.tiefQ);
    }
    if(b.art==='wetten'){
      var w=b.w, teile=[];
      teile.push(t('beobWettenKi').replace('{a}',w.ausKi.n)
        .replace('{b}', w.ausKi.quote===null?'–':w.ausKi.quote).replace('{c}', fmt(w.ausKi.saldo)));
      teile.push(t('beobWettenHand').replace('{a}',w.vonHand.n)
        .replace('{b}', w.vonHand.quote===null?'–':w.vonHand.quote).replace('{c}', fmt(w.vonHand.saldo)));
      if(w.verwaist) teile.push('<span style="color:var(--loss)">'+t('beobWettenVerwaist').replace('{a}',w.verwaist)+'</span>');
      return '<b>'+t('beobWettenT')+'</b><br>'+teile.join('<br>');
    }
    return '';
  }
  var zeilen = liste.map(function(b){
    return '<div class="mkt"><div>'+satz(b)+'</div>'+
      '<div style="white-space:nowrap">'+staerkeChip(b.staerke, b.n)+'</div></div>';
  }).join('');
  return '<div class="card">'+
    '<div class="disp" style="font-size:20px;margin-bottom:6px">👁 '+t('beobT')+'</div>'+
    '<div class="muted">'+t('beobD')+'</div>'+
    (zeilen || '<div class="muted" style="margin-top:8px">'+t('beobKeine')+'</div>')+
    '<div class="muted" style="margin-top:10px;font-size:11px">'+t('beobGrundlage')+'</div>'+
  '</div>';
}

    '<pre>ONDO CONTROL '+CODE_VERSION+' — Messphase\n\nVision: Ein persönliches KI-System, das dir hilft, bessere Entscheidungen zu treffen — modular, transparent, kontrollierbar.\n\nIn dieser Phase ist die App ein MESSGERÄT, kein Wett-Berater:\n• Beide Gehirne sagen dieselben Spiele vorher\n• Gemessen wird die Kalibrierung: Stimmen die Prozentangaben?\n• Der Schiedsrichter liest nur das Ergebnis — die Bewertung rechnet fester Code\n• Keine erfundenen Quoten mehr\n\nValue-Rechnung und echte Quoten kommen zurück, sobald die Messung steht.\n\nModule: Wetten ✓ · Finanzen ✓ · Lotterien · Content · Organisation\n\nVerfassung (Auszug): Wahrheit · Transparenz · Kritik · Loyalität · Schutz · Kontrolle · keine Scheinüberlegenheit.</pre>'+

document.querySelectorAll('.nav button').forEach(function(el){
  el.onclick=function(){ go(el.dataset.tab); };
});
/* v19.8.30: load() ist jetzt async (IndexedDB-Umstieg, siehe Kommentar bei DB_NAME) — render()
   und checkUpdate() warten deshalb auf ihr Ende, statt sich mit ihr zu ueberschneiden. Die
   Speicher-Quote (echte Grenze dieses Geraets statt einer geschaetzten Zahl) wird einmal beim
   Start abgefragt und fliesst in denselben ersten render() mit ein. */
speicherQuote().then(function(q){ speicherQuoteCache = q; });
/* 🔴 21.9.2026 (Backlog-Punkt 86, Abschnitt 6/6b/7): Beim Start NACH load() - also erst,
   wenn der gespeicherte Zustand wirklich da ist - wird ein unterbrochener Lauf erkannt.
   Ein Run, der noch auf 'laufend' steht, kann nicht mehr laufen: das JavaScript der alten
   Seite ist mit ihr verschwunden. Er wird auf 'pausiert' gesetzt, also fortsetzbar gemacht.
   Ohne diesen Schritt bliebe die persistente Laufsperre aus Abschnitt 7 fuer immer stehen
   (Zombie-Sperre) und kein Knopf liesse sich mehr druecken.
   Der Auftrag verlangt ausdruecklich, dass diese Erkennung NICHT allein an visibilitychange
   haengt - deshalb steht sie hier im Programmstart und nicht nur im Handler unten. */
load().then(function(){
  pruefRunEntsperren();
  vorhersageRunEntsperren();
  /* Nur schreiben, wenn sich wirklich etwas geaendert hat - ein gewoehnlicher Start soll
     keinen ueberfluessigen Schreibvorgang ausloesen. */
  if((state.pruefRun && state.pruefRun.status==='pausiert') ||
     (state.vorhersageRun && state.vorhersageRun.status==='pausiert')) checkpointOhneBarriere();
  render(); checkUpdate();
});
/* Beim Wechsel in eine andere App bzw. beim Schliessen: keine neuen Schritte mehr anfangen
   (siehe seiteVerlassen oben) und den aktuellen Stand sichern. Der laufende Zustand ist durch
   die Checkpoints ohnehin schon fast vollstaendig geschrieben; dieser letzte Aufruf holt nur
   das Allerletzte nach. pagehide ist der in Safari zuverlaessige Weg - 'unload' feuert auf
   iOS nicht verlaesslich. */
function seiteAnhalten(){
  seiteVerlassen = true;
  if(state.pruefRun && state.pruefRun.status==='laufend') state.pruefRun.status='pausiert';
  if(state.vorhersageRun && state.vorhersageRun.status==='laufend') state.vorhersageRun.status='pausiert';
  checkpointOhneBarriere();
}
/* Bei der Rueckkehr wird der Lauf NICHT von selbst neu gestartet. Begruendung, ausdruecklich
   genannt statt verschwiegen: Ein Vorhersage- oder Prueflauf kostet echte Modellaufrufe
   (Arbeitsregel G). Ein Fortsetzen ohne Zutun koennte diese Kosten ausloesen, waehrend Ondo
   gerade nur kurz in die App schaut. Abschnitt 7 laesst genau das zu: "wieder aufgenommen
   ODER sauber als fortsetzbar erkannt". Der Zustand wird deshalb sichtbar gemacht, und der
   naechste Klick auf denselben Knopf setzt beim ersten offenen Schritt fort - ohne einen
   einzigen bereits bezahlten Aufruf zu wiederholen und ohne einen zusaetzlichen Dialog
   (Abschnitt 15b: kein neuer Pflichtschritt fuer Ondo). */
function seiteZurueck(){
  seiteVerlassen = false;
  render();
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden') seiteAnhalten(); else seiteZurueck();
});
window.addEventListener('pagehide', seiteAnhalten);
</script>

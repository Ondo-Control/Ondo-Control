  return isNaN(n) ? 0 : n;
}

/* Schritt 2+3. cache (optional) wird von rundeLaufen() ueber mehrere Runden desselben Prueflaufs
   hinweg WEITERGEREICHT (Schritt 6: kein Spiel zweimal abfragen) - ohne uebergebenen cache
   arbeitet die Funktion mit einem frischen, nur fuer diesen Aufruf gueltigen Objekt, bleibt also
   auch einzeln testbar. Ein DAUERHAFTER (IndexedDB-)Cache eigens fuer ESPN wurde bewusst NICHT
   gebaut: state.kiProtokoll traegt mit status/geparkt bereits die einzige Kennzeichnung, die
   zaehlt ("schon ermittelt -> nie wieder gefragt", siehe offeneP-Filter oben in
   ergebnissePruefen()) - ein zweiter, paralleler Cache-Speicher wuerde genau die Verdopplung
   schaffen, die Abschnitt 1c fuer den Evidence Ledger ausdruecklich ablehnt. */
function espnLauf(ziel, cache){
  if(!(ziel&&ziel.length)) return Promise.resolve([]);
  cache = cache || {};
  var gruppen={};
  ziel.forEach(function(p){
    var slug=espnSlugFuer(p.wettbewerb), datum=datumIso(p.datum);
    if(!slug || !datum) return;
    var k=slug+'|'+datum;
    if(!gruppen[k]) gruppen[k]=[];
    gruppen[k].push(p);
  });
  var schluessel=Object.keys(gruppen);
  if(!schluessel.length) return Promise.resolve([]);
  return Promise.all(schluessel.map(function(k){
    var teile=k.split('|'), slug=teile[0], datum=teile[1], ymd=datum.replace(/-/g,'');
    var scoreboardHolen = cache[k] ? Promise.resolve(cache[k]) :
      fetch('https://site.web.api.espn.com/apis/site/v2/sports/soccer/'+slug+'/scoreboard?dates='+ymd)
        .then(function(res){ return res.ok ? res.json() : { events:[] }; })
        .then(function(d){ var ev=Array.isArray(d.events)?d.events:[]; cache[k]=ev; return ev; })
        .catch(function(){ return []; });
    return scoreboardHolen.then(function(events){
      /* Nur beendete Spiele (completed===true, siehe Kopf-Kommentar), die zu einem der hier
         gesuchten Spiele passen - alles andere wuerde nur unnoetige /summary-Aufrufe ausloesen.
         Je ziel-Eintrag hoechstens EIN Kandidat (erster Treffer zaehlt, dieselbe Vereinfachung
         wie in strukturAbgleich() oben). */
      var kandidaten=[], schonGefunden={};
      events.forEach(function(ev){
        var comp=(ev.competitions||[])[0]; if(!comp) return;
        if(!comp.status || !comp.status.type || comp.status.type.completed!==true) return;
        var cs=comp.competitors||[];
        var heimC=cs.filter(function(c){return c.homeAway==='home';})[0];
        var gastC=cs.filter(function(c){return c.homeAway==='away';})[0];
        if(!heimC||!gastC) return;
        var heimName=(heimC.team&&heimC.team.displayName)||'', gastName=(gastC.team&&gastC.team.displayName)||'';
        var nH=normName(heimName), nG=normName(gastName);
        (gruppen[k]||[]).forEach(function(p){
          if(schonGefunden[p.id]) return;
          var t=teamsAus(p.match), nTH=normName(t.heim), nTG=normName(t.gast);
          var passtHeim = nTH && nH && (nH.indexOf(nTH)>=0 || nTH.indexOf(nH)>=0);
          var passtGast = nTG && nG && (nG.indexOf(nTG)>=0 || nTG.indexOf(nG)>=0);
          if(passtHeim && passtGast){ schonGefunden[p.id]=true; kandidaten.push({ id:ev.id, p:p, ev:ev }); }
        });
      });
      if(!kandidaten.length) return [];
      return Promise.all(kandidaten.map(function(kd){
        return fetch('https://site.web.api.espn.com/apis/site/v2/sports/soccer/'+slug+'/summary?event='+kd.id)
          .then(function(res){ return res.ok ? res.json() : null; })
          .then(function(sum){
            var comp = sum && sum.header && (sum.header.competitions||[])[0];
            if(!comp) return null;
            var cs=comp.competitors||[];
            var heimC=cs.filter(function(c){return c.homeAway==='home';})[0];
            var gastC=cs.filter(function(c){return c.homeAway==='away';})[0];
            if(!heimC||!gastC) return null;
            var lsH=heimC.linescores||[], lsG=gastC.linescores||[];
            /* 90-Minuten-Stand: IMMER nur Index 0+1, unabhaengig von der Gesamtlaenge - siehe
               Kopf-Kommentar (Elfmeter-/Verlaengerungs-Sicherheit, belegter Fall). */
            var torHeim=espnLinescoreZahl(lsH,0)+espnLinescoreZahl(lsH,1);
            var torGast=espnLinescoreZahl(lsG,0)+espnLinescoreZahl(lsG,1);
            var halbzeit=espnLinescoreZahl(lsH,0)+':'+espnLinescoreZahl(lsG,0);
            var verlaengerung='';
            if(lsH.length>=4 || lsG.length>=4){
              var vH=torHeim+espnLinescoreZahl(lsH,2)+espnLinescoreZahl(lsH,3);
              var vG=torGast+espnLinescoreZahl(lsG,2)+espnLinescoreZahl(lsG,3);
              verlaengerung=vH+':'+vG;
            }
            /* Ausgabeform identisch zu strukturAbgleich()s Rueckgabe (Wiederverwendung von
               verarbeite()/refLaufPruefen() UNVERAENDERT) - kd.p.id/kd.p.datum sind bereits
               eindeutig zugeordnet, eine zweite Namens-/Datumspruefung ueber strukturAbgleich()
               selbst waere hier nur doppelte Arbeit.
               _espnRoh (Backlog-Punkt 84, Nachtrag 17.9.2026, Ondos Auftrag "Rohe ESPN-Antwort
               mitschreiben"): traegt die vollstaendige rohe Summary-Antwort UND das konkret
               gefundene Scoreboard-Ereignis (nicht die ganze Tagesliste - die uebrigen Spiele
               dieses Tages gehoeren nicht zu diesem Fund) bis zu espnRohSchreiben() unten durch.
               Rein informationell, geht in kein Feld ein, das refLaufPruefen()/refEinigkeit()
               lesen. */
            return { id:kd.p.id, status:'fertig', heim:torHeim, gast:torGast, datum:kd.p.datum,
              wettbewerb:kd.p.wettbewerb||'', quelle:'https://www.espn.com/soccer/match/_/gameId/'+kd.id,
              verlaengerungGespielt: verlaengerung?'ja':'nein', verlaengerung:verlaengerung,
              halbzeit:halbzeit, torlos:(torHeim===0&&torGast===0)?'bestaetigt':'nein',
              _espnRoh:{ scoreboardEvent:kd.ev, summary:sum } };
          }).catch(function(){ return null; });
      }));
    });
  })).then(function(listen){
    return [].concat.apply([],listen).filter(Boolean);
  });
}

/* Reine Funktion: deutsche Fussball-Saisons laufen Juli-Juni. "2026-09-17" -> "2026" (laufende
   Saison 2026/27), "2026-05-16" -> "2025" (Saison 2025/26, endet im Mai). An echten Randwerten
   der bl3-Saison 2025/26 geprueft (erstes Spiel August 2025, letztes Spiel 16.5.2026 - beide
   ergeben "2025", wie von OpenLigaDB selbst unter demselben Saisonwert gefuehrt). */
function openligaSaison(datumIso){

/* Reine Funktion: liest matchResults[] in ein {heim,gast,halbzeit,verlaengerung} um, oder null
   wenn kein 90-Minuten-Stand vorhanden ist (in allen 141 live geprueften, beendeten Spielen aus
   zwei Wettbewerben nie der Fall, aber kein Absturzrisiko eingehen).
   "Unknown" wird NUR als Verlaengerungsstand gewertet, wenn er sich vom 90-Minuten-Stand
   unterscheidet ODER ein Elfmeterschiessen folgte - sonst ist er nachweislich nur ein
   redundanter Doppeleintrag ohne echte Verlaengerung (belegt: FK Pirmasens-Hamburger SV,
   DFB-Pokal, 1:2 nach 90 Minuten UND "Unknown" 1:2, kein Elfmeterschiessen - hier wurde
   keine Verlaengerung gespielt, ein blindes Uebernehmen haette das Gegenteil behauptet). */
function openligaErgebnisAus(m){
  var res={};
  (m.matchResults||[]).forEach(function(r){ res[r.resultTypeKind]=[r.pointsTeam1,r.pointsTeam2]; });
  var ft=res['After90Minutes'];
  if(!ft) return null;
  var out={ heim:ft[0], gast:ft[1], halbzeit:'', verlaengerung:'' };
  if(res['HalfTime']) out.halbzeit=res['HalfTime'][0]+':'+res['HalfTime'][1];
  var unk=res['Unknown'];
  if(unk && (res['AfterPenalties'] || unk[0]!==ft[0] || unk[1]!==ft[1])){
    out.verlaengerung = unk[0]+':'+unk[1];
  }
  return out;
}
/* Schritt 2+3, Kaskade zu espnLauf(): disjunkte Wettbewerbe (openligaShortcutFuer() deckt keine
   der ESPN_SLUG_REGELN-Wettbewerbe ab und umgekehrt), deshalb parallel statt nacheinander
   aufgerufen - kein Spiel kann beide Quellen gleichzeitig treffen. cache-Parameter wie bei
   espnLauf(): ueber mehrere Runden desselben Prueflaufs weitergereicht (Schritt 6). */
function openligaLauf(ziel, cache){
  if(!(ziel&&ziel.length)) return Promise.resolve([]);
  cache = cache || {};
  var gruppen={};
  ziel.forEach(function(p){
    var shortcut=openligaShortcutFuer(p.wettbewerb), datum=datumIso(p.datum);
    if(!shortcut || !datum) return;
    var saison=openligaSaison(datum);
    if(!saison) return;
    var k=shortcut+'|'+saison;
    if(!gruppen[k]) gruppen[k]=[];
    gruppen[k].push(p);
  });
  var schluessel=Object.keys(gruppen);
  if(!schluessel.length) return Promise.resolve([]);
  return Promise.all(schluessel.map(function(k){
    var teile=k.split('|'), shortcut=teile[0], saison=teile[1];
    var matchesHolen = cache[k] ? Promise.resolve(cache[k]) :
      fetch('https://api.openligadb.de/getmatchdata/'+shortcut+'/'+saison)
        .then(function(res){ return res.ok ? res.json() : []; })
        .then(function(d){ var arr=Array.isArray(d)?d:[]; cache[k]=arr; return arr; })
        .catch(function(){ return []; });
    return matchesHolen.then(function(matches){
      var treffer=[];
      (gruppen[k]||[]).forEach(function(p){
        var t=teamsAus(p.match), nTH=normName(t.heim), nTG=normName(t.gast);
        var pIso=datumIso(p.datum);
        var fund=null;
        for(var i=0;i<matches.length;i++){
          var mt=matches[i];
          if(!mt.matchIsFinished) continue;
          var mDatum=String(mt.matchDateTimeUTC||'').slice(0,10);
          if(!mDatum) continue;
          var tage=Math.abs(new Date(pIso+'T00:00:00Z').getTime()-new Date(mDatum+'T00:00:00Z').getTime())/86400000;
          if(tage>1) continue;
          var nH=normName(mt.team1&&mt.team1.teamName), nG=normName(mt.team2&&mt.team2.teamName);
          var passtHeim = nTH && nH && (nH.indexOf(nTH)>=0 || nTH.indexOf(nH)>=0);
          var passtGast = nTG && nG && (nG.indexOf(nTG)>=0 || nTG.indexOf(nG)>=0);
          if(passtHeim && passtGast){ fund=mt; break; }
        }
        if(!fund) return;
        var erg=openligaErgebnisAus(fund);
        if(!erg) return;
        treffer.push({ id:p.id, status:'fertig', heim:erg.heim, gast:erg.gast, datum:p.datum,
          wettbewerb:p.wettbewerb||'', quelle:'https://www.openligadb.de/',
          verlaengerungGespielt: erg.verlaengerung?'ja':'nein', verlaengerung:erg.verlaengerung,
          halbzeit:erg.halbzeit, torlos:(erg.heim===0&&erg.gast===0)?'bestaetigt':'nein' });
      });
      return treffer;
    });
  })).then(function(listen){
    return [].concat.apply([],listen).filter(Boolean);
  });
}

/* Reine Funktion -- bereitet die von The Odds API gelieferten Ereignisse (Format:
   {home_team, away_team, commence_time, bookmakers:[{title,markets:[{key,outcomes:[{name,price}]}]}]})
   zu einer kurzen, anklickbaren Liste auf. Nimmt bewusst NUR den ersten gelieferten Buchmacher
   mit einem h2h-Markt -- keine Mittelung, keine eigene Auswahl "des besten" Werts, die Quelle
   wird sichtbar mitgegeben, damit Ondo weiss, worauf sich der Wert stuetzt. Kein Netzwerkzugriff,
   testbar mit erfundenen, aber formatgleichen Daten. */
function oddsListeAufbereiten(events){
  return (events||[]).map(function(e){
    var bm=(e.bookmakers||[]).filter(function(b){
      return (b.markets||[]).some(function(m){ return m.key==='h2h'; });
    })[0];
    var markt = bm ? (bm.markets||[]).filter(function(m){return m.key==='h2h';})[0] : null;
    var aus = markt ? (markt.outcomes||[]) : [];
    function preis(name){
      var f=aus.filter(function(o){return o.name===name;})[0];
      return f ? f.price : null;
    }
    return {
      heim: e.home_team||'', gast: e.away_team||'', datum: e.commence_time||'',
      quelle: bm ? (bm.title||bm.key||'') : '',
      qHeim: preis(e.home_team), qUnentschieden: preis('Draw'), qGast: preis(e.away_team),
      keineQuote: !markt || !aus.length
    };
  });
}
function oddsAbrufen(ligaKey){

    .then(function(events){

function apiCall(body){

    method:'POST',

      'x-api-key':state.apiKey,
      'anthropic-version':'2023-06-01',

      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){ j._status=r.status; return j; }); });
}
function parseJsonBlock(res){
  var texte=(res.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;});
  var parsed=null;
  for(var i=texte.length-1;i>=0 && !parsed;i--){
    var c=texte[i].replace(/```json|```/g,'').trim();
    var s=c.indexOf('{'), e=c.lastIndexOf('}');
    if(s===-1||e===-1) continue;
    try{ parsed=JSON.parse(c.slice(s,e+1)); }catch(x){}
  }
  return parsed;
}
var LANGWORD={de:'Deutsch',fr:'Franzoesisch',en:'Englisch'};

/* Anthropic mit Websuche + Nachfass-Runden */
function sonnetSuche(prompt, maxUses, maxTokens){
  var messages=[{role:'user',content:prompt}];
  var runden=0;
  function schritt(res){
    if(res._status===401) throw new Error(t('keyBad'));
    if(res._status===400 && res.error && /credit/i.test(res.error.message||'')) throw new Error(t('credEmpty'));
    if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
    if(res.stop_reason==='pause_turn' && runden<3){
      runden++;
      messages.push({role:'assistant',content:res.content});
      return apiCall({model:'claude-sonnet-5',max_tokens:maxTokens,messages:messages,
        tools:[{type:'web_search_20260209',name:'web_search',max_uses:maxUses}],output_config:{effort:'low'}}).then(schritt);
    }
    return res;
  }
  return apiCall({model:'claude-sonnet-5',max_tokens:maxTokens,messages:messages,
    tools:[{type:'web_search_20260209',name:'web_search',max_uses:maxUses}],output_config:{effort:'low'}}).then(schritt);
}

  function unklar(grund){

function spielListeHolen(){

    'Letzte Nachricht: NUR kompaktes JSON:\n'+
    '{"lage":[{"match":"Team A - Team B","hinweis":"..."}]}';
  return sonnetSuche(prompt, MARKTLAGE_MAX_SUCHEN, 3000).then(function(res){
    if(res._status===401 || res.error) return null;
    var parsed = parseJsonBlock(res);
    if(!parsed || !parsed.lage) return null;
    return parsed.lage;
  }).catch(function(){ return null; });
}

/* ================= SCHRITT 2: VORHERSAGE JE GEHIRN ================= */
/* v19.10.0 (Backlog-Punkt 79): dritter Parameter marktlage, OPTIONAL. Wird er nicht mitgegeben
   (wie bisher jeder Aufruf, und wie JEDER Trainingsraum-Aufruf weiterhin), aendert sich am
   Prompt nichts - genau das haelt den Trainingsraum ohne Suche/Erinnerung, wie Ondo verlangt,
   ohne dass dort etwas eigens abgeschaltet werden muss. */
function vorhersageGehirn(gehirn, liste, marktlage){
  var fruehere = (state.kiProtokoll||[])
    .filter(function(e){ return e.aera==='v19' && (e.herkunft||'sonnet')===gehirn; })
    .slice(0,6)
    .map(function(e){
      /* v19.7 Punkt D: Frueher stand hier nur der getippte Endstand. Das Gehirn hat den
         eigenen Tipp als geschehenes Ereignis behandelt. Jetzt steht in jeder Zeile
         getrennt, was getippt wurde und was wirklich passiert ist. */
      var hatErgebnis = (e.ergebnisHeim!==null && e.ergebnisHeim!==undefined &&
                         e.ergebnisGast!==null && e.ergebnisGast!==undefined);
      var wirklich = hatErgebnis ? ('wirklich '+e.ergebnisHeim+':'+e.ergebnisGast) : 'Ergebnis noch offen';
      return e.datum+': '+e.match+' \u00b7 getippt '+e.heim+':'+e.gast+' \u00b7 '+wirklich+
             (e.begruendung?(' ('+e.begruendung+')'):'');
    }).join(' | ');

  var spieleTxt = liste.map(function(s,i){
    return (i+1)+'. '+s.match+(s.wettbewerb?(' ['+s.wettbewerb+']'):'')+(s.anpfiff?(' '+s.anpfiff):'');
  }).join('\n');

  /* v19.10.0 (Backlog-Punkt 79): marktlage kommt, wenn ueberhaupt, EINMAL fuer die ganze Liste
     von marktlageHolen() - hier nur nach Spielname zugeordnet, keine eigene Suche. */
  var lageTxt = '';
  if(marktlage && marktlage.length){
    var zeilen = liste.map(function(s){
      var f = marktlage.find(function(m){ return normName(m.match)===normName(s.match); });
      return f ? (s.match+': '+f.hinweis) : null;
    }).filter(function(z){ return z; });
    if(zeilen.length) lageTxt = 'AKTUELLE LAGE (per Websuche recherchiert, '+heuteStr()+'):\n'+zeilen.join('\n')+'\n\n';
  }

  var prompt='Heute ist '+heuteStr()+'. Du bist Fussball-Prognostiker fuer Ondo Control. '+
    'Deine Aufgabe ist NICHT, Wetten zu empfehlen, sondern ehrlich einzuschaetzen.\n\n'+
    'Fuer JEDES der folgenden Spiele nenne:\n'+
    '- heim und gast: dein wahrscheinlichstes Ergebnis nach 90 Minuten (ganze Zahlen, ohne Verlaengerung)\n'+
    '- p1x2: wie sicher bist du in Prozent, dass der Ausgang (Heimsieg / Auswaertssieg / Unentschieden) so kommt wie in deinem Ergebnis? (1-99)\n'+
    '- pTore: wie sicher in Prozent, dass die Torrichtung stimmt (ueber bzw. unter 2,5 Tore gesamt)? (1-99)\n'+
    '- pBtts: wie wahrscheinlich ist es in Prozent, dass BEIDE Mannschaften mindestens ein Tor erzielen? '+
      'Diese Frage ist unabhaengig von deinem Ergebnis oben — antworte nicht, wie sicher du dir bist, '+
      'sondern wie wahrscheinlich das Ereignis "beide treffen" ist. (1-99)\n'+
    '- bttsWort: antworte hier NUR mit dem Wort "ja" oder "nein" auf die einfache Frage: Treffen in diesem Spiel beide Mannschaften mindestens ein Tor?\n'+
    '- begruendung: max 15 Woerter auf '+(LANGWORD[state.lang]||'Deutsch')+'\n\n'+
    'WICHTIG ZUR EHRLICHKEIT: Deine Prozentangaben werden gemessen. Sagst du oft 80 Prozent, muessen etwa 8 von 10 dieser Aussagen eintreffen. '+
    'Wenn du ein Team oder eine Liga kaum kennst, nenne Werte nahe 50 — das ist kein Makel, sondern korrekt. '+
    'Uebertriebene Sicherheit faellt in der Auswertung auf. Gib fuer JEDES Spiel eine Vorhersage ab, auch bei duenner Datenlage.\n\n'+
    (gehirn==='flash' ? ('LEHRE AUS DEINER EIGENEN KALIBRIERUNG (Backlog-Punkt 2, bestaetigt 27.8.2026): '+
      'Du ueberschaetzt deine eigene Zuversicht im Bereich 60-69 Prozent deutlich: von 49 Aussagen mit im Schnitt behaupteten 63 Prozent trafen nur 49 Prozent ein. '+
      'Dasselbe Muster zeigt sich darunter. Nimm diese Abweichung als festen Erfahrungswert in deine eigene Einschaetzung auf.\n\n') : '')+
    (fruehere?('Deine letzten eigenen Vorhersagen: '+fruehere+'\n\n'):'')+
    lageTxt+
    'SPIELE:\n'+spieleTxt+'\n\n'+
    'Letzte Nachricht: NUR kompaktes JSON:\n'+
    '{"vorhersagen":[{"match":"Team A - Team B","heim":2,"gast":1,"p1x2":58,"pTore":62,"pBtts":55,"bttsWort":"ja","begruendung":"..."}]}';

  var call = (gehirn==='flash')
    ? geminiCall({ prompt: prompt, rolle:'gehirn' })
    : apiCall({ model:'claude-sonnet-4-6', max_tokens:2500, messages:[{role:'user',content:prompt}] });

  return call.then(function(res){
    if(res._status===401) throw new Error(t('keyBad'));
    if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
    var parsed=parseJsonBlock(res);
    if(!parsed || !parsed.vorhersagen) throw new Error(t('noJson'));
    /* v19.9.0 (Backlog-Punkt 77): Fund beim Bauen des Trainingsraums, unabhaengig vom
       eigentlichen Auftrag. Bisher stand das 'modell'-Feld eines Eintrags in vorhersagen()
       ueber die GETEILTE Variable zuletztModell.gehirn, die geminiCall() bei jeder Antwort
       ueberschreibt. Solange es nur einen Aufrufer gab (vorhersagen()), war das folgenlos. Mit
       dem Trainingsraum als zweitem, potenziell GLEICHZEITIGEN Aufrufer waere das ein echtes
       Wettlauf-Risiko: Ein parallel laufender Aufruf koennte die geteilte Variable ueberschreiben,
       bevor dieser Aufruf sie liest. Behoben ohne die geteilte Variable anzufassen: res.modelVersion
       ist ein von Google dokumentiertes, JE AUFRUF EIGENES Antwortfeld (bereits seit der
       Nachfrage zu Punkt 64, 28.8.2026, in geminiCall() vorhanden, bisher nur nicht hier genutzt).
       Es wird HIER, direkt bei der Ankunft der eigenen Antwort, gelesen - race-frei. Macht
       nebenbei auch echte Live-Eintraege genauer (die tatsaechlich aufgeloeste Modellversion
       statt nur des zuletzt gewaehlten Alias). */
    parsed.vorhersagen._modell = (gehirn==='flash') ? (res.modelVersion||'') : 'claude-sonnet-4-6';
    return parsed.vorhersagen;
  }).catch(function(e){
    return { _fehler: (e && e.message) ? e.message : '?' };
  });
}

/* ================= VORHERSAGE-LAUF (v19 Hauptknopf) ================= */
/* ================= VORHERSAGE-LAUF: CHECKPOINT + RESUME (Backlog-Punkt 86, Abschnitt 6b,
   Auftrag Ondo 21.9.2026) =================
   Ondos Meldung vom 20.9.2026 nennt ausdruecklich Prueflauf UND Vorhersage. Der Befund am Code
   (21.9.2026, alles am main nachgeprueft, nicht uebernommen):
   - vorhersagen() speicherte ERST GANZ AM ENDE (ein save() nach dem Anlegen der Eintraege).
     Wurde die Seite vorher angehalten, war der ganze Lauf weg - einschliesslich bereits
     bezahlter Modellantworten.
   - Das Datum der Eintraege entstand ebenfalls erst am Ende (new Date().toLocaleDateString).
     Ein Lauf, der vor Mitternacht startete und nach Mitternacht fertig wurde, schrieb das
     falsche Spieldatum.
   - Die Spielliste traegt selbst kein Datum (spielListeHolen liefert match/wettbewerb/anpfiff/
     stufe), es gab also gar keine feste Bezugszeit.
   - kiAnfrageAktiv lebte nur im Arbeitsspeicher: nach einem Neuladen war die Sperre weg.
   Neu: ein persistenter Run mit unveraenderlichem Spieltag-Snapshot, Checkpoints vor und nach
   jedem externen Schritt, runId/attemptId-Schutz gegen verspaetete alte Antworten,
   idempotenten Eintrags-IDs und einem harten Anstoss-Schutz.
   NICHT veraendert (Abschnitt 10): Auftragstexte der Gehirne, Modelle, marktlageHolen(),
   Websuche-Obergrenzen, STUFEN, maerkteBauen(), Wahrscheinlichkeiten, Maerkte. Sonnet und Flash
   starten weiterhin PARALLEL (Promise.all) - die Checkpoints stellen den Lauf ausdruecklich
   nicht auf nacheinander um. */

/* Berlin-Ortszeit -> absoluter Zeitpunkt (ms). Ueber den tatsaechlichen Zonenversatz zu genau
   diesem Zeitpunkt, nicht ueber eine feste Stundenzahl - im Sommer +2, im Winter +1. */
function fxBerlinZuMs(datumIso, hhmm){
  var roh=Date.parse(datumIso+'T'+hhmm+':00Z');
  if(isNaN(roh)) return null;
  var b=fxBerlin(new Date(roh).toISOString());
  if(!b) return null;
  var gezeigt=Date.parse(b.datum+'T'+b.zeit+':00Z');
  if(isNaN(gezeigt)) return null;
  return roh-(gezeigt-roh);
}
/* Heutiges Datum in Europe/Berlin als ISO und in der im Projekt ueblichen Schreibweise. */
function fxHeuteBerlin(){
  var b=fxBerlin(new Date().toISOString());
  if(!b) return { iso:'', de:heuteStr() };
  var t=b.datum.split('-');
  return { iso:b.datum, de:Number(t[2])+'.'+Number(t[1])+'.'+t[0] };
}
function vorhersageRunAktiv(){
  return !!(state.vorhersageRun && state.vorhersageRun.status==='laufend');
}
/* Wie pruefRunEntsperren(): Ein beim Start als 'laufend' vorgefundener Run kann nicht mehr
   laufen und wird fortsetzbar gemacht - keine Zombie-Sperre. */
function vorhersageRunEntsperren(){
  if(state.vorhersageRun && state.vorhersageRun.status==='laufend'){
    state.vorhersageRun.status='pausiert';
  }
}
function vorhersagen(btn){
  if(!hatSonnet() && !hatGemini()){
    var f0=document.getElementById('ladeFehler'); if(f0) f0.textContent=t('noKey'); return;
  }
  /* v19.9.0 (Backlog-Punkt 77): Sperre gegen Ueberschneidung mit einem laufenden
     Trainingsraum-Lauf, siehe kiAnfrageAktiv oben.
     🔴 21.9.2026 (Backlog-Punkt 86, Abschnitt 6b): Die Sperre ist jetzt ZUSAETZLICH persistent.
     kiAnfrageAktiv bleibt unveraendert bestehen und schuetzt weiterhin gegen den Trainingsraum
     im selben Arbeitsspeicher; state.vorhersageRun.status schuetzt daneben gegen einen zweiten
     Lauf aus einem neu gerenderten Knopf und ueberlebt ein Neuladen. */
  if(kiAnfrageAktiv || vorhersageRunAktiv()){
    var fB=document.getElementById('ladeFehler'); if(fB) fB.textContent=t('kiBusy'); return;
  }
  kiAnfrageAktiv = true;
  var f=document.getElementById('ladeFehler'); if(f) f.textContent='';
  btn.disabled=true; btn.textContent=t('predListing');
  /* Teil 4 des Auftrags vom 3.9.2026 (reine Diagnose): die tatsaechliche Dauer eines
     Vorhersage-Laufs messen statt sie zu schaetzen. Das ist KEINE Aenderung am Lauf der
     Gehirne — kein anderer Auftragstext, kein anderes Modell, kein zusaetzlicher Aufruf,
     nur eine Uhrzeit-Differenz um den bestehenden Ablauf herum. */
  var startZeitV = Date.now();

  /* --- Schritt 0: fortsetzbaren Run erkennen oder neuen anlegen --- */
  var lauf = (state.vorhersageRun && state.vorhersageRun.status==='pausiert')
    ? state.vorhersageRun : null;
  if(!lauf){
    lauf = { runId:'p'+Date.now(), status:'laufend', gestartet:Date.now(), aktualisiert:Date.now(),
             snapshot:null, marktlage:null, marktlageGeholt:false,
             schritte:{}, materialisiert:{}, ausgelassen:[] };
  } else {
    lauf.status='laufend'; lauf.aktualisiert=Date.now();
  }
  state.vorhersageRun = lauf;

  /* Anstoss-Schutz (Abschnitt 6b): Welche Spiele des Snapshots sind JETZT noch nicht
     angepfiffen? Regel wortgleich aus dem Auftrag: jetzt >= geplanter Anstoss -> dieses Spiel
     wird an KEIN noch nicht gestartetes Gehirn mehr geschickt. Keine Kulanz nach Anpfiff. */
  function nochOffen(){
    var jetzt=Date.now();
    return (lauf.snapshot||[]).filter(function(s){
      return !s.anstossMs || jetzt < s.anstossMs;
    });
  }
  function angepfiffene(){
    var jetzt=Date.now();
    return (lauf.snapshot||[]).filter(function(s){
      return s.anstossMs && jetzt >= s.anstossMs;
    });
  }

  /* --- Schritt 1: Spielliste + unveraenderlicher Spieltag-Snapshot ---
     🔴 HARTE STARTBARRIERE (v19.19.1, Auftrag Abschnitt 7.2/9): Bevor der erste externe,
     kostenpflichtige Schritt beginnt - bei einem neuen Lauf die Spielliste, bei einem
     fortgesetzten Lauf die Marktlage bzw. ein Gehirn -, muss der Run mit Status 'laufend'
     geschrieben sein. Bisher kam der erste Checkpoint eines neuen Laufs erst NACH der bereits
     bezahlten Spielliste, und ein fortgesetzter Lauf erreichte die Marktlage ganz ohne
     vorherigen Checkpoint. Scheitert das Schreiben, laeuft die Kette in den catch-Zweig unten:
     kein Abruf, Run 'pausiert', Fehler sichtbar. */
  var schritt1 = checkpointSave().then(function(){ return lauf.snapshot
    ? Promise.resolve(lauf.snapshot.map(function(s){ return s.spiel; }))
    : spielListeHolen().then(function(liste){
        if(!liste.length) throw new Error(t('loadFail'));
        /* 🔴 SPIELTAG-SNAPSHOT (Abschnitt 6b, 【NEU v3】): Sobald die Liste steht, bekommt der
           Run einen UNVERAENDERLICHEN Spieltag in Europe/Berlin. Jeder spaetere Eintrag nimmt
           Datum und Anpfiff aus diesem Snapshot - nie aus einem beim Abschluss neu berechneten
           "heute". Genau das war der Mitternachtsfehler. */
        var heuteB=fxHeuteBerlin();
        lauf.snapshot = liste.map(function(s){
          var zeit=String(s.anpfiff||'').match(/(\d{1,2})[:.](\d{2})/);
          var hhmm = zeit ? (('0'+zeit[1]).slice(-2)+':'+zeit[2]) : '';
          var teams=teamsAus(s.match||'');
          return {
            spiel:s,
            fixtureId: heuteB.iso ? fxId(heuteB.iso, teams.heim, teams.gast) : '',
            match:s.match||'', wettbewerb:s.wettbewerb||'', anpfiffBerlin:hhmm,
            stufe:(s.stufe||null),
            spieltagBerlinIso:heuteB.iso, spieltagDe:heuteB.de,
            anstossMs: (heuteB.iso && hhmm) ? fxBerlinZuMs(heuteB.iso, hhmm) : null
          };
        });
        return checkpointSave().then(function(){ return liste; });
      }); });

  schritt1.then(function(liste){
    /* v19.10.0 (Backlog-Punkt 79): EINE gemeinsame Recherche fuer die ganze Liste, beiden
       Gehirnen gleich mitgegeben - Begruendung bei marktlageHolen(). state.marktlageAktiv
       ist Ondos Ausschalter fuer die laufenden Kosten, Standard an (seine Entscheidung
       "Ja fuer beides"). */
    btn.textContent=t('predResearch');
    /* --- Schritt 2: Marktlage ---
       Ist sie bereits gespeichert, wird GENAU DIESER Stand wiederverwendet und nicht neu
       recherchiert (Abschnitt 6b) - eine bereits bezahlte Websuche wird nach einer
       Unterbrechung nicht noch einmal bezahlt. Fehlt sie, wird sie nur fuer die zu diesem
       Zeitpunkt noch nicht angepfiffenen Spiele geholt. */
    var offenJetzt = nochOffen();
    var lageAnfrage;
    if(lauf.marktlageGeholt){
      lageAnfrage = Promise.resolve(lauf.marktlage);
    } else if(state.marktlageAktiv!==false && offenJetzt.length){
      lageAnfrage = marktlageHolen(offenJetzt.map(function(s){ return s.spiel; })).then(function(ml){
        lauf.marktlage=ml; lauf.marktlageGeholt=true; lauf.aktualisiert=Date.now();
        return checkpointSave().then(function(){ return ml; });
      });
    } else {
      lauf.marktlage=null; lauf.marktlageGeholt=true;
      lageAnfrage = checkpointSave().then(function(){ return null; });
    }
    return lageAnfrage.then(function(marktlage){
      btn.textContent=t('predBrain');
      /* --- Schritt 3: die beiden Gehirne, PARALLEL wie bisher ---
         Die Nummerierung im Auftrag bedeutet ausdruecklich keine Reihenfolge; Promise.all
         bleibt. Neu je Gehirn: ein Checkpoint VOR dem Netzaufruf (runId, brain, attemptId,
         startedAt, eligibleFixtureIds) und die Pruefung JEDER eintreffenden Antwort gegen
         genau diesen Schritt. */
      function gehirnSchritt(gehirn){
        var sch = lauf.schritte[gehirn];
        /* Bereits erfolgreich gespeicherte Antwort: NICHT erneut aufrufen (Abschnitt 6b). */
        if(sch && sch.status==='fertig') return Promise.resolve({ gehirn:gehirn, vorher:sch.antwort, alt:true });
        /* Safari im Hintergrund: diesen Gehirn-Aufruf gar nicht erst starten (Abschnitt 6b).
           Der Schritt bleibt ohne Status stehen und wird beim Fortsetzen nachgeholt -
           bezahlt wurde nichts, verloren geht nichts. */
        if(seiteVerlassen) return Promise.resolve({ gehirn:gehirn, vorher:null, veraltet:true });
        var offenFuerDiesenSchritt = nochOffen();
        if(!offenFuerDiesenSchritt.length){
          /* Alle Spiele angepfiffen - dieses Gehirn wird gar nicht mehr aufgerufen. */
          lauf.schritte[gehirn]={ status:'verfallen', attemptId:null, startedAt:Date.now() };
          return checkpointSave().then(function(){ return { gehirn:gehirn, vorher:null, verfallen:true }; });
        }
        var attemptId='a'+Date.now()+'_'+gehirn+'_'+Math.floor(Math.random()*1e6);
        lauf.schritte[gehirn]={ status:'laufend', attemptId:attemptId, startedAt:Date.now(),
          eligibleFixtureIds:offenFuerDiesenSchritt.map(function(s){ return s.fixtureId; }) };
        lauf.aktualisiert=Date.now();
        return checkpointSave().then(function(){
          return vorhersageGehirn(gehirn, offenFuerDiesenSchritt.map(function(s){ return s.spiel; }), marktlage);
        }).then(function(vorher){
          /* 🔴 SCHUTZ GEGEN VERALTETE ANTWORTEN (Abschnitt 6b): Gehoeren runId UND attemptId
             noch zum gueltigen Schritt? Ein alter Promise aus einem frueheren Run kann so
             nichts mehr in state schreiben. */
          var jetzt=state.vorhersageRun;
          if(!jetzt || jetzt.runId!==lauf.runId) return { gehirn:gehirn, vorher:null, veraltet:true };
          var s2=jetzt.schritte[gehirn];
          if(!s2 || s2.attemptId!==attemptId) return { gehirn:gehirn, vorher:null, veraltet:true };
          /* Die Antwort wird ZUERST als Run-Ergebnis persistent gesichert und erst danach in
             kiProtokoll materialisiert. Ein Absturz dazwischen fuehrt nicht zu einem erneuten
             Modellaufruf. */
          s2.status='fertig'; s2.antwort=vorher; s2.fertigAm=Date.now();
          lauf.aktualisiert=Date.now();
          return checkpointSave().then(function(){ return { gehirn:gehirn, vorher:vorher }; });
        });
      }
      var jobs=[], namen=[];
      if(hatSonnet()){ jobs.push(gehirnSchritt('sonnet')); namen.push('sonnet'); }
      if(hatGemini()){ jobs.push(gehirnSchritt('flash'));  namen.push('flash'); }
      return Promise.all(jobs).then(function(res){
        return { liste:liste, res:res.map(function(x){ return x.vorher; }), namen:namen,
                 marktlage:marktlage, roh:res };
      });
    });
  }).then(function(paket){
    if(!state.kiProtokoll) state.kiProtokoll=[];
    /* 🔴 21.9.2026 (Backlog-Punkt 86, Abschnitt 6b): Das Datum kommt jetzt aus dem
       UNVERAENDERLICHEN Spieltag-Snapshot, nicht mehr aus einem hier neu berechneten "heute".
       Ein Lauf, der vor Mitternacht startet und nach Mitternacht fertig wird, schreibt damit
       weiterhin den richtigen Spieltag. */
    var neu=[], fehler=[];
    var snapNach = {};
    (lauf.snapshot||[]).forEach(function(s){ snapNach[normName(s.match)]=s; });
    paket.res.forEach(function(vorher, i){
      var gehirn=paket.namen[i];
      var rohI=(paket.roh||[])[i]||{};
      if(rohI.verfallen){ fehler.push(gehirn+': '+t('vorhersageAngepfiffen')); return; }
      if(rohI.veraltet) return;                       /* alter Promise - nichts schreiben */
      if(lauf.materialisiert && lauf.materialisiert[gehirn]) return;   /* schon geschrieben */
      if(!vorher || vorher._fehler){ fehler.push(gehirn+': '+((vorher&&vorher._fehler)||'?')); return; }
      vorher.forEach(function(v, idx){
        var h=Math.max(0,Math.round(Number(v.heim))), g=Math.max(0,Math.round(Number(v.gast)));
        if(isNaN(h)||isNaN(g)) return;
        function pz(x){ var n=Math.round(Number(x)); if(isNaN(n)) n=50; return Math.max(1,Math.min(99,n)); }
        /* v19.7 Punkt A: Das Wort wird nur mitgeschrieben. Es aendert nichts am Rechnen,
           Umdrehen oder Bewerten — es zeigt nur, welche Frage das Gehirn beantwortet hat. */
        function jaNeinWort(x){
          var w=String(x||'').trim().toLowerCase();
          if(/^(ja|yes|oui|j|y)\b/.test(w)) return 'ja';
          if(/^(nein|no|non|n)\b/.test(w)) return 'nein';
          return '';
        }
        var match=String(v.match||'');
        /* v19.8.7 (Backlog-Punkt 37): Vor dem Anlegen pruefen, ob dieses Gehirn fuer dasselbe
           Spiel (Namensvarianten wie bei S1) am selben Tag schon einen Eintrag geschrieben hat.
           Bewusst je Gehirn geprueft, nicht global — Sonnet und Flash duerfen beide legitim
           einen eigenen Eintrag fuer dasselbe Spiel haben, nur ein zweiter Lauf desselben
           Gehirns am selben Tag fuer dasselbe Spiel wird uebersprungen. Keine Begrenzung der
           Laeufe pro Tag - nur echte Duplikate werden nicht angelegt. */
        /* 🔴 21.9.2026 (Backlog-Punkt 86, Abschnitt 6b): Spieltag und Anstoss kommen aus dem
           Snapshot. Fehlt ein Spiel dort (das Gehirn hat einen Namen geliefert, der in der
           Liste nicht vorkommt), wird es NICHT angelegt - lieber kein Eintrag als einer mit
           geratenem Datum (Art. 11). */
        var snap = snapNach[normName(match)];
        if(!snap) return;
        var heuteD = snap.spieltagDe;
        /* Anstoss-Schutz auch beim Schreiben. Massgeblich ist NICHT der Augenblick des
           Schreibens, sondern der Augenblick, in dem die Antwort dieses Gehirns gesichert
           wurde (schritt.fertigAm).
           🔴 BERICHTIGT im eigenen Test O2 (21.9.2026): Hier stand Date.now(). Damit verlor
           der Sonderfall aus Abschnitt 6b seinen Sinn - Sonnet antwortet VOR Anpfiff, die
           Antwort wird persistent gesichert, beim Fortsetzen ist das Spiel angepfiffen, und
           beim Materialisieren warf Date.now() genau diese bereits bezahlte, rechtzeitig
           entstandene Vorhersage wieder weg. Der Auftrag verlangt das Gegenteil: "Sonnet
           bleibt erhalten und wird NICHT erneut aufgerufen". Gemessen: 0 statt 1 Eintrag.
           Die Schutzwirkung bleibt vollstaendig - ein Gehirn, dessen Antwort erst NACH dem
           Anpfiff kam oder das gar nicht mehr aufgerufen wurde, bekommt weiterhin keinen
           Eintrag. Zusaetzlich wird geprueft, ob dieses Spiel bei diesem Schritt ueberhaupt
           zugelassen war (eligibleFixtureIds, Abschnitt 6b). */
        var schrittG = (lauf.schritte && lauf.schritte[gehirn]) || {};
        var zeitpunktG = schrittG.fertigAm || Date.now();
        var erlaubtG = !schrittG.eligibleFixtureIds ||
                       schrittG.eligibleFixtureIds.indexOf(snap.fixtureId)>=0;
        if((snap.anstossMs && zeitpunktG >= snap.anstossMs) || !erlaubtG){
          if(!lauf.ausgelassen.some(function(a){ return a.match===match && a.gehirn===gehirn; })){
            lauf.ausgelassen.push({ match:match, gehirn:gehirn, grund:'angepfiffen' });
          }
          return;
        }
        var istDuplikat = state.kiProtokoll.some(function(e){
          return e.aera==='v19' && e.herkunft===gehirn && e.datum===heuteD && normName(e.match)===normName(match);
        });
        if(istDuplikat) return;
        /* v19.8.7 (Backlog-Punkt 41): wettbewerb/anpfiff/stufe kamen bisher ueber paket.liste[idx] -
           also ueber die Position in der Liste, nicht ueber das Spiel, das das Gehirn tatsaechlich
           beantwortet hat. Stimmte die Reihenfolge der Antwort nicht mit der Liste ueberein, wurden
           diese Felder dem falschen Spiel zugeschrieben. Jetzt Nachschlagen ueber den Spielnamen
           (gleiche Namensvarianten-Logik wie bei S1/Punkt 37). Kein Treffer: Felder bleiben leer. */
        var spielGefunden = paket.liste.find(function(s){ return normName(s.match)===normName(match); });
        /* 🔴 IDEMPOTENTE EINTRAGS-ID, 21.9.2026 (Backlog-Punkt 86, Abschnitt 6b): Bisher
           'v'+Date.now()+'_'+gehirn+'_'+idx - bei einem Resume waere das eine NEUE ID fuer
           dasselbe Spiel gewesen, also ein zweiter Eintrag. Jetzt eindeutig ueber
           runId + gehirn + fixtureId; derselbe Lauf erzeugt fuer dieselbe Kombination nie
           einen zweiten Eintrag. Zusaetzlich steht unten ein ausdruecklicher Existenztest.
           FORMAT: weiterhin 'v' + [a-z0-9_] - e.id wird an mehreren Stellen in onclick-Attribute
           geschrieben (logMarktSet, logParken, logLoeschen) und ausserdem in state.bets
           (kiProtokollId/kiProtokollIds), state.vorhersagen.ids, p.eintraege und den
           Messdaten-Export gelesen. Alle diese Leser behandeln die ID als undurchsichtige
           Zeichenkette; ein Anfuehrungszeichen darf nie hineingeraten, deshalb enthaelt
           fxId() ausschliesslich [a-z0-9_]. */
        var eintragId='v'+lauf.runId+'_'+gehirn+'_'+(snap.fixtureId||('i'+idx));
        if(state.kiProtokoll.some(function(e){ return e.id===eintragId; })) return;
        var eintrag={
          id:eintragId,
          fixtureId:snap.fixtureId||'',
          aera:'v19',
          /* v19.8.0 (Backlog-Punkt F): Ab hier traegt jeder Eintrag die Codeversion, unter der
             er entstanden ist. aera ist dafuer zu grob — sie umfasst die ganze v19-Reihe.
             Eintraege OHNE dieses Feld stammen aus der Zeit vor dem Schnitt, also von der
             alten Fragestellung bei "beide treffen". Eine spaetere Berichtigung darf
             ausschliesslich Eintraege ohne dieses Feld anfassen. */
          codeVersion:CODE_VERSION,
          datum:heuteD,
          match:match,
          wettbewerb:(spielGefunden&&spielGefunden.wettbewerb)||'',
          anpfiff:(spielGefunden&&spielGefunden.anpfiff)||'',
          /* v19.8.1: Aus welchem der drei Suchdurchgaenge das Spiel stammt. Die Nummer wurde
             bisher in stufeHolen berechnet und beim Anlegen weggeworfen. Sie zeigt, ob falsche
             Anpfiffzeiten aus einer bestimmten Stufe kommen. Aendert nichts am Rechnen. */
          stufe:(spielGefunden&&spielGefunden.stufe)||null,
          herkunft:gehirn,
          heim:h, gast:g,
          bttsWort:jaNeinWort(v.bttsWort),
          /* v19.7.6: das Modell, das wirklich geantwortet hat — nicht mehr state.geminiModel.
             v19.9.0: bevorzugt vorher._modell (race-frei aus res.modelVersion, siehe
             vorhersageGehirn) - der alte Weg ueber die geteilte Variable bleibt nur als
             Rueckfallebene, falls modelVersion einmal fehlen sollte. */
          modell:(vorher._modell || (gehirn==='flash' ? (zuletztModell.gehirn||state.gModellGehirn||state.geminiModel||'') : 'claude-sonnet-4-6')),
          begruendung:String(v.begruendung||''),
          maerkte:maerkteBauen(match,h,g,pz(v.p1x2),pz(v.pTore),pz(v.pBtts)),
          ergebnisHeim:null, ergebnisGast:null,
          status:'offen',
          /* v19.10.0 (Backlog-Punkt 79): Ob genau DIESES Spiel eine recherchierte Lage bekommen
             hat - nicht nur, ob die Recherche insgesamt lief. Ein Schnitt in der Messreihe
             beginnt hier: Eintraege ohne dieses Feld (vor v19.10.0) hatten nie die Moeglichkeit
             einer Recherche; Eintraege MIT diesem Feld auf false hatten sie versucht, aber ohne
             Treffer fuer dieses Spiel oder ganz ohne Sonnet-Schluessel. */
          recherchiert: !!(paket.marktlage && paket.marktlage.some(function(m){ return normName(m.match)===normName(match); }))
        };
        state.kiProtokoll.unshift(eintrag);
        neu.push(eintrag);
      });
    });
    /* Jedes Gehirn, dessen Antwort hier verarbeitet wurde, ist damit materialisiert - ein
       spaeteres Resume legt fuer dieselbe Kombination keinen zweiten Eintrag an. */
    paket.namen.forEach(function(g, i){
      var rohI=(paket.roh||[])[i]||{};
      if(rohI.veraltet) return;
      if(!lauf.materialisiert) lauf.materialisiert={};
      lauf.materialisiert[g]=true;
    });
    /* Sichtbarer Hinweis, wenn ein Spiel wegen Anpfiff ausgelassen wurde bzw. nur EIN Gehirn
       es vor Anpfiff geschafft hat (Abschnitt 6b, Sonderfall). Keine kuenstliche zweite
       Vorhersage - das waere eine erfundene Messung. */
    var ausgelassenTxt='';
    if(lauf.ausgelassen && lauf.ausgelassen.length){
      var namenA=[]; lauf.ausgelassen.forEach(function(a){ if(namenA.indexOf(a.match)<0) namenA.push(a.match); });
      ausgelassenTxt = ' · '+t('vorhersageAngepfiffen')+': '+namenA.join(', ');
    }
    var nurEins = paket.namen.length>1 && neu.length>0 &&
      paket.namen.some(function(g){ return !neu.some(function(e){ return e.herkunft===g; }); });
    state.vorhersagen = { datum:heuteStr(), ids:neu.map(function(e){return e.id;}) };
    state.vorschlaegeInfo = t('kiOf')+': '+heuteStr()+
      ' · '+t('refDauer')+' '+Math.round((Date.now()-startZeitV)/1000)+' s'+
      ' · '+(paket.marktlage ? t('marktlageInfo').replace('{a}',paket.marktlage.length).replace('{b}',paket.liste.length) : t('marktlageAus'))+
      ausgelassenTxt+(nurEins?(' · '+t('vorhersageEinGehirn')):'')+
      (fehler.length?(' · ⚠ '+fehler.join(' · ')):'');
    /* Lauf schliessen und die persistente Sperre freigeben - aber nur, wenn wirklich jeder
       Gehirn-Schritt zu Ende gekommen ist. Wurde ein Schritt wegen App-Wechsel gar nicht erst
       gestartet (seiteVerlassen) oder ist eine veraltete Antwort zurueckgekommen, bleibt der
       Lauf 'pausiert' und damit fortsetzbar; die bereits gespeicherten Antworten und
       Eintraege bleiben erhalten und werden nicht erneut bezahlt. */
    var restOffen = paket.namen.some(function(g){
      var s=lauf.schritte[g];
      return !(s && (s.status==='fertig' || s.status==='verfallen'));
    });
    lauf.status = restOffen ? 'pausiert' : 'fertig';
    lauf.aktualisiert=Date.now();
    checkpointOhneBarriere();
    kiAnfrageAktiv = false;
    btn.disabled=false; btn.textContent=t('predBtn');
    render();
  }).catch(function(e){
    /* Fehlschlag: Die Sperre wird freigegeben, der Run bleibt aber als 'pausiert' stehen -
       bereits bezahlte Antworten sind gespeichert und gehen beim naechsten Klick nicht
       verloren, sondern werden fortgesetzt. */
    kiAnfrageAktiv = false;
    if(state.vorhersageRun && state.vorhersageRun.status==='laufend'){
      state.vorhersageRun.status='pausiert';
      /* v19.19.1: Nach einem gescheiterten kritischen Checkpoint kann auch dieses Schreiben
         scheitern - ein stiller Versuch, keine Behauptung ueber sein Gelingen, keine
         Wiederholungsschleife. Der sichtbare Fehler steht darunter in ladeFehler. */
      checkpointOhneBarriere();
    }
    btn.disabled=false; btn.textContent=t('predBtn');
    var el=document.getElementById('ladeFehler');
    if(el) el.textContent=(e&&e.message?e.message:'?');
  });
}

/* ================= TRAININGSRAUM (Backlog-Punkt 77, Auftrag Ondo 12.9.2026) =================
   Isolierte Testumgebung: Gehirne sagen Spiele mit bereits bekanntem Ergebnis blind voraus.
   Plan und Selbstkritik: Ondo-Core-Architektur.md, Abschnitt 1d. Wiederverwendet bewusst
   vorhersageGehirn() (bereits ohne Websuche), maerkteBauen() und marktUrteil() unveraendert -
   nur Eingabe (welche Spiele) und Ablage (state.trainingsraumProtokoll, GETRENNT vom Evidence
   Ledger) sind neu. */

/* Kandidaten fuer EIN Gehirn: Weg (a) aus state.kiProtokoll (dieselbe Auflage wie beim
   Observation Layer, Ondo-Core 1c), Weg (b) aus state.trainingsraumSpiele (in v1 leer).
   modellHinweis ist die beste heute bekannte Vermutung, welches Modell antworten wird -
   fuer Sonnet immer exakt (fester String), fuer Flash eine Vermutung, die NACH dem
   eigentlichen Aufruf gegen das tatsaechlich aufgeloeste Modell nachgeprueft wird
   (siehe trainingsraumLauf). Ein Spiel, das dieses Gehirn schon einmal gesehen hat - live
   ODER im Trainingsraum -, ist ausgeschlossen (Datenleck ueber "fruehere" in
   vorhersageGehirn, siehe 1d). */
/* v19.11.0 (Backlog-Punkt 77, Nachbesserung Ondo: "fuer Weg (a) einen Zeitraum/Datumsbereich
   waehlen koennen"). von/bis sind optionale ISO-Daten (wie kilogVon/kilogBis, dasselbe Feld
   <input type="date"> liefert), gelten NUR fuer Weg (a) - Ondo hat ausdruecklich nur Weg (a)
   genannt, Weg (b) ist ohnehin von Hand kuratiert (jeder Eintrag eine bewusste Entscheidung,
   kein automatischer Vorrat, den man eingrenzen muesste). datumZahl() unveraendert
   wiederverwendet - dieselbe Funktion, die kilogGefiltert() schon fuers KI-Log nutzt. */
function trainingsraumKandidaten(gehirn, modellHinweis, von, bis){
  var vonZ = von ? datumZahl(von) : null;
  var bisZ = bis ? datumZahl(bis) : null;
  /* v19.9.0, Fund bei der Selbstkritik (Ondos Auftrag: "pruefe... ob meine bisherige Idee
     irgendwo problematisch ist"): Eine erste Fassung schloss JEDES Spiel aus, zu dem dieses
     Gehirn JEMALS einen Eintrag hat - live oder im Trainingsraum. Da vorhersagen() beide
     Gehirne normalerweise gemeinsam auf dieselbe Spielliste ansetzt, waere der Weg-(a)-Vorrat
     damit fuer beide Gehirne fast immer leer gewesen - genau die Zeitersparnis, die der ganze
     Trainingsraum bringen sollte, waere verpufft. Der eigentliche Leckweg ist enger: Nur die
     LETZTEN SECHS eigenen Vorhersagen desselben Gehirns koennen ueberhaupt in "fruehere"
     auftauchen (siehe vorhersageGehirn: .slice(0,6) auf denselben Filter aera==='v19' &&
     herkunft===gehirn). Ein Spiel ausserhalb dieses Fensters kann ueber "fruehere" gar nicht
     mehr durchsickern, unabhaengig davon, ob dieses Gehirn es irgendwann live beantwortet hat.
     Deshalb: derselbe Filter, dieselbe Fensterbreite wie in vorhersageGehirn - kein geratener,
     eigener Wert (Konsistenz-Pflicht, nicht nur Bequemlichkeit: aendert sich die Fensterbreite
     dort je, muss sie hier mitgezogen werden). */
  var kuerzlich = (state.kiProtokoll||[])
    .filter(function(e){ return e.aera==='v19' && (e.herkunft||'sonnet')===gehirn; })
    .slice(0,6)
    .map(function(e){ return normName(e.match); });
  var pool=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.status!=='bewertet' || e.geparkt || e.refEinigkeit) return;
    if(e.ergebnisHeim===null || e.ergebnisHeim===undefined) return;
    if(e.ergebnisGast===null || e.ergebnisGast===undefined) return;
    pool.push({ quelle:'app', match:e.match, wettbewerb:e.wettbewerb||'', anpfiff:e.anpfiff||'',
      datum:e.datum, ergebnisHeim:e.ergebnisHeim, ergebnisGast:e.ergebnisGast });
  });
  (state.trainingsraumSpiele||[]).forEach(function(s){
    if(s.ergebnisHeim===null||s.ergebnisHeim===undefined||s.ergebnisGast===null||s.ergebnisGast===undefined) return;
    pool.push({ quelle:'extern', match:s.match, wettbewerb:s.wettbewerb||'', anpfiff:s.anpfiff||'',
      datum:s.datum, ergebnisHeim:s.ergebnisHeim, ergebnisGast:s.ergebnisGast });
  });
  return pool.filter(function(sp){
    if(!trainingsraumZugelassen(modellHinweis, sp.datum)) return false;
    if(kuerzlich.indexOf(normName(sp.match))>=0) return false;
    /* v19.11.0, Nachbesserung zu Punkt 77 (Ondo: "fuer Weg (a) einen Zeitraum/Datumsbereich
       waehlen koennen"): der Zeitraum gilt nur fuer Weg (a) (quelle==='app', bereits bewertete
       Spiele aus dem KI-Log). Weg (b) (quelle==='extern', von Ondo von Hand eingetragen) bleibt
       unberuehrt - dort waehlt Ondo die Spiele bereits einzeln beim Eintragen aus, ein weiterer
       Datumsfilter waere doppelte Auswahl fuer dieselbe Sache. */
    if(sp.quelle==='app' && (vonZ!==null || bisZ!==null)){
      var dz = datumZahl(sp.datum);
      if(vonZ!==null && (dz===null || dz<vonZ)) return false;
      if(bisZ!==null && (dz===null || dz>bisZ)) return false;
    }
    var schonGetestet = (state.trainingsraumProtokoll||[]).some(function(e){
      return e.herkunft===gehirn && normName(e.match)===normName(sp.match);
    });
    return !schonGetestet;
  });
}

/* Nur die Filterlogik von lernGrundlage(), angewandt auf das getrennte Trainingsraum-Protokoll
   statt auf den Evidence Ledger - das Ergebnis passt unveraendert in lernAbweichung(), damit
   dieselbe Kennzahl entsteht wie bei der echten Kalibrierung, direkt vergleichbar. */
function trainingsraumGrundlage(quelle, typ){
  var punkte=[];
  (state.trainingsraumProtokoll||[]).forEach(function(e){
    if(quelle && (e.herkunft||'')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status!=='richtig' && m.status!=='falsch') return;
      if(typ && m.typ!==typ) return;
      var p=Number(m.p); if(isNaN(p)) p=50;
      punkte.push({ p:Math.max(1,Math.min(99,p)), ok:(m.status==='richtig'), typ:m.typ||'' });
    });
  });
  return punkte;
}

function trainingsraumLauf(btn){
  if(!hatSonnet() && !hatGemini()){
    var f0=document.getElementById('trainErr'); if(f0) f0.textContent=t('noKey'); return;
  }
  if(kiAnfrageAktiv){
    var fB=document.getElementById('trainErr'); if(fB) fB.textContent=t('kiBusy'); return;
  }
  kiAnfrageAktiv=true;
  var f=document.getElementById('trainErr'); if(f) f.textContent='';
  btn.disabled=true; btn.textContent=t('trainRunning');

  var jobs=[], namen=[], kandJeGehirn={};
  if(hatSonnet()){
    var kS=trainingsraumKandidaten('sonnet','claude-sonnet-4-6',trainVon,trainBis);
    if(kS.length){ kandJeGehirn.sonnet=kS; jobs.push(vorhersageGehirn('sonnet',kS)); namen.push('sonnet'); }
  }
  if(hatGemini()){
    var hinweisFlash = state.gModellGehirn||state.geminiModel||'';
    var kF=trainingsraumKandidaten('flash',hinweisFlash,trainVon,trainBis);
    if(kF.length){ kandJeGehirn.flash=kF; jobs.push(vorhersageGehirn('flash',kF)); namen.push('flash'); }
  }
  if(!jobs.length){
    kiAnfrageAktiv=false; btn.disabled=false; btn.textContent=t('trainBtn');
    var fE=document.getElementById('trainErr'); if(fE) fE.textContent=t('trainNone');
    return;
  }

  Promise.all(jobs).then(function(res){
    if(!state.trainingsraumProtokoll) state.trainingsraumProtokoll=[];
    var heuteD=new Date().toLocaleDateString('de-DE');
    var neu=0, verworfen=0, fehler=[];
    res.forEach(function(vorher, i){
      var gehirn=namen[i];
      if(!vorher || vorher._fehler){ fehler.push(gehirn+': '+((vorher&&vorher._fehler)||'?')); return; }
      var kandidaten=kandJeGehirn[gehirn];
      var modellEcht=vorher._modell||'';
      vorher.forEach(function(v, idx){
        var h=Math.max(0,Math.round(Number(v.heim))), g=Math.max(0,Math.round(Number(v.gast)));
        if(isNaN(h)||isNaN(g)) return;
        function pz(x){ var n=Math.round(Number(x)); if(isNaN(n)) n=50; return Math.max(1,Math.min(99,n)); }
        function jaNeinWort(x){
          var w=String(x||'').trim().toLowerCase();
          if(/^(ja|yes|oui|j|y)\b/.test(w)) return 'ja';
          if(/^(nein|no|non|n)\b/.test(w)) return 'nein';
          return '';
        }
        var match=String(v.match||'');
        var sp=kandidaten.find(function(k){ return normName(k.match)===normName(match); });
        if(!sp) return;
        /* Authoritative Nachpruefung mit dem TATSAECHLICH aufgeloesten Modell (modellEcht),
           nicht mehr mit der Vorab-Vermutung aus trainingsraumKandidaten - siehe 1d,
           Nebenlaeufigkeits-Fund. Ein Wechsel zwischen Vermutung und echtem Modell verwirft das
           Ergebnis, statt es unsicher zuzulassen. */
        if(!trainingsraumZugelassen(modellEcht, sp.datum)){ verworfen++; return; }
        var eintrag={
          id:'t'+Date.now()+'_'+gehirn+'_'+idx,
          getestetAm:heuteD,
          quelle:sp.quelle,
          match:sp.match, wettbewerb:sp.wettbewerb, anpfiff:sp.anpfiff,
          herkunft:gehirn, modell:modellEcht,
          heim:h, gast:g,
          bttsWort:jaNeinWort(v.bttsWort),
          begruendung:String(v.begruendung||''),
          maerkte:maerkteBauen(match,h,g,pz(v.p1x2),pz(v.pTore),pz(v.pBtts)),
          ergebnisHeim:sp.ergebnisHeim, ergebnisGast:sp.ergebnisGast,
          status:'bewertet'
        };
        eintrag.maerkte.forEach(function(m){
          var ok=marktUrteil(m.code, sp.ergebnisHeim, sp.ergebnisGast);
          if(ok!==null) m.status = ok?'richtig':'falsch';
        });
        state.trainingsraumProtokoll.unshift(eintrag);
        neu++;
      });
    });
    state.trainingsraumInfo = t('trainOf')+': '+heuteStr()+' · '+neu+' '+t('trainNeu')+
      (verworfen?(' · '+verworfen+' '+t('trainVerworfen')):'')+
      (fehler.length?(' · ⚠ '+fehler.join(' · ')):'');
    save();
    kiAnfrageAktiv=false;
    btn.disabled=false; btn.textContent=t('trainBtn');
    render();
  }).catch(function(e){
    kiAnfrageAktiv=false;
    btn.disabled=false; btn.textContent=t('trainBtn');
    var el=document.getElementById('trainErr');
    if(el) el.textContent=(e&&e.message?e.message:'?');
  });
}

function trainingsraumBlock(){
  var GEHIRN={ sonnet:'🧠 Sonnet', flash:'🌱 Flash' };
  function zeile(gehirn, modellLiteral){
    var stichtag=TRAININGSRAUM_STICHTAG[modellLiteral];
    if(!stichtag){
      return '<div class="mkt"><div>'+GEHIRN[gehirn]+'</div><div class="muted">'+t('trainGesperrt')+'</div></div>';
    }
    var n=trainingsraumGrundlage(gehirn).length;
    if(!n) return '<div class="mkt"><div>'+GEHIRN[gehirn]+'</div><div class="muted">'+t('trainKeine')+'</div></div>';
    var a=lernAbweichung(trainingsraumGrundlage(gehirn));
    var s=lernStaerke(a.n);
    var farbe = s==='belegt' ? 'var(--win)' : (s==='hinweis' ? 'var(--accent)' : 'var(--dim)');
    return '<div class="mkt"><div>'+GEHIRN[gehirn]+'</div>'+
      '<div><span style="color:'+farbe+'">'+t('trainAbw').replace('{a}',a.beh).replace('{b}',a.echt).replace('{c}',a.diff)+
      '</span> <span class="muted">(n='+a.n+')</span></div></div>';
  }
  /* v19.11.0, Nachbesserung zu Punkt 77 (Ondo: "Auswahl-Moeglichkeit statt reiner Automatik" fuer
     Weg (a), + Eintragsmoeglichkeit fuer Weg (b) statt einer immer leeren Liste). Dieselbe
     Flexbox-Datumsreihe wie kilogFilterBlock()/logExportBlock() (siehe dortiger Kommentar,
     Backlog-Punkt 73 zurueckgesetzt) — kein neuer, ungeprueft CSS-Versuch an dieser Stelle. */
  var wegBListe = (state.trainingsraumSpiele||[]).map(function(s,idx){
    return '<div class="mkt"><div>'+esc(s.match)+(s.wettbewerb?' · '+esc(s.wettbewerb):'')+' · '+esc(s.datum)+
      ' · '+s.ergebnisHeim+':'+s.ergebnisGast+'</div>'+

function trainingsraumSpielHinzufuegen(){
  var m=document.getElementById('trainSpMatch');
  var w=document.getElementById('trainSpWettbewerb');
  var d=document.getElementById('trainSpDatum');
  var h=document.getElementById('trainSpHeim');
  var g=document.getElementById('trainSpGast');
  var fehler=document.getElementById('trainSpErr');
  var matchTxt=String(m.value||'').trim();
  var iso=String(d.value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  var hZ=Number(h.value), gZ=Number(g.value);
  if(!matchTxt || !iso || h.value==='' || g.value==='' || isNaN(hZ) || isNaN(gZ)){
    if(fehler) fehler.textContent=t('trainSpFehler');
    return;
  }
  /* sp.datum muss wie ueberall sonst deutsches d.m.yyyy sein - trainingsraumZugelassen()
     akzeptiert nur dieses Format (siehe dort, Fund beim Trockentest), das Datumsfeld liefert
     aber ISO (JJJJ-MM-TT). Deshalb hier umgewandelt, statt das Format an dieser einen Stelle
     abweichen zu lassen. */
  var datumDe = Number(iso[3])+'.'+Number(iso[2])+'.'+iso[1];
  if(!state.trainingsraumSpiele) state.trainingsraumSpiele=[];
  state.trainingsraumSpiele.push({
    match:matchTxt,
    wettbewerb:String(w.value||'').trim(),
    datum:datumDe,
    ergebnisHeim:Math.max(0,Math.round(hZ)),
    ergebnisGast:Math.max(0,Math.round(gZ))
  });
  m.value=''; w.value=''; d.value=''; h.value=''; g.value='';
  fehler.textContent='';
  save();
  render();
}
function trainingsraumSpielLoeschen(idx){

/* ================= ANTWORTKONSISTENZ, KRITERIUM (g) (Backlog-Punkt 80, 13.9.2026) =================
   Auftrag Ondo: "Antwortkonsistenz (g): Teste. Aber Du musst klar definieren wann es fertig
   ist." Definition VOR dem ersten Lauf im Backlog festgehalten (Punkt 80), hier nur umgesetzt,
   nicht neu erfunden. Nutzt vorhersageGehirn() unveraendert wieder, mit nur zwei Argumenten -
   dieselbe Funktion, die auch der Trainingsraum verwendet, byte-identisch ohne Marktlage
   (Regressionsgarantie aus Backlog-Punkt 79). Diese Code-Sitzung hat keinen Zugriff auf Ondos
   API-Schluessel - der Lauf selbst geschieht ueber Ondos eigenes Geraet, wie jede andere echte
   Vorhersage in dieser App. */
var ANTWORTKONSISTENZ_SPIELE = 8;
var ANTWORTKONSISTENZ_WIEDERHOLUNGEN = 3;
var ANTWORTKONSISTENZ_TIPP_SCHWELLE = 90;   /* Prozent gleichbleibender Tipp */
var ANTWORTKONSISTENZ_SPANNE_SCHWELLE = 10; /* Prozentpunkte, hoechstens im Schnitt */

function antwortkonsistenzKandidaten(){
  return (state.kiProtokoll||[])
    .filter(function(e){ return e.aera==='v19' && e.status==='offen' && !e.geparkt; })
    .slice(0, ANTWORTKONSISTENZ_SPIELE)
    .map(function(e){ return { match:e.match, wettbewerb:e.wettbewerb||'', anpfiff:e.anpfiff||'' }; });
}

/* Reine Auswertung, kein Modellaufruf - getrennt von antwortkonsistenzLauf(), damit sie ohne
   echte API-Antworten trocken getestet werden kann. laeufe: { gehirn: [ [vorhersagen], ... ] } */
function antwortkonsistenzAuswerten(liste, laeufe){
  var ergebnis={};
  Object.keys(laeufe).forEach(function(gehirn){
    var proSpiel=[];
    liste.forEach(function(s){
      var werte=[];
      (laeufe[gehirn]||[]).forEach(function(lauf){
        if(!lauf || lauf._fehler) return;
        var f=lauf.find(function(v){ return normName(v.match)===normName(s.match); });
        if(!f) return;
        var h=Math.round(Number(f.heim)), g=Math.round(Number(f.gast));
        var p=Number(f.p1x2);
        if(isNaN(h)||isNaN(g)) return;
        var code = h>g ? 'sieg_heim' : (h<g ? 'sieg_gast' : 'remis');
        werte.push({ code:code, p1x2:isNaN(p)?null:p });
      });
      if(werte.length<2) return;
      var codes=werte.map(function(w){ return w.code; });
      var gleich=codes.every(function(c){ return c===codes[0]; });
      var ps=werte.map(function(w){ return w.p1x2; }).filter(function(p){ return p!==null; });
      var spanne = ps.length ? (Math.max.apply(null,ps)-Math.min.apply(null,ps)) : null;
      proSpiel.push({ match:s.match, laeufe:werte.length, gleich:gleich, spanne:spanne });
    });
    var gleichN=proSpiel.filter(function(x){ return x.gleich; }).length;
    var spannen=proSpiel.map(function(x){ return x.spanne; }).filter(function(x){ return x!==null; });
    var avgSpanne = spannen.length ? (spannen.reduce(function(a,b){ return a+b; },0)/spannen.length) : null;
    var maxSpanne = spannen.length ? Math.max.apply(null,spannen) : null;
    var gleichAnteil = proSpiel.length ? Math.round(gleichN/proSpiel.length*100) : null;
    ergebnis[gehirn] = {
      spiele: proSpiel.length,
      gleichAnteil: gleichAnteil,
      avgSpanne: avgSpanne!==null ? Math.round(avgSpanne*10)/10 : null,
      maxSpanne: maxSpanne,
      bestanden: (gleichAnteil!==null && avgSpanne!==null)
        ? (gleichAnteil>=ANTWORTKONSISTENZ_TIPP_SCHWELLE && avgSpanne<=ANTWORTKONSISTENZ_SPANNE_SCHWELLE)
        : null,
      proSpiel: proSpiel
    };
  });
  return ergebnis;
}

function antwortkonsistenzLauf(btn){
  if(!hatSonnet() && !hatGemini()){
    var f0=document.getElementById('konsErr'); if(f0) f0.textContent=t('noKey'); return;
  }
  if(kiAnfrageAktiv){
    var fB=document.getElementById('konsErr'); if(fB) fB.textContent=t('kiBusy'); return;
  }
  var liste=antwortkonsistenzKandidaten();
  if(!liste.length){
    var fL=document.getElementById('konsErr'); if(fL) fL.textContent=t('konsKeine');
    return;
  }
  kiAnfrageAktiv=true;
  var f=document.getElementById('konsErr'); if(f) f.textContent='';
  btn.disabled=true; btn.textContent=t('konsRunning');

  var gehirne=[]; if(hatSonnet()) gehirne.push('sonnet'); if(hatGemini()) gehirne.push('flash');
  var laeufe={}; gehirne.forEach(function(g){ laeufe[g]=[]; });
  var jobs=[];
  gehirne.forEach(function(g){
    for(var k=0;k<ANTWORTKONSISTENZ_WIEDERHOLUNGEN;k++){
      jobs.push((function(gehirn){
        return vorhersageGehirn(gehirn, liste).then(function(res){ laeufe[gehirn].push(res); });
      })(g));
    }
  });

  Promise.all(jobs).then(function(){
    state.antwortkonsistenzBericht = antwortkonsistenzAuswerten(liste, laeufe);
    state.antwortkonsistenzInfo = t('konsFertig')+': '+heuteStr();
    save();
    kiAnfrageAktiv=false;
    btn.disabled=false; btn.textContent=t('konsBtn');
    render();
  }).catch(function(e){
    kiAnfrageAktiv=false;
    btn.disabled=false; btn.textContent=t('konsBtn');
    var el=document.getElementById('konsErr');
    if(el) el.textContent=(e&&e.message?e.message:'?');
  });
}

function fotoLesen(input){
  if(!input.files || !input.files[0]) return;
  if(!hatGemini() && !hatSonnet()){
    var f0=document.getElementById('fotoStatus');
    if(f0) f0.textContent=t('noKey');
    return;
  }
  var st=document.getElementById('fotoStatus');
  if(st) st.textContent=t('photoRead');
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1200, w=img.width, h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var b64=cv.toDataURL('image/jpeg',0.8).split(',')[1];
      var fotoPrompt='Das ist ein Foto eines Wettscheins (z.B. Tipico). Lies ihn exakt. Bei einer Kombi: EIN Eintrag, Gesamtquote = Moeglicher Gewinn geteilt durch Einsatz (2 Dezimalen). Bei Einzelwetten: ein Eintrag pro Wette. Status: VERLOREN -> verloren, GEWONNEN -> gewonnen, sonst offen. NUR kompaktes JSON: {"wetten":[{"match":"...","tipp":"...","quote":2.05,"einsatz":7,"status":"offen"}]}';
      var fotoCall = hatGemini()
        ? geminiCall({ prompt: fotoPrompt, imageB64: b64 })
        : apiCall({model:'claude-sonnet-4-6',max_tokens:800,
            messages:[{role:'user',content:[
              {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
              {type:'text',text:fotoPrompt}
            ]}]
          });
      fotoCall.then(function(res){
        if(res.error) throw new Error(res.error.message||('HTTP '+res._status));
        var parsed=parseJsonBlock(res);
        if(!parsed || !parsed.wetten || !parsed.wetten.length) throw new Error(t('noJson'));
        var n=0;
        parsed.wetten.forEach(function(w,idx){
          state.bets.unshift({
            id:Date.now()+idx,
            datum:new Date().toLocaleDateString('de-DE'),
            match:String(w.match||'?'),
            tipp:String(w.tipp||''),
            quote:Number(w.quote)||0,
            einsatz:Number(w.einsatz)||0,
            status:(w.status==='gewonnen'||w.status==='verloren')?w.status:'offen',
            claudeRichtig:null
          });
          n++;
        });
        save();
        if(st) st.textContent='✅ '+n+' '+t('photoOk');
        setTimeout(function(){ go('wetten','historie'); },800);
      })
      .catch(function(e){
        if(st) st.textContent=t('photoFail')+(e&&e.message?e.message:'?');
      });
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(input.files[0]);
}

/* ================= SCHIEDSRICHTER — FESTE PRUEFUNGEN OHNE MODELL (v19.8.12) =================
   Backlog-Punkt 68 (Ondo, 3.9.2026) und Punkt 36, zweiter Teil. Diese drei Funktionen stehen

/* Teil 3 (Ergaenzung zu Backlog-Punkt 0c): NEGATIVLISTE, ausdruecklich KEINE Positivliste.
   Eine Positivliste "amtlicher" Quellen wuerde Wettbewerbe ausserhalb Europas (z. B. Gabun,
   Indien) nicht abdecken und eine Vollstaendigkeit vortaeuschen, die nicht besteht. Jede hier
   nicht genannte Quelle zaehlt neutral und ohne Rangfolge — auch OneFootball, Flashscore,

   Zwei Gruppen:
   1. Belegt falsch (30./31.7.2026): terrikon.com und flashfussball.de lieferten die falschen
      Ergebnisse des UEFA-Abgleichs und vier erfundene 0:0 in Folge.
   2. Wett- und Buchmacherseiten: Blueprint Grenze 5 belegt technisch, dass solche Seiten ihre
      Zahlen erst im Browser per JavaScript nachladen — ein Abruf sieht nur Werbetext.
   GRENZE, ausdruecklich (Art. 14): Die Liste erkennt nur, was auf ihr steht; eine unbekannte
   Wettseite faellt durch. Und der Beleg zu Grenze 5 wurde mit WETTQUOTEN gefuehrt, nicht mit
   Endstaenden — dieselbe technische Ursache traefe vermutlich auch den Endstand auf derselben
   Seite, bewiesen ist das fuer Endstaende NICHT. */
var REF_QUELLE_FALSCH = ['terrikon.com','flashfussball.de'];
var REF_QUELLE_WETTE  = ['tipico','bet365','bwin','interwetten','unibet','betano','betway',
  'williamhill','bet-at-home','winamax','betfair','pinnacle','1xbet','ladbrokes','betsson',
  'sportingbet','xtip','admiralbet','oddset','mybet','betvictor','888sport','wettbasis'];
function quelleUnzuverlaessig(host){
  var h=String(host||'').toLowerCase();
  if(!h) return '';
  for(var i=0;i<REF_QUELLE_FALSCH.length;i++){
    if(h===REF_QUELLE_FALSCH[i] || h.indexOf('.'+REF_QUELLE_FALSCH[i])>=0) return 'belegt_falsch';
  }
  for(var j=0;j<REF_QUELLE_WETTE.length;j++){
    if(h.indexOf(REF_QUELLE_WETTE[j])>=0) return 'wettanbieter';
  }
  return '';
}

/* Prueft EINEN Schiedsrichter-Lauf gegen die festen Regeln aus Backlog-Punkt 68. Kein Modell
   ist daran beteiligt — was hier scheitert, scheitert an Arithmetik, nicht an einem Urteil.
   Rueckgabe: { ok, grund, text, heim, gast, halbzeit, verl, host, quelleSchwach, sonderformat }
   grund ist eine unveraenderliche Kennung fuer die Logik, text die kurze Anzeigefassung. */
function refLaufPruefen(r, host){
  var erg={ ok:false, grund:'', text:'', heim:null, gast:null, halbzeit:'', verl:'',
            host:String(host||''), quelleSchwach:'', sonderformat:'' };
  function nein(grund, text){ erg.grund=grund; erg.text=text; return erg; }
  if(!r) return nein('leer','keine Antwort');
  /* Ziffern zuerst lesen, damit sie am refRoh-Lauf vermerkt werden koennen, auch wenn der
     Lauf gleich darauf an einer festen Pruefung scheitert — sonst waere der Widerspruch fuer
     refRohAbgleich() unsichtbar. */
  var h=Math.round(Number(r.heim)), g=Math.round(Number(r.gast));
  if(!isNaN(h) && !isNaN(g)){ erg.heim=h; erg.gast=g; }
  erg.halbzeit=String(r.halbzeit||'').trim();
  erg.verl=String(r.verlaengerung||'').trim();
  /* Punkt 36, zweiter Teil: Meldet ein Lauf ein Sonderformat, wird sofort geparkt —
     unabhaengig von den anderen zwei Laeufen und ohne dass ein 90-Minuten-Wert erzwungen
     oder gerechnet wird. Das ergaenzt die Erkennung in der Spielliste (stufeHolen, seit
     v19.8.7) und faengt auf, was dort durchrutscht, wie Leeds-Leipzig am 8.8.2026.
     Ein LEERES Feld ist kein Sonderformat, sondern eine fehlende Angabe: Der Auftragstext
     verlangt ausdruecklich, nicht zu raten. Die bekannte Grenze aus Punkt 36 bleibt damit
     bestehen — ein Modell, das das Format nicht kennt, meldet es auch nicht. */
  var fmt=String(r.format||'').toLowerCase().replace(/×/g,'x').replace(/[\s·]/g,'');
  if(fmt && !(/^2x45/.test(fmt) || fmt.indexOf('standard')>=0)){
    erg.sonderformat=String(r.format);
    return nein('sonderformat','Sonderformat '+String(r.format));
  }
  var status=String(r.status||'').toLowerCase();
  if(status!=='fertig') return nein('kein_ergebnis','kein Ergebnis');
  if(erg.heim===null) return nein('keine_ziffern','keine Ziffern');
  /* Feste Pruefung 1: In der zweiten Halbzeit koennen keine Tore verschwinden. Bis v19.8.11
     war das nur eine Warnung an Ondo (warnP) — jetzt wird der Lauf verworfen. */
  var hz=erg.halbzeit.match(/(\d+)\s*[:\-]\s*(\d+)/);
  if(hz && (Number(hz[1])>erg.heim || Number(hz[2])>erg.gast)){
    return nein('halbzeit_hoeher','Halbzeit hoeher als Endstand');
  }
  /* Feste Pruefung 2: Ein torloses 0:0 nur bei ausdruecklichem Status. Blosses Fehlen von
     Ziffern faellt schon oben als "keine Ziffern" heraus; hier geht es um die Verlegenheits-
     antwort, die wie ein gefundenes Ergebnis aussieht (neunte Fehlerart, 31.7.2026). */
  if(erg.heim===0 && erg.gast===0 && String(r.torlos||'').trim().toLowerCase()!=='bestaetigt'){
    return nein('null_unbestaetigt','0:0 ohne Bestaetigung');
  }
  /* Feste Pruefung 3: Bei Verlaengerung muessen 90-Minuten-Stand und Verlaengerungsstand
     getrennt genannt sein (zehnte Fehlerart, 11.8.2026 — ein Stand aus der Verlaengerung
     stand als 90-Minuten-Wert in den Messdaten). Der Verlaengerungsstand darf ausserdem je
     Mannschaft nicht unter dem 90-Minuten-Stand liegen. */
  var vGespielt=/^(ja|yes|oui)$/i.test(String(r.verlaengerungGespielt||'').trim());
  if(vGespielt || erg.verl){
    var vt=erg.verl.match(/(\d+)\s*[:\-]\s*(\d+)/);
    if(!vt) return nein('verl_ohne_stand','Verlaengerung ohne getrennten Stand');
    if(Number(vt[1])<erg.heim || Number(vt[2])<erg.gast){
      return nein('verl_kleiner','Verlaengerungsstand kleiner als 90 Minuten');
    }
  }
  /* Feste Pruefung 4 (Teil 3): Eine Quelle von der Negativliste zaehlt nicht als Beleg.
     Der Lauf bleibt vollstaendig sichtbar (refRoh, Vorschlagskarte, Text-Ausgabe) und wird
     benannt — er geht nur nicht in die Einigkeitspruefung ein (Entscheidung Ondo 3.9.2026). */
  erg.quelleSchwach=quelleUnzuverlaessig(erg.host);
  if(erg.quelleSchwach==='wettanbieter') return nein('quelle_wettanbieter','Quelle Wettanbieter '+erg.host);
  if(erg.quelleSchwach==='belegt_falsch') return nein('quelle_belegt_falsch','Quelle belegt unzuverlaessig '+erg.host);
  erg.ok=true;
  return erg;
}

/* EINIGKEITSREGEL (Ondo, 3.9.2026). Bekommt die gepruefen Laeufe EINES Spiels und entscheidet.
   Verglichen wird der 90-Minuten-Stand zusammen mit dem Verlaengerungsstand — beides zusammen
   bildet den Wert eines Laufs, wie im Auftrag verlangt ("im 90-Minuten-Stand und ggf.
   Verlaengerungsstand").
   fall = 'einstimmig'  -> uebernehmen, keine Markierung noetig
          'zweivondrei' -> uebernehmen, aber SICHTBARE Markierung (Pflichtbestandteil der
                           Regel, kein Extra — ohne Markierung wird nicht uebernommen)
          'uneinig'     -> parken, parkGrund 'unstable_ref'
          'zuwenig'     -> nichts uebernehmen, erneut fragen (Entscheidung Ondo 3.9.2026)
   quellenZahl zaehlt die VERSCHIEDENEN Quellen der gueltigen Laeufe: Nennen alle drei Laeufe
   dieselbe Quelle, ist das EIN Beleg, nicht drei unabhaengige. Es gibt aber ausdruecklich
   keine Pflicht zu drei verschiedenen Quellen — bei unterklassigen Wettbewerben kann es nur
   eine geben (Blueprint Grenze 6/7).
   🔴 REF_MIN_LAEUFE auf 1 gesenkt, 17.9.2026 (Backlog-Punkt 84, Ondos Auftrag "ESPN als
   primaere Schiedsrichter-Ergebnisquelle, KI-Schiedsrichter als Notnagel", Schritt 2: "...
   bestehender KI-Schiedsrichter, jetzt nur noch ein Lauf statt drei"). Die Drei-Laeufe-Schwelle
   aus Backlog-Punkt 68 war eine Absicherung GEGEN DREI UNABHAENGIGE MODELL-RATEVERSUCHE
   (Halluzinationsrisiko, elfte Fehlerart) - sie ergab nie Sinn fuer einen echten, strukturierten
   Datensatz wie ESPNs Box-Score-Daten, der nicht "raet". Die neue Resolver-Kaskade (espnLauf()
   oben, danach genau EIN KI-Lauf als Notnagel statt bisher bis zu drei) liefert je Spiel
   praktisch nie mehr als einen gueltigen Lauf gleichzeitig. Ein einzelner gueltiger Lauf zaehlt
   ab jetzt als 'einstimmig' - das ist keine Lockerung von refEinigkeit() selbst (die Mehrheits-
   Rechnung unten bleibt UNVERAENDERT, gut.length===1 ergibt schon rein rechnerisch
   zahl[best]===gut.length), nur eine gesenkte Eintrittsschwelle. Was sich dadurch AENDERT, ganz
   ohne Beschoenigung (Art. 14): Die Absicherung gegen einen einzelnen halluzinierenden KI-Lauf
   (genau der Celje/Sabah-Fall, STAND.md elfte Fehlerart) gilt fuer den KI-Notnagel NICHT MEHR -
   Ondos eigene, ausdrueckliche Kostenentscheidung, kein uebersehener Nebeneffekt. Einzige
   Aufrufstelle im ganzen Code: pruefAuswerten() unten, unveraendert.
   🔴 ZURUECKGENOMMEN, noch am selben Tag, 17.9.2026 (Auftrag Ondo "KI-Notnagel zurueck auf
   drei Laeufe"): REF_MIN_LAEUFE zurueck auf 3 — ABER NICHT als globale Schwelle, sonst haette
   ein einzelner ESPN-Treffer (immer genau EIN Lauf, siehe espnLauf()) danach selbst als
   'zuwenig' gegolten und waere nie mehr uebernommen worden - ein Bruch von Ondos eigener
   Auflage "an ESPN selbst ... aendert sich nichts". Deshalb jetzt ZUSAMMENGESETZT: Ein
   Strukturtreffer (erkennbar daran, dass ergebnisQuelleAus() fuer ihn NICHT 'ki' liefert -
   also 'espn', kuenftig auch 'uefa'/'openfootball') braucht weiterhin nur sich selbst, Schwelle
   1. Ausschliesslich reine KI-Laeufe (kein einziger Strukturtreffer unter den gepruefen
   Laeufen) verlangen wieder REF_MIN_LAEUFE=3 — der KI-Notnagel macht dafuer unten (kiZahl)
   wieder zwei Gemini-Laeufe plus einen Sonnet-Lauf, mit genau derselben 2-von-3-Regel wie vor
   v19.14.0 (die Mehrheits-Rechnung unten war nie geaendert, nur die Eintrittsschwelle). Betrifft
   damit tatsaechlich ausschliesslich den Fall, dass espnLauf() nichts liefert - an ESPN selbst,
   espnLauf(), den Slug-Tabellen und der 90-Minuten-Formel aendert sich nichts. */
var REF_MIN_LAEUFE = 3;
function refEinigkeit(gepruefte){
  var gut=(gepruefte||[]).filter(function(x){ return x && x.ok; });
  var quellen=[];
  gut.forEach(function(x){ if(x.host && quellen.indexOf(x.host)<0) quellen.push(x.host); });
  var basis={ gesamt:gut.length, quellen:quellen, quellenZahl:quellen.length };
  /* Ein Strukturtreffer braucht nur sich selbst (Schwelle 1) - er "raet" nicht. Nur wenn
     AUSSCHLIESSLICH KI-Laeufe vorliegen, gilt wieder die volle Drei-Laeufe-Schwelle. */
  var hatStruktur = gut.some(function(x){ return ergebnisQuelleAus(x.modell)!=='ki'; });
  var schwelle = hatStruktur ? 1 : REF_MIN_LAEUFE;
  if(gut.length<schwelle){ basis.fall='zuwenig'; basis.wert=null; basis.mehrheit=0; return basis; }
  var reihen=[], zahl={}, muster={};
  gut.forEach(function(x){
    var k=x.heim+':'+x.gast+'|'+(x.verl||'');
    if(!(k in zahl)){ reihen.push(k); muster[k]=x; }
    zahl[k]=(zahl[k]||0)+1;
  });
  var best=reihen[0];
  reihen.forEach(function(k){ if(zahl[k]>zahl[best]) best=k; });
  basis.mehrheit=zahl[best];
  basis.fall = (zahl[best]===gut.length) ? 'einstimmig'
             : (zahl[best]>=2 ? 'zweivondrei' : 'uneinig');
  basis.wert = (basis.fall==='uneinig') ? null : muster[best];
  return basis;
}

/* ================= ERGEBNISSE PRUEFEN (v19.4) =================

/* v19.8.13 (Backlog-Punkt 69, 4.9.2026): pruefListe und pruefBilanz sind ab hier Teil von

   Grund: Ein Neuladen der Seite startet das Skript neu und leerte bisher unwiderruflich
   jeden noch nicht uebernommenen oder ignorierten Schiedsrichter-Vorschlag — save() schrieb
   ausschliesslich state, diese beiden Variablen nie. Seit v19.8.12 haengt an jedem Lauf ein
   bezahlter Sonnet-Aufruf, ein solcher Verlust kostet jetzt echtes Geld je Wiederholung.
   pruefStark (oben, Zeile 1340) bleibt bewusst aussen vor: Sie beschreibt nur den Ablauf des
   gerade laufenden Prueflaufs (Anfragezaehler, gewaehltes Modell), keinen Vorschlag, der
   verloren gehen koennte — ihre Persistenz waere Ballast im gespeicherten Zustand, kein

function ergebnissePruefen(btn){
  if(!hatGemini() && !hatSonnet()){
    var f0=document.getElementById('pruefStatus'); if(f0) f0.textContent=t('noKey'); return;
  }
  /* v19.7.6: Geparkte Vorhersagen werden uebersprungen. Anlass: Die gesperrten Ergebnisse
     vom 29./30. und 31. Juli duerfen nie uebernommen werden und blieben deshalb dauerhaft
     offen — jeder Prueflauf fragte sie erneut ab und verbrauchte Runden dafuer. Parken
     traegt KEIN Ergebnis ein: Die Pruefbibliothek bleibt unberuehrt, nichts wird bewertet,
     nichts fliesst in die Kalibrierung, und der Schritt ist jederzeit umkehrbar. */
  var offeneP = (state.kiProtokoll||[]).filter(function(e){
    return e.aera==='v19' && e.status==='offen' && !e.geparkt;
  });
  /* 🔴 ECHTE LAUFSPERRE, 21.9.2026 (Backlog-Punkt 86, Abschnitt 7): Bis hierher haftete der
     Laufzustand nur am DOM-Knopf (btn.disabled). render() erzeugt aber einen NEUEN, freien
     Knopf - ein Reiterwechsel waehrend eines Laufs konnte deshalb einen zweiten, parallelen
     Lauf starten, der dieselben Spiele noch einmal bei denselben Modellen anfragt. Die Sperre
     liegt jetzt in state und ueberlebt render() und Neuladen. */
  if(pruefRunAktiv()){
    var fB=document.getElementById('pruefStatus');
    if(fB) fB.textContent=t('pruefLaeuft');
    return;
  }
  /* Doppelte Spiele nur einmal abfragen: beide Gehirne teilen sich denselben Endstand */
  var spiele={}, posten=[];
  offeneP.forEach(function(e){
    var k=e.match+'|'+e.datum;
    if(!spiele[k]){
      spiele[k]={ id:'S'+posten.length, art:'log', match:e.match, datum:e.datum,
        anpfiff:e.anpfiff||'', wettbewerb:e.wettbewerb||'', eintraege:[], zustand:'offen', gefragt:false };
      posten.push(spiele[k]);
    }
    spiele[k].eintraege.push(e.id);
  });
  state.bets.filter(function(b){return b.status==='offen';}).forEach(function(b){
    posten.push({ id:'B'+b.id, art:'bet', betId:b.id, match:b.match, datum:b.datum,
      tipp:b.tipp||'', zustand:'offen', gefragt:false });

  /* 🔴 STABILE SPIELIDENTITAET je Posten (Abschnitt 8) und der persistente Jobzustand
     (Abschnitt 5). Zwei Wirkungen, beide von Ondo ausdruecklich verlangt:
     1. Ein Spiel, dessen Vorschlag Ondo bewusst IGNORIERT hat, erscheint nicht beim naechsten
        automatischen Lauf sofort wieder identisch. Es bleibt ueber "erneut pruefen"
        (pruefErneut) jederzeit wieder aufnehmbar - nur eben nicht von selbst.

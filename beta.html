<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0B1220" />
<title>Ondo Control</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<style>
  :root{
    --bg:#0B1220; --card:#111C30; --edge:#1D2B45; --inner:#0D1729;
    --text:#E8EDF4; --dim:#8A98AF; --accent:#F5D90A;
    --win:#2FBF71; --loss:#E5484D; --open:#5B8DEF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;}
  .wrap{max-width:700px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px 110px;}
  h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;
    font-size:34px;margin:0;letter-spacing:1px;text-transform:uppercase;}
  h1 .a{color:var(--accent);}
  .disp{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;}
  .sub{color:var(--dim);font-size:12px;margin:2px 0 16px;}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:15px;margin-bottom:12px;}
  .stat-label{color:var(--dim);font-size:12px;margin-bottom:4px;}
  .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1;}
  .stat-sub{color:var(--dim);font-size:11px;margin-top:4px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .row>.card{flex:1;min-width:135px;margin-bottom:0;}
  label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px;}
  input,select{width:100%;background:var(--inner);border:1px solid var(--edge);
    border-radius:8px;color:var(--text);padding:11px 12px;font-size:15px;outline:none;
    font-family:inherit;}
  select{appearance:none;-webkit-appearance:none;}
  /* v19.8.16 (Backlog-Punkt 73): iOS/WebKit rendert den Inhalt von input[type=date] ueber ein
     eigenes internes Element, auf das text-align am input selbst nicht wirkt. Wirkungslos in
     Browsern ohne dieses Element, keine Aenderung an Wert oder Bedienung des Feldes. */
  input[type="date"]::-webkit-date-and-time-value{text-align:center;}
  .btn{background:var(--accent);color:#0B1220;border:none;border-radius:9px;padding:12px 16px;
    font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;
    cursor:pointer;text-transform:uppercase;width:100%;}
  .btn:disabled{background:#2A3550;color:var(--dim);}
  .btn-ghost{background:transparent;border:1px solid var(--edge);color:var(--dim);}
  .btn-sm{background:transparent;border:1px solid var(--dim);color:var(--dim);border-radius:6px;
    padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;width:auto;}
  .btn-win{border-color:var(--win);color:var(--win);}
  .btn-loss{border-color:var(--loss);color:var(--loss);}
  .btn-open{border-color:var(--open);color:var(--open);}
  .badge{font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.2px;
    padding:3px 10px;border-radius:4px;font-weight:600;}
  .b-open{background:#16233C;color:var(--open);}
  .b-win{background:#0F2A1D;color:var(--win);}
  .b-loss{background:#2C1417;color:var(--loss);}
  .grid{display:grid;gap:12px;}
  .muted{color:var(--dim);font-size:12px;line-height:1.5;}
  .empty{padding:26px;text-align:center;color:var(--dim);font-size:14px;}
  .flex{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .save-note{color:var(--accent);font-size:12px;margin-left:8px;}
  .quote{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--accent);}
  .tipbox{background:var(--inner);border-radius:8px;padding:10px 12px;margin-top:10px;}
  pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.65;margin:0;}
  .subtabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--edge);
    border-radius:10px;padding:5px;margin-bottom:16px;}
  .subtab{flex:1;padding:9px 2px;background:transparent;color:var(--dim);border:none;
    border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
    letter-spacing:.8px;cursor:pointer;text-transform:uppercase;white-space:nowrap;}
  .subtab.on{background:var(--accent);color:#0B1220;}
  /* v19.20.1 (Backlog-Punkt 89, Fund/Auftrag Ondo 26.9.2026): Nur die fuenf
     KI-Log-Unterreiter duerfen auf schmalen Bildschirmen horizontal scrollen. Die
     Haupt-Wetten-Zeile mit vier Reitern behaelt unveraendert flex:1. */
  .subtabs.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .subtabs.scroll .subtab{flex:none;padding:9px 14px;}
  .module{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .module .mi{font-size:26px;margin-right:12px;}
  .module .mt{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;}
  .module .md{color:var(--dim);font-size:12px;}
  .mstatus{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1.2px;font-weight:700;}
  /* Vorhersage-Elemente v19 */
  .mkt{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 0;border-top:1px solid var(--edge);font-size:13px;}
  .mkt .p{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--accent);}
  .score{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1;}
  .ktab{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  .ktab th,.ktab td{padding:5px 4px;text-align:right;border-top:1px solid var(--edge);}
  .ktab th:first-child,.ktab td:first-child{text-align:left;}
  .ktab th{color:var(--dim);font-weight:500;font-size:11px;border-top:none;}
  /* Bottom-Navigation */
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,23,41,.97);
    border-top:1px solid var(--edge);display:flex;z-index:50;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);}
  .nav button{flex:1;background:none;border:none;color:var(--dim);cursor:pointer;
    font-family:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .nav button .ic{font-size:22px;line-height:1;}
  .nav button.on{color:var(--accent);}
</style>
</head>
<body>
<div id="updateBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--accent);color:#0B1220;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  align-items:center;justify-content:space-between;gap:10px;
  font-size:14px;font-weight:600;">
  <span>🔄 Update verfügbar / Mise à jour dispo / Update available</span>
  <button style="background:#0B1220;color:var(--accent);border:none;border-radius:8px;padding:8px 14px;
    font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;
    text-transform:uppercase;">Aktualisieren</button>
</div>
<div class="wrap">
  <div class="flex" style="align-items:baseline;">
    <h1>Ondo<span class="a"> Control</span></h1>
    <div id="topSaldo" class="disp" style="font-size:21px;">+0,00 €</div>
  </div>
  <div class="sub"><span id="heute"></span> · <span id="verLbl"></span> BETA<span id="saveNote" class="save-note"></span></div>
  <div id="view"></div>
</div>

<div class="nav" id="nav">
  <button data-tab="home"><span class="ic">🏠</span><span id="nvHome">Start</span></button>
  <button data-tab="wetten"><span class="ic">🎯</span><span id="nvBets">Wetten</span></button>
  <button data-tab="finanzen"><span class="ic">💰</span><span id="nvFin">Finanzen</span></button>
  <button data-tab="mehr"><span class="ic">⚙️</span><span id="nvMore">Mehr</span></button>
</div>

/* ================= VERSION & UPDATE-CHECK ================= */
var APP_VERSION = 18;
/* v19.8.0 (Backlog-Punkt F, Beschluss Ondo 8.8.): Die Versionsnummer steht ab jetzt an
   GENAU EINER Stelle. Sie wird in den Kopf geschrieben, in den Vision-Text eingesetzt und
   in jeden neuen Log-Eintrag mitgeschrieben. Bei jeder Lieferung hier hochzaehlen — sonst
   tragen neue Eintraege eine falsche Nummer. APP_VERSION bleibt davon unberuehrt; sie ist
   der Update-Zaehler gegen version.json und steht bewusst auf 18. */
var CODE_VERSION = 'v19.20.1';
(function(){ var e=document.getElementById('verLbl'); if(e) e.textContent=CODE_VERSION; })();
function checkUpdate(){
  fetch('version.json?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && Number(j.v) > APP_VERSION){
        var bar=document.getElementById('updateBar');
        if(bar){
          bar.style.display='flex';
          bar.querySelector('button').onclick=function(){
            location.href='OndoControl.html?u='+Number(j.v)+'x'+Date.now();
          };
        }
      }
    })
    .catch(function(e){ /* offline oder Datei fehlt: still bleiben */ });
}

/* v19.8.30 (12.9.2026, Auftrag Ondo: "Ich will eine dauerhafte Loesung, keine Dateien
   Loeschen!!"): Umstieg von localStorage auf IndexedDB — einen zweiten, in jedem modernen
   Browser eingebauten Speicherbereich, der um ein Vielfaches groesser ist als localStorage.
   Anlass, mit Beleg: Ondos Browser lehnte das Speichern bei 2.726 KB ab (v19.8.29-Fund).
   localStorage hat auf Safari/iOS eine feste, kleine Grenze in dieser Groessenordnung — das
   ist keine Ondo-spezifische Stoerung, sondern die bekannte, enge Grenze DIESES
   Speicherbereichs. IndexedDB bekommt vom Browser einen Anteil des freien Geraetespeichers
   zugewiesen (Ondo bestaetigt: genug frei) und ist fuer genau diesen Fall gebaut.
   WARUM DAS EINE ECHTE UMSTELLUNG IST, NICHT NUR EIN GROESSERER WERT: IndexedDB arbeitet
   ausschliesslich asynchron (Zugriffe laufen ueber ein Promise, das Ergebnis kommt etwas
   spaeter zurueck) — anders als localStorage, das synchron antwortet. load() liest deshalb
   jetzt mit await, und der Programmstart am Dateiende wartet auf load(), bevor zum ersten
   Mal gezeichnet wird. save() bleibt fuer alle rufenden Stellen unveraendert aufrufbar
   (save(); render();) — render() haengt nie vom Ergebnis des Speicherns ab, nur note()/
   alert() bei einem Fehlschlag kommen jetzt etwas spaeter.
   ABSICHERUNG: Kein Browser, den Ondo benutzt, duerfte ohne IndexedDB dastehen (in Safari
   seit iOS 8 eingebaut) — trotzdem faellt jede Funktion unten auf das alte, synchrone
   localStorage automatisch zurueck, wenn IndexedDB fehlt oder scheitert (Art. 6: Sicherheit
   vor Geschwindigkeit) — dieselbe Schutzwirkung wie bisher, nur ohne den grossen Vorteil. */
var DB_NAME = 'ondo-control-db', DB_STORE = 'kv';
var idbGeoeffnet = null;
function idbOeffnen(){
  if(idbGeoeffnet) return idbGeoeffnet;
  idbGeoeffnet = new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('kein indexedDB')); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error||new Error('indexedDB.open fehlgeschlagen')); };
  });
  return idbGeoeffnet;
}
function idbLesen(schluessel){
  return idbOeffnen().then(function(db){

      req.onerror = function(){ reject(req.error||new Error('idb-Lesen fehlgeschlagen')); };
    });
  });
}
function idbSchreiben(schluessel, wert){
  return idbOeffnen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(wert, schluessel);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error||new Error('idb-Schreiben fehlgeschlagen')); };
      tx.onabort = function(){ reject(tx.error||new Error('idb-Schreiben abgebrochen')); };
    });
  });
}
/* Speicher-Lesen mit Rueckfall: Erst IndexedDB versuchen, bei jedem Fehler (fehlt, blockiert,
   noch nie benutzt) den Wert aus dem alten localStorage nehmen — das deckt sowohl "IndexedDB
   nicht verfuegbar" als auch "erster Start nach der Umstellung, IndexedDB ist noch leer,
   aber localStorage traegt den alten Stand" in einem Schritt ab, ohne zwei getrennte Pfade
   im aufrufenden Code load() pflegen zu muessen. */
function speicherLesen(schluessel){
  return idbLesen(schluessel).then(function(wert){
    if(wert!==undefined && wert!==null) return wert;
    try{ var roh=localStorage.getItem(schluessel); return roh? JSON.parse(roh): null; }catch(e){ return null; }
  }).catch(function(){
    try{ var roh=localStorage.getItem(schluessel); return roh? JSON.parse(roh): null; }catch(e){ return null; }
  });
}
/* Speicher-Schreiben: schreibt bevorzugt in IndexedDB. Schlaegt das fehl (IndexedDB fehlt),
   wird versucht, wenigstens in localStorage zu schreiben — derselbe Rueckfall wie beim Lesen.
   Schlaegt AUCH das fehl (z. B. weil localStorage inzwischen voll ist), wird der Fehler an
   den Aufrufer weitergereicht, damit save() seinen Alarm auslösen kann wie bisher. */
function speicherSchreiben(schluessel, wert){
  return idbSchreiben(schluessel, wert).catch(function(idbFehler){
    localStorage.setItem(schluessel, JSON.stringify(wert));
  });
}
/* 🔴 STRIKTER SCHREIBWEG FUER KRITISCHE CHECKPOINTS (v19.19.2, Auftrag Ondo 24.9.2026).
   speicherSchreiben() oben bleibt unveraendert der Best-Effort-Weg fuer save(): IndexedDB,
   bei einem Fehler localStorage. Fuer einen Checkpoint, nach dem ein externer oder bezahlter
   Schritt beginnt, war genau dieser Rueckfall falsch: speicherLesen() liest beim Neustart
   IndexedDB ZUERST. Scheiterte IndexedDB mit Stand B, gelang aber localStorage, galt der
   Checkpoint als geschrieben, der externe Schritt lief los - und ein Neustart las den alten
   IndexedDB-Stand A. Stand B war fuer die App verloren.
   Deshalb gilt hier: erfolgreich NUR, wenn die IndexedDB-Transaktion abgeschlossen ist. Kein
   localStorage-Rueckfall, auch nicht, wenn IndexedDB ganz fehlt oder sich nicht oeffnen laesst -
   dann scheitert der Checkpoint sichtbar, und der Lauf pausiert (Absicht). localStorage wird
   auf diesem Weg gar nicht erst beschrieben. speicherLesen() bleibt unveraendert. */
function speicherSchreibenKritisch(schluessel, wert){
  return idbSchreiben(schluessel, wert);
}

  /* 🔴 seedV<10 — Nachbesserung zu Backlog-Punkt 86 (v19.19.1, Auftrag Ondo 24.9.2026).
     seedV<9 oben bleibt WORTGLEICH stehen: Ondos Geraet hat es bereits ausgefuehrt, eine
     Aenderung an dieser Nummer wuerde dort nie mehr laufen (dieselbe Begruendung wie bei

     bei pruefListeMigrierenV10(). Ein zweiter Start (seedV>=10) aendert nichts mehr. */
  if(state.seedV < 10){
    state.pruefMigrationV10 = pruefListeMigrierenV10();

  /* v19.8.30: Ohne diese Zeile schriebe load() NUR dann in den Speicher, wenn eine der acht

  await speicherSchreiben(KEY, state).catch(function(){});

/* v19.8.28 (Fund der vollstaendigen Pruefung vom 11.9.2026, Auftrag Ondo): Ein gescheitertes

   bis ein Speichern wieder gelingt: speicherAlarm setzt einen roten Balken ueber jede Ansicht
   (render) und meldet sich EINMAL mit einem Hinweisfenster. Nur einmal, weil sonst jeder
   weitere Klick ein neues Fenster oeffnen wuerde.
   speicherAlarm ist bewusst KEIN Teil von state: Er beschreibt den Zustand dieses Browsers in
   dieser Sitzung, nicht die Daten — und ein Zustand, der sich nicht speichern laesst, kann
   sich schlecht selbst mitspeichern. */
var speicherAlarm=false;
/* v19.8.30: save() bleibt fuer jede rufende Stelle unveraendert aufrufbar (save(); render();)
   — render() liest den bereits im Speicher stehenden state, nicht das Ergebnis von save(),
   und wartet deshalb nicht darauf. Nur note()/alert() bei Erfolg oder Fehlschlag kommen jetzt
   etwas spaeter (nach dem asynchronen Schreiben), nicht mehr in derselben Millisekunde. */
function save(){
  speicherSchreiben(KEY, state).then(function(){
    if(speicherAlarm){ speicherAlarm=false; }
    note(t('saved'));
  }).catch(function(e){
    note(t('saveFail'));
    if(!speicherAlarm){ speicherAlarm=true; alert(t('saveFailAlert')); }
  });
}
/* ================= CHECKPOINT-SPEICHERBARRIERE (Backlog-Punkt 86, Auftrag Ondo 21.9.2026,
   Abschnitt 6/6b) =================
   save() gibt sein Promise NICHT zurueck (siehe oben) - fuer die normalen save(); render();
   Aufrufe ist das genau richtig und bleibt unveraendert. Fuer einen Checkpoint reicht es
   nicht: Dort muss feststehen, dass geschrieben WURDE, bevor der naechste externe Schritt
   beginnt. Sonst kann iOS die Seite genau zwischen Antwort und Speichern anhalten.
   ORDNUNG DER SCHREIBVORGAENGE (Abschnitt 6b): Alle Checkpoints laufen durch EINE Kette. Ein
   aelterer Schreibvorgang kann deshalb nie nach einem neueren fertig werden und ihn logisch
   zuruecksetzen - der letzte Aufruf ist immer auch der letzte Schreibvorgang. Geschrieben wird
   jeweils der AKTUELLE state (kein Schnappschuss), der letzte Schreibvorgang enthaelt also
   garantiert den neuesten Zustand.
   Ein gescheiterter Checkpoint loest denselben sichtbaren Alarm aus wie ein gescheitertes
   save() - ein stiller Datenverlust waere schlimmer als ein abgebrochener Lauf.
   🔴 HARTE BARRIERE, 24.9.2026 (v19.19.1, Nachbesserung zu Backlog-Punkt 86, Auftrag Ondo
   Abschnitt 7/8): Bis v19.19.0 fing diese Funktion den Schreibfehler mit .catch() ab und gab
   genau diese abgefangene Kette zurueck. Der AUFRUFER sah einen fehlgeschlagenen Checkpoint
   deshalb als ERFOLG - checkpointSave().then(function(){ return vorhersageGehirn(...); })
   haette nach einem gescheiterten Schreiben trotzdem das Modell bezahlt. Jetzt gilt beides
   zugleich:
   A) Das zurueckgegebene Promise REJECTED bei einem Schreibfehler - der kritische Aufrufer
      erfaehrt es und startet den naechsten externen Schritt nicht.
   B) Die globale speicherKette wird davon NICHT vergiftet: Sie wird auf eine Fassung gesetzt,
      die den Fehler bereits abgefangen hat (.catch(noop)). Der naechste Checkpoint haengt
      sich also an eine erfuellte Kette an und schreibt ganz normal - ein einzelner Fehlschlag
      blockiert keinen spaeteren Schreibvorgang.
   Schlaegt ein Schreiben fehl, bleibt der zuletzt ERFOLGREICH geschriebene Stand im Speicher
   unberuehrt: IndexedDB verwirft eine abgebrochene Transaktion vollstaendig, localStorage
   aendert bei einem Fehler in setItem() nichts. Es wird nichts geloescht, um Platz zu machen.
   Wer KEINE Barriere braucht (Abschluss, Pause, Programmstart, Seite verlassen), ruft
   checkpointOhneBarriere() - dasselbe Schreiben in derselben Kette, nur ohne Ablehnung nach
   aussen, damit kein unbehandeltes Promise entsteht. Das normale save() bleibt unveraendert.
   🔴 v19.19.2: "Schreibfehler" heisst seither auch: IndexedDB scheitert, localStorage haette
   geklappt. Beide Checkpoint-Funktionen schreiben ueber speicherSchreibenKritisch() (nur
   IndexedDB); ein localStorage-Rueckfall zaehlt fuer sie nicht als Erfolg. */
var speicherKette = Promise.resolve();
function checkpointSave(){
  var ergebnis = speicherKette.then(function(){
    /* v19.19.2: der strikte Weg (nur IndexedDB) - siehe speicherSchreibenKritisch(). */
    return speicherSchreibenKritisch(KEY, state);
  }).then(function(){
    if(speicherAlarm){ speicherAlarm=false; }
  }, function(e){
    if(!speicherAlarm){ speicherAlarm=true; try{ alert(t('saveFailAlert')); }catch(x){} }
    throw (e || new Error('Checkpoint fehlgeschlagen'));
  });
  speicherKette = ergebnis.catch(function(){ /* Kette bleibt benutzbar (B) */ });
  return ergebnis;
}
function checkpointOhneBarriere(){
  return checkpointSave().catch(function(){ return false; });
}

/* ================= PERSISTENTER PRUEFZUSTAND (Backlog-Punkt 86, Abschnitt 5/7) =================
   Bis hierher galt: ergebnissePruefen() setzte state.pruefListe=[] und state.pruefBilanz=null,
   jeder neue Prueflauf vernichtete also alle bereits gefundenen Vorschlaege. Ausserdem hing die
   Laufsperre nur am DOM-Knopf - ein render() erzeugte einen neuen, freien Knopf, waehrend der
   alte asynchrone Lauf noch arbeitete.
   Neu sind zwei persistente Strukturen:
   - state.pruefJobs: je realem Spiel (fixtureId) EIN Auftrag mit eigenem Zustand.
   - state.pruefRun:  hoechstens EIN aktiver Lauf, mit runId und Fortschritt.
   Beide liegen in state und ueberleben damit Reiterwechsel, render(), Neuladen und App-Wechsel
   - genau das, was Ondo am 20.9.2026 gemeldet hat. */
var PRUEF_ZUSTAENDE = ['offen','laeuft','vorschlag','unzureichend','geparkt','uebernommen','ignoriert'];
function jobsHolen(){
  if(!state.pruefJobs || typeof state.pruefJobs!=='object') state.pruefJobs={};
  return state.pruefJobs;
}
function jobHolen(fixtureId){
  var j=jobsHolen();
  return fixtureId ? j[fixtureId] : null;
}
function jobSetzen(fixtureId, aenderung){
  if(!fixtureId) return null;
  var j=jobsHolen();
  if(!j[fixtureId]) j[fixtureId]={ fixtureId:fixtureId, zustand:'offen', versuche:0, providerIds:{} };
  var job=j[fixtureId];
  for(var k in aenderung){ if(Object.prototype.hasOwnProperty.call(aenderung,k)) job[k]=aenderung[k]; }
  job.aktualisiert=Date.now();
  return job;
}
/* Eine Provider-ID DAUERHAFT an die fixtureId binden. Abschnitt 8a, Provider-ID-Bindung:
   Stufe 1/2 duerfen das sofort (die Identitaet ist ueber beide Mannschaften bewiesen),
   Stufe 3 ausdruecklich NICHT - dort steht die ID zunaechst nur am Vorschlag und wird erst
   gebunden, wenn Ondo genau diesen Vorschlag uebernimmt. "Ignorieren" bindet nie. */
function providerIdBinden(fixtureId, anbieter, id){
  if(!fixtureId || !anbieter || !id) return;
  var job=jobSetzen(fixtureId, {});
  if(!job.providerIds) job.providerIds={};
  if(!job.providerIds[anbieter]) job.providerIds[anbieter]=String(id);
}
/* Ein laufender Prueflauf, der nach einem Neuladen wieder auftaucht, kann nicht mehr laufen -
   in diesem Browser laeuft kein JavaScript mehr aus der alten Seite. Er wird beim Start
   deshalb auf 'pausiert' gesetzt: fortsetzbar, aber keine Zombie-Sperre, die den Knopf fuer
   immer blockiert. Bewusst OHNE Zeitschaetzung ("aelter als X Minuten") - eine geratene Grenze
   waere entweder zu kurz (bricht laufende Arbeit ab) oder zu lang (blockiert unnoetig). */
function pruefRunEntsperren(){
  if(state.pruefRun && state.pruefRun.status==='laufend'){
    state.pruefRun.status='pausiert';
  }
}
function pruefRunAktiv(){
  return !!(state.pruefRun && state.pruefRun.status==='laufend');
}

/* ================= VORSCHLAGS-IDENTITAET UND DUBLETTENSPERRE (v19.19.1, Nachbesserung zu
   Backlog-Punkt 86, Auftrag Ondo 24.9.2026) =================
   Realer Befund an Ondos iPhone (v19.19.0): 10 von 10 Spielen gefunden, 0 KI-Aufrufe - aber
   15 sichtbare Vorschlaege. Fuenf alte Vorschlaege aus der Zeit vor v19.19.0 trugen weder
   datum noch fixtureId (ein damaliger Vorschlag hatte gefDatum/gefWb/quelle/eintraege, aber
   kein datum). seedV<9 baute auf datumIso(v.datum), bekam '' und uebersprang sie. Ohne
   fixtureId und ohne Job kannte der neue Prueflauf sie nicht, suchte alle zehn Spiele erneut
   und schob zehn neue Vorschlaege daneben (state.pruefListe.push ohne jede Pruefung).
   Die Regeln hier:
   - Identitaet eines Vorschlags = fixtureId + art. Ohne gueltige fixtureId gibt es keine
     Identitaet, und dann wird auch nichts zusammengefuehrt (lieber sichtbar doppelt als falsch
     vereinigt).
   - "Identisch" heisst zusaetzlich: gleicher 90-Minuten-Endstand, und Halbzeit bzw.
     Verlaengerung gleich, SOWEIT beide Seiten sie angeben.
   - Identische Dubletten werden zu EINEM Vorschlag. Widersprechen sich zwei Vorschlaege
     desselben Spiels, bleiben BEIDE stehen und werden in pruefBlock() sichtbar als Widerspruch
     markiert - nichts wird still gewaehlt, ueberschrieben oder automatisch uebernommen. */
function fxIdGueltig(f){
  return typeof f==='string' && /^fx\d{8}_[a-z0-9_]+$/.test(f);
}
/* Dieselbe Formel wie im Prueflauf (ergebnissePruefen, "STABILE SPIELIDENTITAET je Posten"):
   Datum des Eintrags in Europe/Berlin (so wird es seit jeher protokolliert) + Spielname. */
function fxIdAusMatchDatum(match, datum){
  var iso=datumIso(datum||'');
  if(!iso) return '';
  var teams=teamsAus(match||'');
  return fxId(iso, teams.heim, teams.gast);
}
/* Die fixtureId eines vorhandenen Vorschlags bestimmen, in der von Ondo vorgegebenen
   Reihenfolge: 1. vorhandene gueltige fixtureId · 2. Log-Vorschlag: aus den referenzierten
   kiProtokoll-Eintraegen (v.eintraege) · 3. Wettschein: aus dem EINDEUTIG ueber betId
   referenzierten state.bets-Eintrag · 4. NIE aus gefDatum - das ist das Datum, das eine
   Ergebnisquelle gemeldet hat, nicht das kanonische Spieldatum.
   Widersprechen sich die referenzierten Eintraege (verschiedene Spiele oder Tage), wird NICHT
   geraten: Rueckgabe ohne fid, mit Konfliktgrund. */
function vorschlagFixtureIdRekonstruieren(v){
  if(!v) return { fid:'', konflikt:'kein_vorschlag' };
  if(fxIdGueltig(v.fixtureId)) return { fid:v.fixtureId, quelle:'vorhanden' };
  if((v.art||'log')==='bet'){
    if(v.betId===undefined || v.betId===null) return { fid:'', konflikt:'bet_ohne_betId' };
    var bt=(state.bets||[]).filter(function(b){ return b && b.id===v.betId; });
    if(bt.length!==1) return { fid:'', konflikt:'bet_nicht_eindeutig' };
    var fb=fxIdAusMatchDatum(bt[0].match, bt[0].datum);
    return fb ? { fid:fb, quelle:'bet', datum:bt[0].datum } : { fid:'', konflikt:'bet_ohne_datum' };
  }
  var ids=Array.isArray(v.eintraege) ? v.eintraege : [];
  var gefunden=(state.kiProtokoll||[]).filter(function(e){ return e && ids.indexOf(e.id)>=0; });
  if(!gefunden.length) return { fid:'', konflikt:'eintraege_fehlen' };
  var fids={}, datum='';
  gefunden.forEach(function(e){
    var f=fxIdAusMatchDatum(e.match, e.datum);
    fids[f||'?']=true;
    if(!datum) datum=e.datum;
  });
  var k=Object.keys(fids);
  if(k.length!==1 || k[0]==='?') return { fid:'', konflikt:'eintraege_widerspruechlich' };
  return { fid:k[0], quelle:'eintraege', datum:datum };
}
function vorschlagLeer(x){ return x===undefined || x===null || x===''; }
/* Wer ist "derselbe Vorschlag"? fixtureId + art - und bei einem Wettschein zusaetzlich die
   betId: Zwei verschiedene Wetten auf dasselbe Spiel brauchen je eine eigene Entscheidung
   (gewonnen/verloren) und duerfen nie zu einem Vorschlag verschmolzen werden. */
function vorschlagSchluessel(v){
  var art=(v&&v.art)||'log';
  return String(v&&v.fixtureId||'')+'|'+art+(art==='bet'?('|'+String(v.betId)):'');
}
function vorschlagKernGleich(a, b){
  if(!a || !b || !fxIdGueltig(a.fixtureId) || a.fixtureId!==b.fixtureId) return false;
  if(vorschlagSchluessel(a)!==vorschlagSchluessel(b)) return false;
  if(Number(a.heim)!==Number(b.heim) || Number(a.gast)!==Number(b.gast)) return false;
  if(!vorschlagLeer(a.halbzeit) && !vorschlagLeer(b.halbzeit) && String(a.halbzeit)!==String(b.halbzeit)) return false;
  if(!vorschlagLeer(a.verl) && !vorschlagLeer(b.verl) && String(a.verl)!==String(b.verl)) return false;
  return true;
}
/* Nur FEHLENDE, nicht widersprechende Angaben werden ergaenzt - nie ueberschrieben. Bewusst
   NICHT dabei: modell, einigkeit, laeufeGut, quellenZahl, rohAntwort, urteile - diese Felder
   bestimmen, was pruefAnwenden() an den Eintrag schreibt, und bleiben beim behaltenen
   Vorschlag genau so, wie sie entstanden sind. Eine Provider-ID wird hier nirgends gebunden. */
var VORSCHLAG_ERGAENZBAR=['datum','halbzeit','verl','gefDatum','gefWb','quelle','zuordnung','stufe'];
function vorschlagErgaenzen(ziel, von){
  VORSCHLAG_ERGAENZBAR.forEach(function(f){
    if(vorschlagLeer(ziel[f]) && !vorschlagLeer(von[f])) ziel[f]=von[f];
  });
  /* Die referenzierten kiProtokoll-Eintraege werden VEREINIGT, nicht ersetzt. Grund: Zwei
     Schreibweisen desselben Spiels ("AFC Sunderland - FC Arsenal" / "Sunderland - Arsenal")
     sind zwei Posten mit derselben fixtureId. Fiele der zweite ohne seine Eintraege weg, bekaeme
     dessen Gehirn-Eintrag beim Uebernehmen nie ein Ergebnis - und sein Job stuende trotzdem auf
     'vorschlag'. urteile ist nur die Anzeige der Markturteile und wird fuer die dazugekommenen
     Eintraege mit derselben, unveraenderten marktUrteil() nachgerechnet. */
  if((ziel.art||'log')==='log' && Array.isArray(von.eintraege)){
    if(!Array.isArray(ziel.eintraege)) ziel.eintraege=[];
    var dazu=von.eintraege.filter(function(id){ return ziel.eintraege.indexOf(id)<0; });
    if(dazu.length){
      ziel.eintraege=ziel.eintraege.concat(dazu);
      if(!Array.isArray(ziel.urteile)) ziel.urteile=[];
      (state.kiProtokoll||[]).forEach(function(e){
        if(dazu.indexOf(e.id)<0) return;
        (e.maerkte||[]).forEach(function(m){
          var ok=marktUrteil(m.code,ziel.heim,ziel.gast);
          if(ok===null) return;
          ziel.urteile.push({ gehirn:e.herkunft, label:m.label, ok:ok });
        });
      });
    }
  }
  if(!ziel.zusammengefuehrt) ziel.zusammengefuehrt=[];
  ziel.zusammengefuehrt.push({ id:von.id||null, modell:von.modell||null, quelle:von.quelle||'',
                               herkunft:von.fixtureIdHerkunft||'prueflauf' });
}
/* Widerspruch zu einem anderen AKTIVEN Vorschlag desselben Spiels? Wird bei jeder Anzeige neu
   bestimmt statt gespeichert - ein gespeichertes Kennzeichen bliebe stehen, nachdem Ondo einen
   der beiden uebernommen oder ignoriert hat. */
function vorschlagImKonflikt(v){
  if(!v || !fxIdGueltig(v.fixtureId)) return false;
  return (state.pruefListe||[]).some(function(w){
    return w!==v && w.fixtureId===v.fixtureId && vorschlagSchluessel(w)===vorschlagSchluessel(v) && !vorschlagKernGleich(v,w);
  });
}
/* Vorschlags-IDs muessen innerhalb der aktiven Liste eindeutig sein. EIGENER FUND
   (24.9.2026, am echten Code nachgestellt): Seit v19.19.0 ueberleben Vorschlaege einen neuen
   Prueflauf, ihre IDs ('S'+Position) werden aber in JEDEM Lauf neu ab S0 vergeben. Kommt eine
   neue Vorhersage vorne in kiProtokoll hinzu, verschiebt sich die Nummerierung - gemessen:
   "1. FC Koeln - SV Werder Bremen" und "Tottenham Hotspur - FC Everton" trugen beide 'S7'.
   Ein Klick auf "Uebernehmen" bei Tottenham uebernahm Koelns Ergebnis und entfernte Tottenhams
   Vorschlag spurlos, dessen Job blieb auf 'vorschlag' - das Spiel waere nie wieder gesucht
   worden. pruefAnwenden()/pruefIgnorieren() selbst bleiben unveraendert; es genuegt, dass
   jede ID nur einmal vorkommt. */
function vorschlagIdEindeutig(basis){
  var liste=state.pruefListe||[];
  var id=String(basis||'V'), n=1;
  while(liste.some(function(v){ return v.id===id; })){ n++; id=String(basis||'V')+'_'+n; }
  return id;
}
/* DAUERHAFTE DUBLETTENSPERRE beim Erzeugen (Auftrag Abschnitt 4) - ersetzt das blanke
   state.pruefListe.push(gemeinsam). Rueckgabe: welcher Vorschlag jetzt fuer dieses Spiel steht.
   Fall A (gleiche fixtureId + gleiches Kernergebnis): KEIN zweiter Vorschlag, hoechstens
   fehlende Angaben ergaenzt. Fall B (gleiche fixtureId + Widerspruch): beide bleiben, keiner
   wird ueberschrieben, die Anzeige markiert den Widerspruch. */
function vorschlagEinfuegen(neu){
  if(!Array.isArray(state.pruefListe)) state.pruefListe=[];
  var liste=state.pruefListe;
  neu.id=vorschlagIdEindeutig(neu.id);
  if(!fxIdGueltig(neu.fixtureId)){ liste.push(neu); return { fall:'neu', vorschlag:neu }; }
  var gleiches=null, anderer=false;
  liste.forEach(function(v){
    if(v.fixtureId!==neu.fixtureId || vorschlagSchluessel(v)!==vorschlagSchluessel(neu)) return;
    if(!gleiches && vorschlagKernGleich(v, neu)) gleiches=v; else anderer=true;
  });
  if(gleiches){ vorschlagErgaenzen(gleiches, neu); return { fall:'dublette', vorschlag:gleiches }; }
  liste.push(neu);
  return { fall: anderer ? 'konflikt' : 'neu', vorschlag:neu };
}
/* 🔴 MIGRATION seedV<10 als eigene Funktion, damit ihre Idempotenz unmittelbar pruefbar ist
   (ein zweiter Aufruf auf demselben Stand aendert nichts). Aufgerufen genau einmal aus load().
   ADDITIV: Es wird kein kiProtokoll-Eintrag, kein Messwert, kein Endstand, keine refRoh-/
   espnRoh-Evidence und keine Wette angefasst. Entfernt werden ausschliesslich Vorschlaege, die
   ein IDENTISCHES Gegenstueck behalten (bzw. deren identisches Ergebnis Ondo bereits
   uebernommen hat). */
function pruefListeMigrierenV10(){
  var bericht={ rekonstruiert:0, ohneIdentitaet:0, zusammengefuehrt:0, bereitsUebernommen:0,
                konflikte:0, idsUmbenannt:0, jobsNeu:0, jobsAufVorschlag:0 };
  if(!state.pruefJobs || typeof state.pruefJobs!=='object') state.pruefJobs={};
  var liste=Array.isArray(state.pruefListe) ? state.pruefListe : [];
  /* 1. fixtureId bestimmen */
  liste.forEach(function(v){
    if(fxIdGueltig(v.fixtureId)) return;
    var r=vorschlagFixtureIdRekonstruieren(v);
    if(r.fid){
      v.fixtureId=r.fid; v.fixtureIdHerkunft='migration_seedV10_'+r.quelle;
      if(vorschlagLeer(v.datum) && r.datum) v.datum=r.datum;
      delete v.migrationKonflikt;
      bericht.rekonstruiert++;
    } else {
      /* Nicht geraten, nicht geloescht: der Vorschlag bleibt sichtbar wie bisher, mit Grund. */
      v.migrationKonflikt=r.konflikt;
      bericht.ohneIdentitaet++;
    }
  });
  /* 2. Identische Dubletten zusammenfuehren. Behalten wird der reichere Vorschlag (mit
     Zuordnungsdiagnose, sonst der im Prueflauf entstandene, sonst der neuere). */
  var gruppen={}, reihe=[];
  liste.forEach(function(v){
    if(!fxIdGueltig(v.fixtureId)) return;
    var k=vorschlagSchluessel(v);
    if(!gruppen[k]){ gruppen[k]=[]; reihe.push(k); }
    gruppen[k].push(v);
  });
  function wert(v){ return (v.zuordnung?4:0) + (v.fixtureIdHerkunft?0:2) + (vorschlagLeer(v.halbzeit)?0:1); }
  var weg=[];
  reihe.forEach(function(k){
    var g=gruppen[k];
    if(g.length<2) return;
    var haufen=[];
    g.forEach(function(v){
      var h=null;
      haufen.forEach(function(x){ if(!h && vorschlagKernGleich(x[0], v)) h=x; });
      if(h) h.push(v); else haufen.push([v]);
    });
    haufen.forEach(function(h){
      if(h.length<2) return;
      var behalten=h[0];
      h.forEach(function(v){ if(wert(v)>=wert(behalten)) behalten=v; });
      h.forEach(function(v){
        if(v===behalten) return;
        vorschlagErgaenzen(behalten, v);
        weg.push(v);
        bericht.zusammengefuehrt++;
      });
    });
    if(haufen.length>1) bericht.konflikte++;
  });
  /* 3. Rest eines bereits UEBERNOMMENEN Spiels: nur wenn jeder referenzierte Eintrag genau
     dieses Ergebnis schon traegt - dann ist der Vorschlag die identische Dublette einer
     bereits getroffenen Entscheidung Ondos. Weicht irgendetwas ab, bleibt er stehen. */
  liste.forEach(function(v){
    if(weg.indexOf(v)>=0 || !fxIdGueltig(v.fixtureId) || (v.art||'log')!=='log') return;
    var job=state.pruefJobs[v.fixtureId];
    if(!job || job.zustand!=='uebernommen') return;
    var ids=Array.isArray(v.eintraege)?v.eintraege:[];
    var es=(state.kiProtokoll||[]).filter(function(e){ return ids.indexOf(e.id)>=0; });
    if(!es.length) return;
    var gleich=es.every(function(e){
      return e.status==='bewertet' && Number(e.ergebnisHeim)===Number(v.heim) && Number(e.ergebnisGast)===Number(v.gast) &&
             (vorschlagLeer(e.ergebnisHalbzeit) || vorschlagLeer(v.halbzeit) || String(e.ergebnisHalbzeit)===String(v.halbzeit));
    });
    if(gleich){ weg.push(v); bericht.bereitsUebernommen++; }
  });
  if(weg.length) state.pruefListe=liste.filter(function(v){ return weg.indexOf(v)<0; });
  else state.pruefListe=liste;
  /* 4. IDs eindeutig machen (siehe vorschlagIdEindeutig) */
  var gesehen={};
  state.pruefListe.forEach(function(v){
    var basis=String(v.id||'V'), id=basis, n=1;
    while(gesehen[id]){ n++; id=basis+'_'+n; }
    if(id!==v.id){ v.idAlt=v.id; v.id=id; bericht.idsUmbenannt++; }
    gesehen[id]=true;
  });
  /* 5. Jobs: fehlende additiv anlegen; bestehende NICHT blind ueberschreiben.
     uebernommen/ignoriert/geparkt haben Vorrang und bleiben unangetastet. */
  state.pruefListe.forEach(function(v){
    if(!fxIdGueltig(v.fixtureId)) return;
    var job=state.pruefJobs[v.fixtureId];
    if(!job){
      state.pruefJobs[v.fixtureId]={
        fixtureId:v.fixtureId, match:v.match||'', datum:v.datum||'', art:v.art||'log',
        eintraege:v.eintraege||null, betId:(v.betId===undefined?null:v.betId),
        zustand:'vorschlag', vorschlagId:v.id, versuche:0, providerIds:{},
        stufe:(v.zuordnung?v.zuordnung.stufe:null), aktualisiert:Date.now(),
        herkunft:'migration_seedV10'
      };
      bericht.jobsNeu++;
      return;
    }
    if(job.zustand==='offen' || job.zustand==='laeuft' || job.zustand==='unzureichend'){
      job.zustand='vorschlag'; job.vorschlagId=v.id; job.aktualisiert=Date.now();
      bericht.jobsAufVorschlag++;
      return;
    }
    if(job.zustand==='vorschlag'){
      var zeigt=state.pruefListe.some(function(w){ return w.id===job.vorschlagId && w.fixtureId===v.fixtureId; });
      if(!zeigt){ job.vorschlagId=v.id; job.aktualisiert=Date.now(); }
    }
  });
  return bericht;
}

/* ================= APP-WECHSEL UND WIEDERKEHR (Abschnitt 6/6b) =================
   iOS haelt eine Seite an, sobald Safari in den Hintergrund geht - ein laufender Prueflauf
   wird dort schlicht eingefroren und kann Minuten spaeter, Stunden spaeter oder gar nicht
   weiterlaufen. Der Auftrag verlangt ausdruecklich KEINE Hintergrundausfuehrungs-Tricks,
   sondern: "beim Verlassen keine neuen Schritte mehr unnoetig starten".
   Genau dafuer steht dieses Merkzeichen. Es bricht nichts ab, was schon unterwegs ist (eine
   bereits abgesendete Anfrage laesst sich nicht zurueckholen), es verhindert nur, dass noch
   ein weiteres Spiel oder eine weitere Runde ANGEFANGEN wird, deren Antwort dann im
   Nirgendwo landet. Der Lauf wird stattdessen als 'pausiert' festgehalten und ist damit
   fortsetzbar - Abschnitt 7: "persistierter Run muss wieder aufgenommen oder sauber als
   fortsetzbar erkannt werden". */
var seiteVerlassen = false;

/* Wie viel Platz die gespeicherten Daten belegen. Gemessen, nicht geschaetzt: die Laenge
   genau der Zeichenkette, die save() schreibt.
   v19.8.28/29 hatten hier noch eine SCHAETZUNG der Warngrenze (erst 3 MB, dann mit Ondos
   echtem Fehlschlag bei 2.726 KB auf 2 MB berichtigt) — beide Zahlen galten nur fuer
   localStorage. Seit v19.8.30 (Umstieg auf IndexedDB) gibt es keine feste, kleine Grenze
   mehr zu schaetzen: Der Browser selbst kennt seine wahre Grenze auf DIESEM Geraet und
   dieser Wert wird nicht mehr geraten (Art. 11), sondern erfragt — siehe speicherQuote(). */
function speicherStand(){
  var zeichen=0;
  try{ zeichen=JSON.stringify(state).length; }catch(e){ return null; }
  return { zeichen:zeichen, kb:Math.round(zeichen/1024) };
}
/* Fragt den Browser nach seiner EIGENEN, wirklichen Speichergrenze auf diesem Geraet
   (navigator.storage.estimate() — Teil der Storage-API, in Safari seit iOS 13 vorhanden).
   Liefert {usage, quota, pct} in Byte bzw. Prozent, oder null, wenn der Browser das nicht
   unterstuetzt — dann wird nirgends eine erfundene Prozentzahl angezeigt (Art. 14). Einmal
   beim Programmstart abgefragt und in speicherQuoteCache gehalten (siehe Programmstart am
   Dateiende) — kein wiederholtes Abfragen bei jedem render(). */
var speicherQuoteCache = null;
function speicherQuote(){
  if(!(navigator.storage && navigator.storage.estimate)) return Promise.resolve(null);
  return navigator.storage.estimate().then(function(s){
    if(!s || !s.quota) return null;
    return { usage:s.usage||0, quota:s.quota, pct:Math.round((s.usage||0)/s.quota*100) };
  }).catch(function(){ return null; });
}

/* ================= LOG ALS TEXT (v19.7.5, Backlog-Punkt 22) =================
   Ondos Vorschlag vom 4.8. Zweck: Bildschirmfotos in Chats ersetzen. Zwoelf Ergebnisse
   als Text liegen unter 3 KB, ein Bildschirmfoto kostet rund 15 KB und ein PDF-Ausdruck
   ein Vielfaches. Reine Ausgabe — es wird nichts gespeichert, nichts gerechnet und
   nichts an ein Gehirn geschickt. */
function datumZahl(s){
  var d=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(d) return Number(d[3])*10000+Number(d[2])*100+Number(d[1]);
  var i=String(s||'').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(i) return Number(i[1])*10000+Number(i[2])*100+Number(i[3]);
  return null;
}
function heuteIso(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function logTextBauen(){
  var vEl=document.getElementById('logVon'), bEl=document.getElementById('logBis');
  /* v19.7.6: Standen die beiden Felder verkehrt herum (von 4.8., bis 28.7.), war das Ergebnis
     immer leer, ohne dass der Grund erkennbar war. Jetzt werden sie getauscht und der Tausch
     wird angezeigt — stillschweigend zu reparieren waere schlechter als es zu sagen. */
  var von=datumZahl(vEl&&vEl.value), bis=datumZahl(bEl&&bEl.value);
  var hinw=document.getElementById('logHinweis');
  if(hinw) hinw.textContent='';
  if(von!==null && bis!==null && von>bis){
    var tausch=vEl.value; vEl.value=bEl.value; bEl.value=tausch;
    var z=von; von=bis; bis=z;

  }
  var treffer=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;

    if(d===null) return;
    if(von!==null && d<von) return;
    if(bis!==null && d>bis) return;
    treffer.push(e);
  });
  treffer.sort(function(a,b){
    var x=datumZahl(a.datum)-datumZahl(b.datum);
    if(x!==0) return x;
    return String(a.match).localeCompare(String(b.match));
  });
  var feld=document.getElementById('logText');
  if(!feld) return;
  if(!treffer.length){ feld.value=t('logExpEmpty'); return; }
  var kopf='ONDO CONTROL — KI-Log '+((vEl&&vEl.value)||'?')+' bis '+((bEl&&bEl.value)||'?')+
    ' · '+treffer.length+' Eintraege · erzeugt '+new Date().toLocaleDateString('de-DE')+' '+jetztUhr();
  var zeilen=treffer.map(function(e){
    var gehirn=(e.herkunft==='flash')?'Flash':'Sonnet';
    var echt=(e.ergebnisHeim!==null && e.ergebnisHeim!==undefined &&

      var st=(x.status==='richtig'||x.status==='falsch')?x.status:'offen';
      return x.label+' '+x.p+'% '+st+(x.gedreht?' [gedreht]':'');
    }).join(' · ');
    return e.datum+(e.anpfiff?(' '+e.anpfiff):'')+' · '+e.match+
      (e.wettbewerb?(' ['+e.wettbewerb+']'):'')+' · '+gehirn+(e.modell?(' '+e.modell):'')+
      ' · getippt '+e.heim+':'+e.gast+' · wirklich '+echt+
      (m?(' · '+m):'')+
      (e.bttsWort?(' · Wort '+e.bttsWort):'')+
      (e.geparkt?' [geparkt'+
        (e.parkGrund==='unstable_ref'?(': '+t('parkGrundInstabil')):'')+
        (e.parkGrund==='sonderformat'?(': '+t('parkGrundFormat')+(e.parkFormat?(' '+e.parkFormat):'')):'')+']':'')+
      /* v19.8.12 (Backlog-Punkt 68): Die Markierung gehoert ausdruecklich auch in den
         Log-Text-Export, nicht nur in die Karte — sonst waere sie im Chat nicht auswertbar. */
      (e.refEinigkeit==='3verschieden' ? ' [3 Laeufe, 3 verschiedene Werte]' :
        (e.refEinigkeit?(' [nicht einstimmig: '+e.refEinigkeit.replace('von',' von ')+']'):''))+
      ((e.refQuellen && e.refLaeufe && e.refQuellen<e.refLaeufe)
        ?(' ['+e.refLaeufe+' Laeufe, '+e.refQuellen+' Quelle(n)]'):'')+
      (e.begruendung?(' · "'+e.begruendung+'"'):'');
  });
  feld.value=kopf+'\n\n'+zeilen.join('\n');

  });

  var kopf='ONDO CONTROL — Schiedsrichter-Rohantworten '+((vEl&&vEl.value)||'?')+' bis '+((bEl&&bEl.value)||'?')+
    ' · '+treffer.length+' Eintraege · erzeugt '+new Date().toLocaleDateString('de-DE')+' '+jetztUhr();
  var bloecke=treffer.map(function(e){

/* v19.7.8: Feld-Kennung als Argument, damit dieselbe Funktion auch den Pruef-Text kopiert.
   Ohne Argument verhaelt sie sich unveraendert wie bisher. */
function logTextKopieren(feldId){
  var feld=document.getElementById(feldId||'logText');
  if(!feld || !feld.value) return;
  feld.removeAttribute('readonly');
  feld.select(); feld.setSelectionRange(0, feld.value.length);
  var fertig=function(){ feld.setAttribute('readonly','readonly'); note(t('saved')); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(feld.value).then(fertig).catch(function(){
      try{ document.execCommand('copy'); }catch(e){}
      fertig();
    });
    return;
  }
  try{ document.execCommand('copy'); }catch(e){}
  fertig();
}

   MESS_KONS_SPIEL_FELDER, MESS_KONS_GEHIRN_FELDER) deckte bei diesem Audit bereits alle
   real vorkommenden Felder ab - kein weiterer Fund. state.bets, trainingsraumProtokoll,
   trainingsraumSpiele und antwortkonsistenzBericht sind in dieser echten Datei leer (0
   Eintraege) bzw. gar nicht vorhanden; fuer diese vier Bereiche stuetzt sich das Audit
   ersatzweise auf die tatsaechlichen Zuweisungsstellen im Code (addBet(), Fotoerkennung,
   trainingsraumSpielHinzufuegen(), state.trainingsraumProtokoll.unshift() in der
   Trainingsraum-Auswertung, antwortkonsistenzAuswerten()) - dort deckt jede Liste ebenfalls
   bereits alle tatsaechlich zugewiesenen Felder ab, aber ohne echte Nutzungsdaten ist das
   eine schwaechere Beleglage als bei kiProtokoll (Luecke ehrlich benannt, nicht verschwiegen). */
var MESS_MARKT_FALT_FELDER = ['code','label','p','status'];
var MESS_MARKT_FELDER = ['typ','code','label','p','status','gedreht','fAlt','fKorr'];
var MESS_KI_FELDER = ['id','aera','codeVersion','datum','match','wettbewerb','anpfiff','stufe',
  'herkunft','heim','gast','bttsWort','modell','begruendung','maerkte',
  'ergebnisHeim','ergebnisGast','status','recherchiert',
  'ergebnisHalbzeit','ergebnisVerl','ergebnisQuelle',
  'refEinigkeit','refLaeufe','refQuellen','geparkt','parkGrund','parkFormat',
  'tipp','quote'];
var MESS_BET_FELDER = ['id','datum','match','tipp','quote','einsatz','status','claudeRichtig',
  'fromKI','herkunft','kiProtokollId','kiProtokollIds'];
var MESS_REGELN_FELDER = ['maxEinsatz'];
var MESS_KORREKTURF_FELDER = ['datum','anzahl','typA','typB'];
var MESS_TRAIN_PROT_FELDER = ['id','getestetAm','quelle','match','wettbewerb','anpfiff',
  'herkunft','modell','heim','gast','bttsWort','begruendung','maerkte',
  'ergebnisHeim','ergebnisGast','status'];
var MESS_TRAIN_SPIEL_FELDER = ['match','wettbewerb','datum','ergebnisHeim','ergebnisGast'];
var MESS_KONS_SPIEL_FELDER = ['match','laeufe','gleich','spanne'];
var MESS_KONS_GEHIRN_FELDER = ['spiele','gleichAnteil','avgSpanne','maxSpanne','bestanden','proSpiel'];
/* NACHBESSERUNG 18.9.2026 (Backlog-Punkt 85, Fund ChatGPT, Fassung 3): messAntwortkonsistenzProjekt()
   iterierte bisher ueber Object.keys(bericht) - jeder kuenftige, unbekannte Kopf-Schluessel kaeme
   dadurch durch, und ein primitiver Wert sogar unveraendert (messNurFelder() gibt Nicht-Objekte
   unveraendert zurueck). Beauftragt war ausschliesslich sonnet und flash - belegt in
   antwortkonsistenzLauf(): gehirne wird ausschliesslich ueber hatSonnet()/hatGemini() mit den
   Literalen 'sonnet'/'flash' befuellt, antwortkonsistenzAuswerten() iteriert nur ueber
   Object.keys(laeufe), also exakt diese zwei. Eine echte Positivliste ersetzt jetzt die
   Object.keys()-Iteration - dieselbe Disziplin wie bei MESS_PROJEKTOREN: lieber ein fehlendes
   Feld im Export als ein zweiter, unbemerkter espnRoh-Fall. */
var MESS_KONS_KOPF_FELDER = ['sonnet','flash'];

/* Reine Hilfsfunktion: kopiert aus wert AUSSCHLIESSLICH die in felder genannten Eigenschaften.
   Kein Objekt (null/undefined/Zahl/Text/Bool) -> unveraendert zurueckgegeben, das sind bereits
   reine Messwerte ohne weitere Tiefe. */
function messNurFelder(wert, felder){
  if(wert===null || wert===undefined || typeof wert!=='object') return wert;
  var raus={};
  felder.forEach(function(f){ if(f in wert) raus[f]=wert[f]; });
  return raus;
}
function messMarktProjekt(m){
  var raus = messNurFelder(m, MESS_MARKT_FELDER);
  if(raus && raus.fAlt) raus.fAlt = messNurFelder(raus.fAlt, MESS_MARKT_FALT_FELDER);
  return raus;
}
function messKiEintragProjekt(e){
  var raus = messNurFelder(e, MESS_KI_FELDER);
  if(raus && Array.isArray(raus.maerkte)) raus.maerkte = raus.maerkte.map(messMarktProjekt);
  return raus;
}
function messTrainProtEintragProjekt(e){
  var raus = messNurFelder(e, MESS_TRAIN_PROT_FELDER);
  if(raus && Array.isArray(raus.maerkte)) raus.maerkte = raus.maerkte.map(messMarktProjekt);
  return raus;
}
function messAntwortkonsistenzProjekt(bericht){
  if(!bericht || typeof bericht!=='object') return bericht;
  var raus={};
  MESS_KONS_KOPF_FELDER.forEach(function(gehirn){
    if(!(gehirn in bericht)) return;
    if(!bericht[gehirn] || typeof bericht[gehirn]!=='object') return;
    var g = messNurFelder(bericht[gehirn], MESS_KONS_GEHIRN_FELDER);
    if(g && Array.isArray(g.proSpiel)){
      g.proSpiel = g.proSpiel.map(function(s){ return messNurFelder(s, MESS_KONS_SPIEL_FELDER); });
    }
    raus[gehirn]=g;
  });
  return raus;
}
/* Ein Projektor je MESS_FELDER-Eintrag — bewusst OHNE Rueckfallebene auf einen rohen Kopiervorgang
   (kein "sonst raus[f]=state[f]"). Ein Feld ohne eigenen Projektor wird beim Bauen unten
   uebersprungen statt roh durchgereicht — sicherer, fehlendes Feld im Export statt eines
   unbemerkten zweiten espnRoh-Falls. startSaldo/eingezahlt/ausgezahlt/letzteSicherung sind reine
   Skalare (Zahl/Text) und werden unveraendert weitergereicht. */
var MESS_PROJEKTOREN = {
  kiProtokoll: function(v){ return (v||[]).map(messKiEintragProjekt); },
  bets: function(v){ return (v||[]).map(function(b){ return messNurFelder(b, MESS_BET_FELDER); }); },
  regeln: function(v){ return messNurFelder(v, MESS_REGELN_FELDER); },
  startSaldo: function(v){ return v; },
  eingezahlt: function(v){ return v; },
  ausgezahlt: function(v){ return v; },
  korrekturF: function(v){ return messNurFelder(v, MESS_KORREKTURF_FELDER); },
  letzteSicherung: function(v){ return v; },
  trainingsraumProtokoll: function(v){ return (v||[]).map(messTrainProtEintragProjekt); },
  trainingsraumSpiele: function(v){ return (v||[]).map(function(s){ return messNurFelder(s, MESS_TRAIN_SPIEL_FELDER); }); },
  antwortkonsistenzBericht: function(v){ return messAntwortkonsistenzProjekt(v); }
};

function messGeheimFund(wert, pfad){
  if(wert===null || wert===undefined) return null;
  if(typeof wert === 'string'){
    if(wert.indexOf('sk-ant-')===0 || wert.indexOf('AIza')===0) return pfad+' (Wert sieht aus wie ein Schluessel)';
    return null;
  }
  if(typeof wert !== 'object') return null;
  if(Object.prototype.toString.call(wert)==='[object Array]'){
    for(var i=0;i<wert.length;i++){
      var tA = messGeheimFund(wert[i], pfad+'['+i+']');
      if(tA) return tA;
    }
    return null;
  }
  for(var k in wert){
    if(!Object.prototype.hasOwnProperty.call(wert,k)) continue;
    if(MESS_VERBOTEN.test(k)) return pfad+'.'+k+' (Feldname)';
    var tB = messGeheimFund(wert[k], pfad+'.'+k);
    if(tB) return tB;
  }
  return null;
}

function messDatenBauen(){
  var eintraege = (state.kiProtokoll||[]).length;
  var wetten = (state.bets||[]).length;
  var raus = {};
  raus.kopf = {
    was: 'ONDO CONTROL Messdaten — ohne Schluessel',
    codeVersion: CODE_VERSION,
    erzeugt: new Date().toLocaleDateString('de-DE')+' '+jetztUhr(),
    eintraege: eintraege,
    wetten: wetten,
    felder: MESS_FELDER.slice(),
    hinweis: 'Enthaelt KEINE API-Schluessel und KEINE PIN. Vollstaendig, ohne Zeitraum- und ohne Aera-Filter.'
  };
  MESS_FELDER.forEach(function(f){
    if(!(f in state)) return;
    var projektor = MESS_PROJEKTOREN[f];
    if(!projektor) return;
    raus[f] = projektor(state[f]);
  });
  raus.ende = 'ENDE · '+eintraege+' Eintraege · '+wetten+' Wetten';
  return raus;
}

function messTextBauen(){
  var feld = document.getElementById('messText');
  var hinw = document.getElementById('messHinweis');
  if(hinw) hinw.textContent = '';
  if(!feld) return null;
  var daten = messDatenBauen();
  var fund = messGeheimFund(daten, 'daten');
  if(fund){
    feld.value = '';
    if(hinw) hinw.textContent = t('messBlock')+' '+fund;
    return null;
  }
  feld.value = JSON.stringify(daten);
  return daten;
}

function messDatei(){
  var daten = messDatenBauen();
  var fund = messGeheimFund(daten, 'daten');
  var hinw = document.getElementById('messHinweis');
  if(hinw) hinw.textContent = '';
  if(fund){
    if(hinw) hinw.textContent = t('messBlock')+' '+fund;
    return;
  }
  var d = new Date();
  var name = 'ondo-control-messdaten-'+d.getFullYear()+'-'+
    ('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.json';
  var blob = new Blob([JSON.stringify(daten)], {type:'application/json'});
  var datei = null;
  try{ datei = new File([blob], name, {type:'application/json'}); }catch(e){}
  if(datei && navigator.share && navigator.canShare && navigator.canShare({files:[datei]})){
    navigator.share({ files:[datei], title:name }).catch(function(){ dateiHerunterladen(blob, name); });
    return;
  }
  dateiHerunterladen(blob, name);
}

/* ================= EINMALIGE BERICHTIGUNG — BACKLOG-PUNKT F (13.8.2026) =================
   Beschluss Ondo 13.8.2026. Bis v19.7.8 leitete maerkteBauen() die Behauptung
   "beide treffen" aus dem getippten Ergebnis ab, statt das Gehirn zu fragen.
   Sonnet beantwortete den Wert aber als "wie wahrscheinlich treffen beide".
   Dadurch steht bei einem Teil der Alt-Eintraege das falsche Etikett im Log.

   GRENZE (zwingend): Nur Eintraege OHNE codeVersion — also von vor dem Schnitt
   bei v19.8.0. Ab dem Schnitt bedeutet 'gedreht' nur noch "Prozentzahl lag unter 50"
   und ist harmlos; eine Berichtigung dort wuerde richtige Eintraege beschaedigen.

   AUSLOESER ist die Null im Tipp, NICHT das Kennzeichen 'gedreht'. Eintraege mit
   Tipp ohne Null (z. B. 1:1) bleiben unangetastet — sie sind richtig bewertet.
   Ondos Entscheidung 13.8.: Amerika Mineiro und Remo (26.7., Tipp 1:1) bleiben stehen.

   ZWEI FAELLE:
   A  Tipp mit Null UND gedreht  -> Etikett drehen, Prozentzahl bleibt.
   B  Tipp mit Null, NICHT gedreht -> Etikett bleibt, Prozentzahl wird zum Gegenwert.

   UMKEHRBAR: Jeder geaenderte Markt bekommt fAlt mit den Ursprungswerten.
   EINMALIG: state.korrekturF haelt Datum und Anzahl fest. */
function korrFTreffer(){
  var a=[], b=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.codeVersion) return;                          /* nach dem Schnitt: nicht anfassen */
    if(e.herkunft==='flash') return;                   /* nur Sonnet */
    if(!(e.heim===0 || e.gast===0)) return;            /* Ausloeser: Null im Tipp */
    (e.maerkte||[]).forEach(function(m){
      if(m.typ!=='btts' || m.fAlt) return;
      (m.gedreht ? a : b).push({e:e, m:m});
    });
  });
  return {a:a, b:b};
}
function korrFText(tr){
  var z=[];
  tr.a.concat(tr.b).forEach(function(x){
    z.push(x.e.datum+' · '+x.e.match+' · getippt '+x.e.heim+':'+x.e.gast+
      ' · '+x.m.label+' '+x.m.p+'% '+(x.m.status||'offen')+
      '  ->  '+(x.m.gedreht ? (x.m.code==='btts_ja'?'Nein':'Ja')+' '+x.m.p+'%'
                            : x.m.label+' '+(100-x.m.p)+'%'));
  });
  return z.join('\n');
}
function korrFPruefen(){
  var tr=korrFTreffer(), f=document.getElementById('korrText');
  if(!f) return;
  if(!tr.a.length && !tr.b.length){ f.value=t('korrNone'); return; }
  f.value='BETROFFEN: '+(tr.a.length+tr.b.length)+' Aussagen — '+
    tr.a.length+' vom Typ A (Etikett), '+tr.b.length+' vom Typ B (Prozentzahl)\n'+
    'Nichts wurde geaendert.\n\n'+korrFText(tr);
}
function korrFAnwenden(){
  if(state.korrekturF){ alert(t('korrDone').replace('{d}', state.korrekturF.datum)); return; }
  var tr=korrFTreffer();
  var n=tr.a.length+tr.b.length;
  if(!n){ alert(t('korrNone')); return; }
  if(!confirm(t('korrAsk').replace('{a}',n).replace('{b}',tr.a.length).replace('{c}',tr.b.length))) return;
  tr.a.forEach(function(x){
    var m=x.m;
    m.fAlt={code:m.code, label:m.label, p:m.p, status:m.status};
    if(m.code==='btts_ja'){ m.code='btts_nein'; m.label=t('bttsNo'); }
    else                  { m.code='btts_ja';   m.label=t('bttsYes'); }
    m.fKorr='A';
  });
  tr.b.forEach(function(x){
    var m=x.m;
    m.fAlt={code:m.code, label:m.label, p:m.p, status:m.status};
    m.p=100-m.p;
    m.fKorr='B';
  });
  /* Urteil neu rechnen — nur dort, wo ein Endstand vorliegt. Geparkte und offene
     Eintraege bleiben offen; die Bewertung erfindet keinen Endstand. */
  tr.a.concat(tr.b).forEach(function(x){
    var e=x.e;
    if(e.ergebnisHeim===null || e.ergebnisHeim===undefined ||
       e.ergebnisGast===null || e.ergebnisGast===undefined){ x.m.status='offen'; return; }
    var u=marktUrteil(x.m.code, e.ergebnisHeim, e.ergebnisGast);
    x.m.status = (u===null) ? 'offen' : (u ? 'richtig' : 'falsch');
  });
  state.korrekturF={datum:new Date().toLocaleDateString('de-DE')+' '+jetztUhr(),
                    anzahl:n, typA:tr.a.length, typB:tr.b.length};
  save(); render();
  alert(t('korrOk').replace('{a}', n));
}

/* v19.8.14 (Backlog-Punkt 70, 4.9.2026): reine Anzeigefilter fuer das KI-Log. Wirkt nur auf die
   Darstellung — state.kiProtokoll bleibt unangetastet, .filter() liefert immer ein neues Array. */
function kilogGefiltert(liste, von, bis, wettbewerb, status, mannschaft){
  var vonZ = von ? datumZahl(von) : null;
  var bisZ = bis ? datumZahl(bis) : null;
  var wSuche = String(wettbewerb||'').trim().toLowerCase();
  /* v19.8.15 (Backlog-Punkt 71): angehaengter Parameter, damit alte Aufrufe mit nur fuenf
     Argumenten unveraendert weiterlaufen (mannschaft ist dann undefined, die Teamsuche ein No-op). */
  var mSuche = String(mannschaft||'').trim().toLowerCase();
  return liste.filter(function(e){
    var dz = datumZahl(e.datum);
    if(vonZ!==null && (dz===null || dz<vonZ)) return false;
    if(bisZ!==null && (dz===null || dz>bisZ)) return false;
    if(wSuche && String(e.wettbewerb||'').toLowerCase().indexOf(wSuche)<0) return false;
    if(mSuche && String(e.match||'').toLowerCase().indexOf(mSuche)<0) return false;
    if(status==='offen' && !(e.status==='offen' && !e.geparkt)) return false;
    if(status==='geparkt' && !e.geparkt) return false;
    if(status==='bewRichtig' && !(e.status==='bewertet' && (e.maerkte||[]).every(function(m){return m.status==='richtig';}))) return false;
    if(status==='bewFalsch' && !(e.status==='bewertet' && (e.maerkte||[]).some(function(m){return m.status==='falsch';}))) return false;
    return true;
  });
}

/* ================= MAERKTE AUS ERGEBNIS ABLEITEN (fester Code, keine KI) =================
   Gemini-Hinweis v19: Die KI nennt NUR das Ergebnis. Welche Maerkte daraus folgen,
   rechnet die App — so kann sich die KI nicht selbst widersprechen. */
function maerkteBauen(match, heim, gast, p1x2, pTore, pBtts){
  var tm = teamsAus(match);
  var ges = heim + gast;
  var m = [];
  m.push({
    typ:'1x2',
    code: heim>gast ? 'sieg_heim' : (heim<gast ? 'sieg_gast' : 'remis'),
    label: heim>gast ? ('Sieg '+tm.heim) : (heim<gast ? ('Sieg '+tm.gast) : t('draw')),
    p: p1x2, status:'offen'
  });
  /* Ja/Nein-Maerkte: unter 50 Prozent waere widerspruechlich ("Ja zu 42 %" heisst in
     Wahrheit "Nein zu 58 %"). Deshalb dreht die App die Aussage um. Rechnerisch identisch,
     aber die angezeigte Behauptung ist die, an die das Gehirn wirklich glaubt. */
  function jaNein(typ, codeA, labelA, codeB, labelB, p){
    if(p < 50) return { typ:typ, code:codeB, label:labelB, p:(100-p), gedreht:true, status:'offen' };
    return { typ:typ, code:codeA, label:labelA, p:p, status:'offen' };
  }
  m.push(jaNein('tore',
    (ges>2.5 ? 'ueber' : 'unter'), (ges>2.5 ? t('over25') : t('under25')),
    (ges>2.5 ? 'unter' : 'ueber'), (ges>2.5 ? t('under25') : t('over25')),
    pTore));
  /* v19.8.0, Backlog-Punkt F (Beschluss Ondo 5.8., gebaut 8.8.): Die Behauptung wird NICHT
     mehr aus dem getippten Ergebnis abgeleitet. Bis v19.7.8 stand hier
     var btts = (heim>0 && gast>0), und die Behauptung kippte auf "nein", sobald der Tipp
     eine Null enthielt. Sonnet beantwortete pBtts aber als "wie wahrscheinlich treffen
     beide" — dadurch wurden 15 bewertete Aussagen mit verdrehtem Etikett gefuehrt.
     Ab hier ist die Behauptung immer btts_ja; die Umdrehung greift nur noch unter 50 —
     genau wie beim Tore-Markt darueber. SCHNITT: Werte vor und ab v19.8.0 sind nicht
     vergleichbar. Altbestand NICHT anfassen, dazu ist nichts entschieden. */
  m.push(jaNein('btts',
    'btts_ja', t('bttsYes'),
    'btts_nein', t('bttsNo'),
    pBtts));
  return m;
}
/* Urteil per fester Regel — deterministisch, keine KI-Logik mehr (v19 Punkt 3) */
function marktUrteil(code, h, g){
  var ges = h + g;
  switch(code){
    case 'sieg_heim': return h > g;
    case 'sieg_gast': return g > h;
    case 'remis':     return h === g;
    case 'ueber':     return ges > 2.5;
    case 'unter':     return ges < 2.5;
    case 'btts_ja':   return (h > 0 && g > 0);
    case 'btts_nein': return !(h > 0 && g > 0);
  }
  return null;
}

/* Trefferquote: ab v19 Nebenkennzahl (Ergaenzung von ChatGPT), zaehlt nur v19-Aussagen */
function calcAI(){

}
/* Kalibrierung: Hauptkennzahl ab v19. Nicht "wie oft richtig", sondern
   "stimmen die Prozentangaben mit der Wirklichkeit ueberein". */
function calcKalibrierung(quelle){
  var punkte=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    if(quelle && (e.herkunft||'sonnet')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status==='richtig'||m.status==='falsch'){
        var p=Number(m.p); if(isNaN(p)) p=50;
        punkte.push({ p:Math.max(1,Math.min(99,p)), ok:(m.status==='richtig') });
      }
    });
  });
  if(!punkte.length) return null;
  var baender=[[1,49],[50,59],[60,69],[70,79],[80,89],[90,99]];
  var zeilen=[], summe=0, n=0;
  baender.forEach(function(b){
    var g=punkte.filter(function(x){ return x.p>=b[0] && x.p<=b[1]; });
    if(!g.length) return;
    var behauptet=g.reduce(function(s,x){return s+x.p;},0)/g.length;
    var echt=g.filter(function(x){return x.ok;}).length/g.length*100;
    zeilen.push({ von:b[0], bis:b[1], n:g.length,
      behauptet:Math.round(behauptet), echt:Math.round(echt) });
    summe += Math.abs(behauptet-echt)*g.length; n+=g.length;
  });
  return { zeilen:zeilen, gesamt:punkte.length, abw: n? Math.round(summe/n):null };
}

/* Backlog-Punkt 34 (Beschluss Ondo, 7.9.2026): Brier-Score als zweite Kennzahl neben der
   Kalibrierungsabweichung. Verrechnet behauptete Zuversicht und tatsaechliches Eintreffen zu
   einer Zahl je Aussage, gemittelt ueber alle bewerteten Aussagen des Gehirns -- laesst sich
   nicht durch Ausweichen auf 50 % schoenen (0,25 = "immer 50 %", der in den Dokumenten
   benannte, aber nie gemessene Vergleichswert). Dieselbe Datengrundlage wie calcKalibrierung
   (m.p, m.status), eigene, unveraenderte Sammelschleife -- calcKalibrierung bleibt
   unangetastet (Arbeitsregel H). */
function calcBrierScore(quelle){
  var punkte=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    if(quelle && (e.herkunft||'sonnet')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status==='richtig'||m.status==='falsch'){
        var p=Number(m.p); if(isNaN(p)) p=50;
        punkte.push({ p:Math.max(1,Math.min(99,p))/100, ok:(m.status==='richtig'?1:0) });
      }
    });
  });
  if(!punkte.length) return null;
  var summe=punkte.reduce(function(s,x){ return s+Math.pow(x.p-x.ok,2); },0);
  return { wert: Math.round((summe/punkte.length)*10000)/10000, gesamt: punkte.length };
}

/* Backlog-Punkt 35 (Beschluss Ondo, 7.9.2026): Streuungsangabe fuer die
   Kalibrierungsabweichung -- eine einzelne Prozentzahl ohne Streuung ist Scheinpraezision
   (Art. 14), angewandt auf die eigenen Kennzahlen. Bootstrap ueber 600 Ziehungen (dasselbe
   Verfahren wie die Nachrechnung vom 14.8.2026 in Backlog-Punkt 35), 90-%-Bereich als
   5./95. Perzentil der resamplten Kalibrierungsabweichung. Eigene Sammelschleife und eigene,
   neue Abweichungsrechnung (abwAusPunkten) -- calcKalibrierung bleibt unangetastet.
   Ehrlich benannt: Dies ist die einzige Rechenfunktion im Projekt, die echten Zufall
   (Math.random) nutzt, wie ein Bootstrap es verlangt. Der Trockentest prueft deshalb nur
   Kennwerte (gueltiger Bereich, Bereich enthaelt den Punktschaetzer aus calcKalibrierung),
   nicht exakte Zahlen -- kein Schein-Determinismus vorgetaeuscht. */
function abwAusPunkten(punkte){
  var baender=[[1,49],[50,59],[60,69],[70,79],[80,89],[90,99]];
  var summe=0, n=0;
  baender.forEach(function(b){
    var g=punkte.filter(function(x){ return x.p>=b[0] && x.p<=b[1]; });
    if(!g.length) return;
    var behauptet=g.reduce(function(s,x){return s+x.p;},0)/g.length;
    var echt=g.filter(function(x){return x.ok;}).length/g.length*100;
    summe += Math.abs(behauptet-echt)*g.length; n+=g.length;
  });
  return n? summe/n : null;
}
function calcStreuung(quelle){
  var punkte=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    if(quelle && (e.herkunft||'sonnet')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status==='richtig'||m.status==='falsch'){
        var p=Number(m.p); if(isNaN(p)) p=50;
        punkte.push({ p:Math.max(1,Math.min(99,p)), ok:(m.status==='richtig') });
      }
    });
  });
  if(punkte.length<2) return null;
  var ZIEHUNGEN=600, werte=[];
  for(var i=0;i<ZIEHUNGEN;i++){
    var stich=[];
    for(var j=0;j<punkte.length;j++) stich.push(punkte[Math.floor(Math.random()*punkte.length)]);
    var a=abwAusPunkten(stich);
    if(a!==null) werte.push(a);
  }
  if(!werte.length) return null;
  werte.sort(function(a,b){return a-b;});
  function perz(p){ var idx=Math.min(werte.length-1,Math.max(0,Math.round(p*(werte.length-1)))); return werte[idx]; }
  return {
    unten: Math.round(perz(0.05)*10)/10,
    oben: Math.round(perz(0.95)*10)/10,
    gesamt: punkte.length
  };
}

/* Backlog-Punkt 0b (Wiederaufnahme ENTSCHIEDEN 7.9.2026, Umsetzungsfrage ENTSCHIEDEN
   11.9.2026, beides Ondo): Widerspruchsquote JE MARKT, nicht als eine Zahl ueber alle drei
   Maerkte. Grund: Der Markt "1x2" (Sieger) wird in maerkteBauen() immer direkt aus dem Tipp
   abgeleitet (heim>gast?...), nie eigens gefragt -- dort kann es strukturell nie einen
   Widerspruch geben. Eine gemeinsame Zahl wuerde durch diesen immer widerspruchsfreien Markt
   verwaessert und echte Widersprueche bei "tore"/"btts" kleiner aussehen lassen, als sie sind
   -- selbst eine Art Scheinpraezision (Art. 14). Deshalb hier nur die zwei Maerkte, die
   eigens gefragt werden.
   RUECKWIRKEND AUSLESBAR, KEINE NEUE MESSUNG (wie im Punkt vermerkt): jaNein() in
   maerkteBauen() setzt m.gedreht=true genau dann, wenn die eigens gefragte Prozentzahl unter
   50 lag, bezogen auf die vom Tipp implizierte Seite -- das IST der Widerspruch zwischen Tipp
   und Marktaussage, schon in jeder historischen Aussage vermerkt.
   BEWUSST OHNE status-Filter (anders als calcKalibrierung/calcBrierScore/calcStreuung): Der
   Widerspruch entsteht beim Vorhersagen selbst, nicht erst beim spaeteren Pruefen des
   Ergebnisses -- ein noch offener oder geparkter Eintrag ist trotzdem schon widerspruechlich
   oder nicht. Eine Einschraenkung auf bewertete Aussagen wuerde hier nur die Stichprobe ohne
   inhaltlichen Grund verkleinern. */
function calcWiderspruch(quelle){
  var typen=['tore','btts'];
  var ergebnis={};
  typen.forEach(function(typ){
    var n=0, wid=0;
    (state.kiProtokoll||[]).forEach(function(e){
      if(e.aera!=='v19') return;
      if(quelle && (e.herkunft||'sonnet')!==quelle) return;
      (e.maerkte||[]).forEach(function(m){
        if(m.typ!==typ) return;
        n++;
        if(m.gedreht) wid++;
      });
    });
    ergebnis[typ] = n ? { quote:Math.round((wid/n)*1000)/10, n:n, widerspruech:wid } : null;
  });
  return ergebnis;
}

/* Gepaarter Vergleich Sonnet gegen Flash (Backlog-Punkt 51, Beschluss Ondo/ChatGPT 15.8.,
   gebaut 28.8.2026). Nur Spiele, die BEIDE Gehirne bewertet haben — Tipp gegen Tipp, statt
   nur die getrennten Gesamtzahlen zu vergleichen. calcKalibrierung bleibt unveraendert.
   Paar-Schluessel: exakter Text von match (getrimmt) + exakter Text von datum — dieselbe
   Art Vergleich wie logParkenTag fuer "ein Tag" benutzt. Bewusst KEINE Normalisierung (wie
   bei der Dubletten-Sperre in spielListeHolen): das kann Paare uebersehen, wenn beide
   Gehirne dasselbe Spiel geringfuegig anders benennen (Fehlerart S1), aber es kann NIE zwei
   verschiedene Spiele faelschlich zusammenlegen. Backlog-Punkt 41 betrifft hier nichts —
   der Fehler dort sitzt in wettbewerb/anpfiff/stufe (ueber paket.liste[idx] geholt), match
   kommt direkt aus der Antwort des jeweiligen Gehirns. Kommt derselbe Schluessel beim
   selben Gehirn mehrfach vor (z. B. zweiter Lauf am selben Tag, Punkt 37): nicht paaren,
   separat zaehlen — nicht raten. Reine Zahlen, keine Wertung im Code. */
function calcGepaartVergleich(){
  var TYPEN=['1x2','tore','btts'];
  var sonnet={}, flash={};
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19' || e.geparkt) return;
    var key=e.datum+'|'+String(e.match||'').trim();
    var ziel=((e.herkunft||'sonnet')==='flash') ? flash : sonnet;
    (ziel[key]=ziel[key]||[]).push(e);
  });
  var maerkte={};
  TYPEN.forEach(function(ty){ maerkte[ty]={nurSonnet:0,nurFlash:0,beideRichtig:0,beideFalsch:0}; });
  var gepaartGesamt=0, mehrdeutig=0;
  Object.keys(sonnet).forEach(function(key){
    if(!(key in flash)) return;
    var sList=sonnet[key], fList=flash[key];
    if(sList.length!==1 || fList.length!==1){ mehrdeutig++; return; }
    gepaartGesamt++;
    var s=sList[0], f=fList[0];
    TYPEN.forEach(function(ty){
      var sm=(s.maerkte||[]).filter(function(m){return m.typ===ty;})[0];
      var fm=(f.maerkte||[]).filter(function(m){return m.typ===ty;})[0];
      if(!sm || !fm) return;
      if(sm.status!=='richtig' && sm.status!=='falsch') return;
      if(fm.status!=='richtig' && fm.status!=='falsch') return;
      var sOk=sm.status==='richtig', fOk=fm.status==='richtig';
      var z=maerkte[ty];
      if(sOk && fOk) z.beideRichtig++;
      else if(!sOk && !fOk) z.beideFalsch++;
      else if(sOk) z.nurSonnet++;
      else z.nurFlash++;
    });
  });
  return { maerkte:maerkte, gepaartGesamt:gepaartGesamt, mehrdeutig:mehrdeutig };
}

/* Entschlossenheit (v19.7 Punkt 1): Wie oft legt sich ein Gehirn ueberhaupt fest?
   Ohne diese Zahl wird Vorsicht mit Koennen verwechselt. Wird aus vorhandenen Daten
   gerechnet, kostet keinen Aufruf und wird den Gehirnen NICHT mitgeteilt. */
function calcEntschlossenheit(quelle){
  var ps=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    if((e.herkunft||'sonnet')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status==='richtig'||m.status==='falsch'){
        var p=Number(m.p); if(isNaN(p)) p=50;
        ps.push(Math.max(1,Math.min(99,p)));
      }
    });
  });
  if(!ps.length) return null;
  var abstand = ps.reduce(function(s,p){ return s+Math.abs(p-50); },0)/ps.length;
  var ueber = ps.filter(function(p){ return p>=60; }).length;
  return { n:ps.length, abstand:Math.round(abstand*10)/10, ueber:Math.round(ueber/ps.length*100), ueberN:ueber };
}

/* ================= OBSERVATION LAYER (Backlog-Punkt 75, Teil 3) =================
   Die dritte und letzte Stufe der Lernkette, beschlossen am 6.7.2026, Auftrag Ondo 11.9.2026.
   Ebene 3 im Sinne von Ondo-Core 1b: Er bewertet, was die Ebenen 1 (Daten) und 2 (Denken)
   getrennt erhoben haben — er erhebt selbst nichts und leitet keine Ebene aus einer anderen ab.

   WAS ER TUT: Er beantwortet die einzige Frage, die beim naechsten Tipp wirklich hilft —
   "Was hat sich bisher als wahr herausgestellt?" — und sagt ausdruecklich "zu wenig Daten",
   wo die Grundlage zu duenn ist. Eine Zahl ohne Stichprobengroesse waere Scheinpraezision
   (Art. 14); deshalb traegt JEDE Beobachtung ihre Stichprobengroesse und ihre Staerke mit.

   AUFLAGE AUS ONDO-CORE 1c, HIER EINGELOEST: Keine Lehre aus einem unsicher bewerteten
   Eintrag. lernGrundlage() schliesst zwei Arten aus, und genau diese zwei Felder sind es,
   auf die die Auflage am 11.9.2026 festgenagelt wurde:
     - e.geparkt        — die Bewertung wurde bewusst ausgesetzt, es wurde nie ein Ergebnis
                          uebernommen; ein solcher Eintrag hat gar kein Urteil, aus dem man
                          lernen koennte.
     - e.refEinigkeit   — gesetzt genau dann, wenn nur zwei von drei Schiedsrichter-Laeufen
                          uebereinstimmten (pruefAnwenden loescht das Feld bei Einstimmigkeit).
                          Das Ergebnis wurde uebernommen, ist aber selbst nur wahrscheinlich.
                          Eine Lehre daraus waere eine Vermutung mit Lehrsatz-Anstrich.
   Folge, offen benannt: Der Observation Layer rechnet auf einer KLEINEREN Grundlage als die
   Kalibrierungsanzeige darueber (calcKalibrierung kennt diese zwei Ausschluesse nicht). Das
   ist gewollt und kein Widerspruch — dort wird gemessen, hier wird gelernt, und Lernen
   verlangt die haerteren Belege. Die Zahlen der zwei Bereiche duerfen deshalb abweichen. */
var LERN_BELEGT=20, LERN_HINWEIS=10;
function lernGrundlage(quelle, typ){
  var punkte=[];
  (state.kiProtokoll||[]).forEach(function(e){
    if(e.aera!=='v19') return;
    if(e.geparkt) return;          /* Auflage Ondo-Core 1c */
    if(e.refEinigkeit) return;     /* Auflage Ondo-Core 1c */
    if(quelle && (e.herkunft||'sonnet')!==quelle) return;
    (e.maerkte||[]).forEach(function(m){
      if(m.status!=='richtig' && m.status!=='falsch') return;
      if(typ && m.typ!==typ) return;
      var p=Number(m.p); if(isNaN(p)) p=50;
      punkte.push({ p:Math.max(1,Math.min(99,p)), ok:(m.status==='richtig'), typ:m.typ||'' });
    });
  });
  return punkte;
}
function lernStaerke(n){ return n>=LERN_BELEGT ? 'belegt' : (n>=LERN_HINWEIS ? 'hinweis' : 'zuwenig'); }
/* Behauptet gegen eingetroffen. Positiver Wert = das Gehirn war zuversichtlicher, als die
   Wirklichkeit hergab (Ueberschaetzung); negativer Wert = es hat sich unterschaetzt. */
function lernAbweichung(punkte){
  if(!punkte.length) return null;
  var beh=punkte.reduce(function(s,x){ return s+x.p; },0)/punkte.length;
  var echt=punkte.filter(function(x){ return x.ok; }).length/punkte.length*100;
  return { beh:Math.round(beh), echt:Math.round(echt), diff:Math.round(beh-echt), n:punkte.length };
}

/* Die Bruecke vom Decision Ledger (Teil 2) zurueck in die Beobachtung: Haben die Wetten, die
   aus einer Vorhersage entstanden sind, besser abgeschnitten als die von Hand gesetzten?
   FAENGT DIE BEI TEIL 2 BENANNTE STELLE AB: Wird eine Sicherung eingespielt, in der ein
   verknuepfter kiProtokoll-Eintrag fehlt, zeigt die Verknuepfung ins Leere. Eine solche Wette
   wird EIGENS GEZAEHLT und in keine der beiden Gruppen geschoben — sie stillschweigend als
   "von Hand" zu zaehlen waere eine erfundene Zuordnung.
   v19.11.0 (Backlog-Punkt 78): betKiIds() liefert jetzt ggf. MEHRERE ids (Kombi-Wette). Zaehlt
   als "ausKi", sobald WENIGSTENS EINE davon noch existiert - "verwaist" nur, wenn die Wette
   ueberhaupt verknuepft war (ids.length>0) und KEINE davon mehr existiert. Bei genau einer id
   (die weit ueberwiegende Mehrheit aller Wetten) ist das Verhalten identisch zum Stand davor. */
function lernWetten(){
  var ausKi={ n:0, wins:0, saldo:0 }, vonHand={ n:0, wins:0, saldo:0 }, verwaist=0;
  (state.bets||[]).forEach(function(b){
    if(b.status==='offen') return;
    var ids=betKiIds(b);
    var treffer = ids.filter(function(id){ return (state.kiProtokoll||[]).some(function(x){ return x.id===id; }); });
    if(ids.length && !treffer.length){ verwaist++; return; }
    var ziel = treffer.length ? ausKi : vonHand;
    ziel.n++;
    if(b.status==='gewonnen') ziel.wins++;
    ziel.saldo += profit(b);
  });
  function fertig(g){ return { n:g.n, wins:g.wins, saldo:Math.round(g.saldo*100)/100,
                               quote: g.n ? Math.round(g.wins/g.n*100) : null, staerke:lernStaerke(g.n) }; }
  return { ausKi:fertig(ausKi), vonHand:fertig(vonHand), verwaist:verwaist };
}

/* Die Beobachtungen selbst. Jede ist ein Datensatz, kein fertiger Satz — die Sprache entsteht
   erst in beobachtungenBlock(), damit dieselbe Beobachtung in allen drei Sprachen dieselbe
   Aussage traegt. */
function beobachtungen(){
  var liste=[];
  ['sonnet','flash'].forEach(function(q){
    var alle=lernGrundlage(q);
    if(!alle.length) return;
    /* 1. Schaetzt sich dieses Gehirn richtig ein? */
    var a=lernAbweichung(alle);
    liste.push({ art:'selbst', quelle:q, n:a.n, staerke:lernStaerke(a.n),
                 beh:a.beh, echt:a.echt, diff:a.diff });
    /* 2. Welcher Markt traegt die Abweichung? Nur Maerkte mit eigener Grundlage nennen —
       ein Markt mit drei Aussagen darf das Urteil nicht bestimmen. */
    var schwach=null;
    ['1x2','tore','btts'].forEach(function(ty){
      var pk=lernGrundlage(q,ty);
      if(pk.length<LERN_HINWEIS) return;
      var ab=lernAbweichung(pk);
      if(!schwach || Math.abs(ab.diff)>Math.abs(schwach.diff)) schwach={ typ:ty, diff:ab.diff, n:ab.n };
    });
    if(schwach) liste.push({ art:'markt', quelle:q, typ:schwach.typ, diff:schwach.diff,
                             n:schwach.n, staerke:lernStaerke(schwach.n) });
    /* 3. Traegt hohe Zuversicht? Wenn eine als sicher ausgegebene Aussage nicht oefter
       zutrifft als eine unsichere, ist die Prozentzahl selbst wertlos — das ist die
       praktisch wichtigste Beobachtung, die sich aus diesen Daten ziehen laesst. */
    var hoch=alle.filter(function(x){ return x.p>=70; });
    var tief=alle.filter(function(x){ return x.p<70; });
    if(hoch.length>=LERN_HINWEIS && tief.length>=LERN_HINWEIS){
      var qh=Math.round(hoch.filter(function(x){return x.ok;}).length/hoch.length*100);
      var qt=Math.round(tief.filter(function(x){return x.ok;}).length/tief.length*100);
      liste.push({ art:'zuversicht', quelle:q, hochQ:qh, tiefQ:qt, hochN:hoch.length, tiefN:tief.length,
                   traegt:(qh>qt), n:Math.min(hoch.length,tief.length),
                   staerke:lernStaerke(Math.min(hoch.length,tief.length)) });
    }
  });
  /* 4. Der Decision Ledger: hat das Uebernehmen einer Vorhersage etwas gebracht? */
  var w=lernWetten();
  if(w.ausKi.n || w.vonHand.n || w.verwaist) liste.push({ art:'wetten', w:w,
      n:Math.min(w.ausKi.n, w.vonHand.n), staerke:lernStaerke(Math.min(w.ausKi.n, w.vonHand.n)) });
  return liste;
}

function footballDataArchivLesen(ziel, cache){
  if(!(ziel&&ziel.length)) return Promise.resolve([]);

  ziel.forEach(function(p){

    return fetch('https://raw.githubusercontent.com/Ondo-Control/Ondo-Control/main/daten/schiri-ergebnisse/'+monat+'.json')
      .then(function(res){ return res.ok ? res.json() : { spiele:[] }; })
      .then(function(d){ var l=Array.isArray(d.spiele) ? d.spiele : []; cache[monat]=l; return l; })
      .catch(function(){ cache[monat]=[]; return []; });

    /* strukturAbgleich() nimmt EINE feste quelleUrl fuer den ganzen Aufruf - die Monatsdatei

       eigenen Anpfiff-Datum (nicht dem Fund im fixtures-Array) auf die menschlich oeffnbare
       GitHub-Seite der zustaendigen Monatsdatei gesetzt, wie beauftragt - nicht die rohe
       raw.githubusercontent.com-Adresse. */
    ergebnisse.forEach(function(r){
      var p=null;
      for(var i=0;i<ziel.length;i++){ if(ziel[i].id===r.id){ p=ziel[i]; break; } }
      var iso = p ? datumIso(p.datum) : '';
      r.quelle = iso
        ? 'https://github.com/Ondo-Control/Ondo-Control/blob/main/daten/schiri-ergebnisse/'+iso.slice(0,7)+'.json'
        : 'https://github.com/Ondo-Control/Ondo-Control/tree/main/daten/schiri-ergebnisse';
    });
    return ergebnisse;
  });
}

/* Reine Funktion: liest einen linescores-Eintrag (displayValue, String) als Zahl, 0 wenn nicht

   oben (Elfmeter-/Verlaengerungs-Sicherheit). */
function espnLinescoreZahl(ls, i){
  var e=(ls||[])[i];

name: TEMP Staging Export
on:
  push:
    branches: [ondotmp2]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ondotmp2
          path: repo
          fetch-depth: 1
      - run: tar --exclude='repo/.git' -czf staging.tar.gz repo
      - uses: actions/upload-artifact@v4
        with:
          name: staging-workspace
          path: staging.tar.gz
          retention-days: 1
          compression-level: 0

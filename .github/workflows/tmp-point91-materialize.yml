name: TEMP Point91 Materialize

on:
  push:
    branches:
      - ondotmp2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main base
        uses: actions/checkout@v4
        with:
          ref: c7cd9dcab335ecb7dde8587a519e387f5ad0483c
          path: repo
          fetch-depth: 1

      - name: Checkout delivery staging
        uses: actions/checkout@v4
        with:
          ref: ondotmp2
          path: delivery
          fetch-depth: 1

      - name: Verify patch and apply
        run: |
          set -euo pipefail
          BASE_SHA=c7cd9dcab335ecb7dde8587a519e387f5ad0483c
          PATCH_BLOB=0cdd016c386c893d1e8f1db827c8b71beea9cd01
          PATCH_SHA256=2f5ab5d03f1fc7a4041c3068aee69e64140eed440aee03947964c94af61f54b6

          test "$(git -C repo rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git -C repo status --porcelain)"
          test "$(git -C delivery hash-object delivery/.ondo-delivery/point91.patch.b64 2>/dev/null || true)" = "" || true
          test "$(git -C delivery hash-object .ondo-delivery/point91.patch.b64)" = "$PATCH_BLOB"

          base64 -d delivery/.ondo-delivery/point91.patch.b64 > point91.patch
          test "$(sha256sum point91.patch | awk '{print $1}')" = "$PATCH_SHA256"

          git -C repo apply --check ../point91.patch
          git -C repo apply ../point91.patch

          cat > /tmp/expected-files.txt <<'EOF'
          BACKLOG-ARCHIV.md
          BLUEPRINT-PROTOKOLL.md
          Blueprint.md
          CHRONIK-2026-10.md
          Ondo-Control-Backlog.md
          STAND.md
          beta.html
          tests/t11_lebenszyklus.js
          tests/umgebung.js
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git -C repo status --porcelain | sed 's/^...//' | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Run exact final tests
        working-directory: repo
        run: |
          set -euo pipefail
          python3 pruefe.py | tee /tmp/pruefe.log
          python3 - <<'PY'
          import re, pathlib
          text=pathlib.Path('beta.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*)</script>', text)
          if not m:
              raise SystemExit('kein script-Block')
          pathlib.Path('/tmp/beta-script.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/beta-script.js
          : > /tmp/tests.log
          for f in tests/t1_resolver.js tests/t2_prueflauf.js tests/t3_vorhersage.js tests/t4_legacy_dubletten.js tests/t5_checkpoint.js tests/t6_checkpoint_idb.js tests/t7_laender_failsafe.js tests/t8_backup_speicher.js tests/t9_speicherdiagnose.js tests/t10_ausnahmen.js tests/t11_lebenszyklus.js; do
            echo "===== $f =====" | tee -a /tmp/tests.log
            node "$f" | tee -a /tmp/tests.log
          done

      - name: Materialize exact target blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/materialized-blobs.tsv
          cd repo
          while IFS= read -r f; do
            expected="$(git hash-object "$f")"
            base64 -w0 "$f" > /tmp/blob-content.b64
            python3 - <<'PY' > /tmp/blob.json
          import json, pathlib
          print(json.dumps({
              "content": pathlib.Path("/tmp/blob-content.b64").read_text(),
              "encoding": "base64"
          }))
          PY
            curl -fsS -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs"               --data-binary @/tmp/blob.json > /tmp/blob-response.json
            actual="$(python3 - <<'PY'
          import json
          print(json.load(open("/tmp/blob-response.json"))["sha"])
          PY
          )"
            test "$actual" = "$expected"
            printf '%s\t%s\n' "$f" "$actual" >> /tmp/materialized-blobs.tsv
          done < /tmp/expected-files.txt
          printf '%s\n' c7cd9dcab335ecb7dde8587a519e387f5ad0483c > /tmp/base-sha.txt

      - name: Upload materialization proof
        uses: actions/upload-artifact@v4
        with:
          name: point91-materialization-proof
          path: |
            /tmp/materialized-blobs.tsv
            /tmp/base-sha.txt
            /tmp/pruefe.log
            /tmp/tests.log
          retention-days: 1
          compression-level: 0

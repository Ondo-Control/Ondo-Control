name: TEMP Point91 v19.22.2 Materialize

on:
  push:
    branches:
      - ondotmp2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main base
        uses: actions/checkout@v4
        with:
          ref: 87b31269183640cbd78831bed372835697092a50
          path: repo
          fetch-depth: 1

      - name: Checkout delivery staging
        uses: actions/checkout@v4
        with:
          ref: ondotmp2
          path: delivery
          fetch-depth: 1

      - name: Apply exact local transformations
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = "87b31269183640cbd78831bed372835697092a50"
          python3 delivery/.ondo-delivery/materialize_v19222.py repo

      - name: Verify exact target blobs and changed files
        working-directory: repo
        run: |
          set -euo pipefail
          cat > /tmp/expected.tsv <<'EOF'
          BACKLOG-ARCHIV.md	77600f2746fb3a44e1dee1ce5ac4fc89bd14ac89
          BLUEPRINT-PROTOKOLL.md	8859d1c9ea6c3872fdd4631df8b937d81f57b7a3
          Blueprint.md	e14f1902986c9446bb564609ded221eb0b23f81c
          CHRONIK-2026-10.md	57e80d9ea4a2d2c16bd69cbdb14c32e9fe2f1733
          Ondo-Control-Backlog.md	12787149dce4a88cc21b4362195af42480a3719a
          STAND.md	4f7b348ecc9c804b4f042adae59063ce356e3cca
          beta.html	06cf2561f8d0e85809bacf3ea82ce3f3fa31fb97
          tests/t11_lebenszyklus.js	38a685e7753a21bfc982c8f5b17f4b2d6368ef38
          tests/umgebung.js	3df941d59ae56ccd4c47a4cb4c788ff0cf8b5b8d
          EOF
          while IFS=$'\t' read -r f sha; do
            test "$(git hash-object "$f")" = "$sha"
          done < /tmp/expected.tsv
          cut -f1 /tmp/expected.tsv | sort > /tmp/expected-files.txt
          git status --porcelain | sed 's/^...//' | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Run exact final tests
        working-directory: repo
        run: |
          set -euo pipefail
          python3 pruefe.py | tee /tmp/pruefe.log
          python3 - <<'PY'
          import re, pathlib
          text=pathlib.Path('beta.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*)</script>', text)
          if not m: raise SystemExit('kein script-Block')
          pathlib.Path('/tmp/beta-script.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/beta-script.js
          : > /tmp/tests.log
          for f in tests/t1_resolver.js tests/t2_prueflauf.js tests/t3_vorhersage.js tests/t4_legacy_dubletten.js tests/t5_checkpoint.js tests/t6_checkpoint_idb.js tests/t7_laender_failsafe.js tests/t8_backup_speicher.js tests/t9_speicherdiagnose.js tests/t10_ausnahmen.js tests/t11_lebenszyklus.js; do
            echo "===== $f =====" | tee -a /tmp/tests.log
            node "$f" | tee -a /tmp/tests.log
          done

      - name: Materialize exact target blobs
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: repo
        run: |
          set -euo pipefail
          : > /tmp/materialized-blobs.tsv
          while IFS=$'\t' read -r f expected; do
            base64 -w0 "$f" > /tmp/blob-content.b64
            python3 - <<'PY' > /tmp/blob.json
          import json, pathlib
          print(json.dumps({"content":pathlib.Path("/tmp/blob-content.b64").read_text(),"encoding":"base64"}))
          PY
            curl -fsS -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/blobs"               --data-binary @/tmp/blob.json > /tmp/blob-response.json
            actual="$(python3 - <<'PY'
          import json
          print(json.load(open("/tmp/blob-response.json"))["sha"])
          PY
          )"
            test "$actual" = "$expected"
            printf '%s\t%s\n' "$f" "$actual" >> /tmp/materialized-blobs.tsv
          done < /tmp/expected.tsv
          printf '%s\n' 87b31269183640cbd78831bed372835697092a50 > /tmp/base-sha.txt

      - name: Upload materialization proof
        uses: actions/upload-artifact@v4
        with:
          name: point91-v19222-materialization-proof
          path: |
            /tmp/materialized-blobs.tsv
            /tmp/base-sha.txt
            /tmp/pruefe.log
            /tmp/tests.log
          retention-days: 1
          compression-level: 0

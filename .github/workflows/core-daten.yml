name: Core-Daten bauen

# Backlog-Punkt 94 (Ondo Core, Stufe 1, Teil 1 - Datenfundament). Baut aus OpenFootball
# (https://github.com/openfootball/football.json, CC0 1.0) und dem eigenen ESPN-Archiv
# (daten/espn-ergebnisse/) den geprueften Spielbestand unter core/data/generated/ und rechnet
# danach das eigene Modell neu (core/model/generated/: aktuelle Staerken und Pruefbericht).
#
# Kein Schluessel, keine Sprachmodelle, keine Quoten. beta.html wird nicht beruehrt.
#
# Zeit: 09:10 UTC - nach dem Morgenlauf des ESPN-Sammlers (08:25 UTC), damit dessen frische
# Ergebnisse am selben Tag eingearbeitet werden. Laeuft der ESPN-Lauf verspaetet, holt der
# naechste Tag es nach; das Bauen haengt nie von der Uhrzeit ab, nur von den Dateien.
#
# Gemeinsame concurrency-Gruppe mit den beiden Ergebnis-Sammlern: nie zwei Schreiber
# gleichzeitig. Vor dem Commit dieselbe fetch/HEAD-Pruefung wie dort - kein automatischer
# Merge, kein Rebase, kein Force.
#
# Meldet das Bauen einen Fehler (z. B. eine Holdout-Saison ist nicht mehr vollstaendig oder
# ein Datensatz ist ungueltig), bricht der Lauf sichtbar ab und schreibt nichts.
#
# Hinweis GitHub: Geplante Laeufe in oeffentlichen Repositories werden nach 60 Tagen ohne
# Repository-Aktivitaet abgeschaltet.
concurrency:
  group: ondo-control-ergebnisse-schreiber
  cancel-in-progress: false

on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:
    inputs:
      mit_quoten:
        description: 'Quoten bei der Odds API abholen (kostet Abrufe aus dem Gratis-Kontingent von 500 im Monat). Nur der Tageslauf holt sie von selbst.'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: OpenFootball holen (nur lesen)
        run: git clone --quiet --depth 1 https://github.com/openfootball/football.json "$RUNNER_TEMP/football.json"

      - name: Datenbestand bauen
        run: node core/data/bauen.js --of "$RUNNER_TEMP/football.json"

      - name: Europapokal-Kalender holen und bauen (nur lesen, CC0)
        run: |
          git clone --quiet --depth 1 https://github.com/openfootball/champions-league "$RUNNER_TEMP/champions-league"
          node core/data/europa_bauen.js --ep "$RUNNER_TEMP/champions-league"

      - name: Test des Datenfundaments
        run: node tests/t12_core_daten.js

      - name: Modell rechnen und pruefen (Wahl, Abschluss, Selbstpruefung)
        run: node core/model/lauf.js

      - name: Test des Modells
        run: node tests/t13_core_modell.js

      - name: Test der Regeln und des Trainingsraums
        run: node tests/t14_core_regeln_raum.js

      - name: Lagen lernen (Wahl der Merkmale, Training in Runden)
        run: node core/model/lagen_lauf.js

      - name: Bericht Lagen lernen (A, B, C) mit Blockbootstrap
        run: node core/model/lagen_bericht.js

      - name: Test Lagen lernen und Stichtag-Sperre
        run: node tests/t17_lagen.js

      - name: Produktionspfad Lagen (Gewichte taeglich neu, versiegelt.json unveraendert)
        run: node core/model/lagen_produktion.js

      - name: Prognose je Spiel (naechste 7 Tage, Position ohne Quote = keine Wette)
        run: node core/model/prognose.js --of "$RUNNER_TEMP/football.json" --ab "$(date -u +%F)"

      - name: Quoten abholen (nur mit Secret ODDS_API_KEY; Rohquoten nie ins Repo)
        if: github.event_name == 'schedule' || inputs.mit_quoten == true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          QUOTEN_ROH_PFAD: ${{ runner.temp }}/quoten_roh.json
        run: node core/model/quoten_holen.js

      - name: Rohquoten privat aufbewahren (Artefakt, 90 Tage, nicht im Repo)
        uses: actions/upload-artifact@v4
        with:
          name: quoten-roh-${{ github.run_id }}
          path: ${{ runner.temp }}/quoten_roh.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Messung Tipico gegen Pinnacle (privates Archiv als Artefakt, Bericht nur mit Summenzahlen)
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTEN_ROH_PFAD: ${{ runner.temp }}/quoten_roh.json
          WERT_ARCHIV_ALT: ${{ runner.temp }}/wert_alt/wert_archiv.json
          WERT_ARCHIV_NEU: ${{ runner.temp }}/wert_neu/wert_archiv.json
        run: |
          mkdir -p "$RUNNER_TEMP/wert_alt" "$RUNNER_TEMP/wert_neu"
          alt=$(gh run list --workflow "Core-Daten bauen" --status success --limit 20 --json databaseId -q '.[].databaseId' | head -n 20 | while read id; do if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" -q '.artifacts[] | select(.name=="wert-archiv" and .expired==false) | .id' | grep -q .; then echo $id; break; fi; done)
          if [ -n "$alt" ]; then gh run download "$alt" -n wert-archiv -D "$RUNNER_TEMP/wert_alt" || true; fi
          node core/model/wert_messung.js

      - name: Wert-Archiv privat aufbewahren (Artefakt, 90 Tage, nicht im Repo)
        uses: actions/upload-artifact@v4
        with:
          name: wert-archiv
          path: ${{ runner.temp }}/wert_neu/wert_archiv.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Fehleranalyse (wo liegt der Core systematisch daneben?)
        run: node core/model/fehleranalyse.js

      - name: Test der Quelle Bzzoiro (nur Zaehlwerte, nur mit Secret BSD_API_KEY)
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: node core/model/bsd_probe.js

      - name: Prognose-Archiv (Vorab-Tipps ablegen, Ergebnisse bewerten)
        run: node core/model/prognose_archiv.js

      - name: Test Prognose, Quote-Gatter, Archiv
        run: |
          node tests/t18_prognose.js
          node tests/t19_quoten.js
          node tests/t20_archiv.js
          node tests/t21_produktion.js
          node tests/t22_lerntest_versteckt.js
          node tests/t23_merkmalswahl_versteckt.js
          node tests/t24_nichtlinear.js
          node tests/t25_kommende_spiele.js
          node tests/t26_neue_merkmale.js
          node tests/t27_wert_messung.js
          node tests/t28_fehleranalyse.js
          node tests/t29_motivation.js
          node tests/t30_reise.js
          node tests/t31_wetter.js

      - name: Aenderung committen, falls vorhanden
        run: |
          git config user.name "Ondo-Control-Automatik"
          git config user.email "actions@users.noreply.github.com"
          git add core/data/generated/ core/model/generated/
          if git diff --cached --quiet; then
            echo "Keine Aenderung - nichts zu committen."
          else
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::error::main hat sich seit dem Checkout bewegt (HEAD ist nicht mehr origin/main) - sichtbarer Abbruch vor dem Commit. Kein automatischer Merge, kein Rebase, kein Force. Der naechste Lauf holt den aktuellen Stand neu."
              exit 1
            fi
            git commit -m "Core: automatischer Bau (Daten und Modell)"
            git push
          fi

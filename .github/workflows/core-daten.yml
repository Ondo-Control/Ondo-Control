name: Core-Datenfundament aktualisieren

# Backlog-Punkt 94, Core Stufe 1 Teil 1.
# Keine Schluessel, keine Quoten, kein Modell, keine LLM-Aufrufe. OpenFootball wird als
# separates oeffentliches CC0-Repository ausgecheckt; ESPN wird nur aus dem bereits im Repo
# vorhandenen Archiv gelesen. Der Workflow schreibt ausschliesslich kleine abgeleitete Dateien
# unter core/data/generated/ und committet nur bei echtem Diff.
#
# GitHub-Hinweis: In oeffentlichen Repositories koennen geplante Workflows nach 60 Tagen ohne
# Repository-Aktivitaet automatisch deaktiviert werden. workflow_dispatch bleibt fuer einen
# manuellen Neustart vorhanden.
#
# Gemeinsame Concurrency-Gruppe mit den bestehenden Ergebnis-Schreibern: keine zwei regulären
# Repository-Writer gleichzeitig. Wie dort gilt: keine FIFO-Garantie fuer beliebig viele Runs.
concurrency:
  group: ondo-control-ergebnisse-schreiber
  cancel-in-progress: false

on:
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: ONDO Control auschecken
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: OpenFootball CC0 auschecken
        uses: actions/checkout@v4
        with:
          repository: openfootball/football.json
          ref: master
          path: openfootball
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lizenz und Quellenstand pruefen
        run: |
          set -euo pipefail
          test -f openfootball/LICENSE.md
          grep -q 'CC0 1.0 Universal' openfootball/LICENSE.md
          echo "OPENFOOTBALL_COMMIT=$(git -C openfootball rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Kleine abgeleitete Core-Daten bauen
        working-directory: repo
        env:
          OPENFOOTBALL_DIR: ../openfootball
        run: node core/data/build.js

      - name: Datenfundament testen
        working-directory: repo
        run: |
          set -euo pipefail
          node tests/t12_core_daten.js
          python3 pruefe.py

      - name: Nur bei Aenderung committen
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name "Ondo-Control-Automatik"
          git config user.email "actions@users.noreply.github.com"
          git add core/data/generated/
          if git diff --cached --quiet; then
            echo "Keine Aenderung - nichts zu committen."
          else
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::error::main hat sich seit dem Checkout bewegt - sichtbarer Abbruch. Kein Merge, kein Rebase, kein Force."
              exit 1
            fi
            git commit -m "Core-Daten: Coverage aktualisieren"
            git push
          fi

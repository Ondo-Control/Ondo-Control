name: TEMP Ondo Control Workspace Export Proof

on:
  push:
    branches:
      - ondotmp2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact base
        uses: actions/checkout@v4
        with:
          ref: c7cd9dcab335ecb7dde8587a519e387f5ad0483c
          path: repo
          fetch-depth: 1
      - name: Verify and package exact workspace
        env:
          BASE_SHA: c7cd9dcab335ecb7dde8587a519e387f5ad0483c
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git -C repo status --porcelain)"
          printf '%s\n' "$BASE_SHA" > workspace-base-sha.txt
          find repo -type f ! -path 'repo/.git/*' -print0 | sort -z | xargs -0 sha256sum > workspace-sha256.txt
          tar --exclude='repo/.git' -czf ondo-control-workspace.tar.gz repo
          echo "files=$(find repo -type f ! -path 'repo/.git/*' | wc -l)"
          echo "dirs=$(find repo -type d ! -path 'repo/.git*' | wc -l)"
          ls -lh ondo-control-workspace.tar.gz workspace-sha256.txt workspace-base-sha.txt
      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: ondo-control-workspace-proof
          path: |
            ondo-control-workspace.tar.gz
            workspace-sha256.txt
            workspace-base-sha.txt
          retention-days: 1
          compression-level: 0

name: TEMP Core Data Workspace Export

on:
  push:
    branches:
      - ondotmp2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2fa48c3213c6a361aa6b4a834e6e7ff7135417ed
          path: repo
          fetch-depth: 1
      - name: Verify exact base
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = "2fa48c3213c6a361aa6b4a834e6e7ff7135417ed"
          test -z "$(git -C repo status --porcelain)"
          tar --exclude='repo/.git' -czf ondo-core-data-workspace.tar.gz repo
          printf '%s\n' 2fa48c3213c6a361aa6b4a834e6e7ff7135417ed > base-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ondo-core-data-workspace
          path: |
            ondo-core-data-workspace.tar.gz
            base-sha.txt
          retention-days: 1
          compression-level: 0
